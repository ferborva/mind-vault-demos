<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Tricks</title>
<style>
  :root{
    --bg:#101a2e; --panel:#1b2842; --panel2:#22304e; --ink:#f2f6ff; --muted:#93a3c4;
    --line:#2c3c5e; --hot:#ffb020; --hot-ink:#3a2500; --good:#3ddc97; --bad:#ff6b6b;
    --p1:#ffb020; --p2:#7aa2ff; --p3:#ff8fc7; --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--ink); overflow-x:hidden;
    font:600 18px/1.45 ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif;}
  .wrap{max-width:620px; margin:0 auto; padding:18px 16px 60px; text-align:center}
  h1{font-size:32px; line-height:1.1; margin:6px 0 4px; letter-spacing:-.02em}
  h2{font-size:24px; margin:0 0 6px}
  p{margin:0 0 12px}
  .muted{color:var(--muted); font-weight:600; font-size:16px}
  button{font:800 20px/1 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
    background:var(--hot); color:var(--hot-ink); border:0; border-radius:999px;
    padding:15px 32px; cursor:pointer; box-shadow:0 5px 0 #c9820f; margin-top:10px;}
  button:active{transform:translateY(3px); box-shadow:0 2px 0 #c9820f}
  button.calm{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
  button.calm:active{transform:none}
  .card{background:var(--panel); border-radius:var(--radius); padding:20px 18px; margin:12px 0}
  /* mode chooser */
  .mode{display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    background:var(--panel); border:2px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:11px; cursor:pointer; color:inherit; box-shadow:none;
    font-family:inherit;}
  .mode:active{transform:scale(.985); box-shadow:none}
  .mode .ic{font-size:40px; line-height:1; flex:0 0 auto}
  .mode .tx{flex:1}
  .mode .tt{display:block; font-size:19px; font-weight:800; line-height:1.2}
  .mode .ds{display:block; font-size:14.5px; color:var(--muted); font-weight:600; margin-top:3px; line-height:1.3}
  .mode .bs{font-size:13px; font-weight:800; color:var(--hot-ink); background:var(--hot);
    border-radius:999px; padding:5px 11px; white-space:nowrap}
  .mode.m1{border-color:var(--p1)} .mode.m2{border-color:var(--p2)} .mode.m3{border-color:var(--p3)}
  /* stage */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:280px; background:var(--panel); border-radius:var(--radius); padding:18px}
  .big{font-size:96px; line-height:1; margin:0}
  .word{font-size:27px; font-weight:800; margin-top:6px}
  .link{color:var(--hot); font-size:17px; font-weight:700; margin-top:12px; max-width:430px; min-height:46px}
  .pips{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .pip{width:9px;height:9px;border-radius:99px;background:var(--line)} .pip.on{background:var(--hot)}
  /* grids */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px}
  .tile{aspect-ratio:1;font-size:33px;background:var(--panel);border:2px solid var(--line);
    border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    position:relative;padding:0;box-shadow:none;color:inherit}
  .tile:active{transform:scale(.94);box-shadow:none}
  .tile.picked{border-color:var(--hot);background:#2a3555}
  .tile.right{border-color:var(--good);background:rgba(61,220,151,.16)}
  .tile.wrong{border-color:var(--bad);background:rgba(255,107,107,.14);opacity:.75}
  .tile.missed{border-style:dashed;border-color:var(--good);opacity:.55}
  .tick{position:absolute;top:-8px;right:-8px;font-size:19px}
  /* multiple choice */
  .opts{display:grid;gap:10px;margin-top:14px}
  .opt{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:15px;
    font:800 19px/1 inherit;cursor:pointer;box-shadow:none;color:inherit;font-family:inherit}
  .opt:active{transform:scale(.98);box-shadow:none}
  .opt.right{border-color:var(--good);background:rgba(61,220,151,.18)}
  .opt.wrong{border-color:var(--bad);opacity:.7}
  /* palace */
  .spots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  .spot{background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:12px 6px}
  button.spot{box-shadow:none; background:var(--panel)}
  button.spot:active{transform:scale(.96); box-shadow:none}
  .spot .se{font-size:34px} .spot .sn{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px}
  .spot.placed{border-style:solid;border-color:var(--p2)}
  .spot .put{font-size:26px;margin-top:4px}
  /* progress curve */
  .cv-card{padding:14px 12px 10px}
  .cv{display:block;width:100%;height:120px;overflow:visible}
  .cv-sm .cv{height:64px}
  .cv-l{fill:none;stroke:var(--good);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;
    vector-effect:non-scaling-stroke}
  .cv-a{fill:var(--good);opacity:.13;stroke:none}
  .cv-d circle{fill:var(--p2);stroke:var(--panel);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .cv-cap{font-size:13.5px;color:var(--muted);font-weight:700;margin:8px 0 0}
  .cv-t{font-size:16px;font-weight:800;margin:0 0 6px;text-align:left;display:flex;
    align-items:center;gap:7px}
  .cv-t .ic{width:22px;height:22px}
  .cv-m{stroke:var(--p3);stroke-width:2;opacity:.4;stroke-linecap:round;
    stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
  .ms{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .ms:last-child{border-bottom:none}
  .ms .ic{width:26px;height:26px}
  .ms-t{flex:1;font-size:16px;font-weight:800}
  .ms-d{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
  /* screen-reader only: the chart said in sentences */
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  /* regularity grid */
  .wk-head{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 auto 5px;max-width:270px}
  .wk-head span{font-size:11px;font-weight:800;color:var(--muted);text-align:center}
  .grid-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:270px;margin:0 auto}
  .gd{aspect-ratio:1;border-radius:5px;background:var(--line);opacity:.55}
  .gd.g1{background:var(--good);opacity:.34}
  .gd.g2{background:var(--good);opacity:.62}
  .gd.g3{background:var(--good);opacity:1}
  .gd.gf{opacity:.18}
  .score{font-size:58px;font-weight:800;line-height:1;margin:6px 0 2px}
  .bars{display:flex;flex-direction:column;gap:11px;margin:16px 0 4px;text-align:left}
  .bar b{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
  .track{background:var(--line);border-radius:99px;height:28px;overflow:hidden}
  .fill{height:100%;background:var(--hot);color:var(--hot-ink);border-radius:99px;display:flex;
    align-items:center;justify-content:flex-end;padding-right:11px;font-size:15px;font-weight:800;
    width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .fill.best{background:var(--good)}
  .tip{background:var(--panel);border-left:4px solid var(--hot);border-radius:0 12px 12px 0;
    padding:13px 15px;margin-bottom:10px;text-align:left}
  .tip.lock{opacity:.45;border-left-color:var(--line)}
  .tip b{display:block;font-size:17px;margin-bottom:3px}
  .tip span{font-size:15px;color:var(--muted);font-weight:600}
  /* Twemoji sprite icons — vector, identical on every device, zero network requests */
  .ic{width:1em;height:1em;display:inline-block;vertical-align:-.125em;flex:0 0 auto}
  .big .ic{width:96px;height:96px;display:block}
  .tile .ic{width:34px;height:34px}
  .spot .se .ic{width:34px;height:34px}
  .mode .ic-lg{width:40px;height:40px;display:block}
  .opt .ic{width:24px;height:24px;vertical-align:-.3em;margin-right:6px}
  /* motion, focus, and respect for people who don't want either */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  .card,.stage,.mode,.tip{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
  .opts .opt{animation:rise .26s cubic-bezier(.2,.8,.2,1) both}
  .opts .opt:nth-child(2){animation-delay:.04s}
  .opts .opt:nth-child(3){animation-delay:.08s}
  .opts .opt:nth-child(4){animation-delay:.12s}
  .tile.picked .tick,.tile.right .tick,.tile.wrong .tick{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
  .big .ic{animation:pop .32s cubic-bezier(.2,.8,.2,1) both}
  :focus-visible{outline:3px solid var(--hot); outline-offset:3px; border-radius:10px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important}
  }
  /* Number Lock */
  .digits{font:800 46px/1.1 ui-rounded,system-ui,sans-serif;letter-spacing:.14em;
    display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .digits .chunk{background:var(--panel2);border-radius:12px;padding:6px 12px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:14px auto 0}
  .key{font:800 26px/1 ui-rounded,system-ui,sans-serif;background:var(--panel2);
    border:2px solid var(--line);border-radius:14px;padding:16px 0;cursor:pointer;color:inherit;box-shadow:none}
  .key:active{transform:scale(.94);box-shadow:none}
  .entry{font:800 34px/1.2 ui-rounded,system-ui,sans-serif;letter-spacing:.12em;min-height:44px;
    color:var(--hot);word-break:break-all}
  .shape{display:flex;align-items:center;gap:10px;justify-content:center;font-size:17px;margin:4px 0}
  .shape .ic{width:30px;height:30px}
  .hidden{display:none}
</style>
</head>

   Each teaches a nameable method the player keeps; none of them

  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to;return;}
  const t0=performance.now();
  (function tick(now){const k=Math.min(1,(now-t0)/ms);
    el.textContent=Math.round(to*(1-Math.pow(1-k,3)));
    if(k<1)requestAnimationFrame(tick);})(t0);
}

   Best scores, levels and badges all answer "how good are you now" and none of
   them answers "are you getting better", so every completed round is appended
   here and every chart reads from this one list.

   The awkward fact this has to survive: THE DIFFICULTY ENGINE MOVES THE GOAL.
   Someone who improves gets promoted, and their raw score falls. Plotting the
   raw score would show a FALLING line to a player who is genuinely improving,
   which is worse than showing no line at all. So each entry also records what a
   pure guesser would have got and how much looking time was allowed, and the
   curve is drawn from those. */
const HIST_MAX=400;
/* ONE ROW PER SESSION, and it is the LAST round.
   A Silly Film session is three rounds: cold with no technique, then guided
   with the links supplied, then your own. Only the third measures the thing
   being taught. Logging round 1 would drag the curve down every session with a
   score deliberately taken WITHOUT the method, and round 2 is the game's work,
   not the player's. */
function logRound(mode,right,total,chance){
  P.hist=P.hist||[];
  P.hist.push({m:mode, r:right, t:total, l:lv(mode),
               c:Math.round((chance||0)*100)/100, ts:Date.now()});
  if(P.hist.length>HIST_MAX) P.hist=P.hist.slice(-HIST_MAX);
}
/* Expected hits from pure guessing.

   Grid recall is scored against the tiles actually TAPPED, not against the
   number hidden. Nobody is forced to pick exactly n, so charging the guess
   floor on picks means tapping four you are sure of costs a floor of four --
   careful play is rewarded and spraying the grid is not.

   Multiple choice: every question is answered, so it is one in `opts` each
   time. Keypad: 1 in 10^digits. Call it zero. */
function chanceGrid(picks,items,tiles){ return tiles? (picks*items)/tiles : 0; }
function chanceQuiz(t,opts){ return opts? t/opts : 0; }

/* Memory Power -- the honest, difficulty-adjusted unit this whole arc rests on.
   "How many you got that guessing wouldn't have given you", scaled by how much
   less looking time the level allowed than level 1 did. Both corrections are
   computed from LEVELS[] rather than tuned by hand, so they stay true if the
   difficulty tables ever change. It is deliberately NOT a currency: it cannot
   be spent, traded, or set against another player -- it is a measurement of the
   skill itself, which is why it survives the app being deleted. */
function exposureFactor(l){
  const a=LEVELS[0].ms, b=LEVELS[Math.min(MAXLV,Math.max(1,l))-1].ms;
  return b? a/b : 1;
}
function power(h){
  return Math.max(0, (h.r-(h.c||0))) * exposureFactor(h.l||1);
}

/* ---------- Difficulty engine ----------
   Levels scale items, exposure and distractors; picking is never forced, so
   filling in guesses cannot inflate a score; and difficulty follows demonstrated
   ability, stepping DOWN after repeated failure rather than grinding someone
   down. A player who feels stupid leaves. */
const LEVELS=[
  {n:6, ms:2600, tiles:18},
  {n:8, ms:2400, tiles:24},
  {n:8, ms:2000, tiles:28},
  {n:10,ms:1900, tiles:30},
  {n:12,ms:1700, tiles:32},
  {n:14,ms:1500, tiles:36}
];
const MAXLV=LEVELS.length;
/* per-mode shaping of the same level number */
const PALACE_SPOTS=[6,6,8,8,10,12];       // route length grows
const PALACE_DOUBLE=4;                     // from L4: two things per place
const NAME_CAST   =[6,6,8,8,10,12];        // more people to keep straight
const NAME_OPTS   =[4,4,5,6,7,8];          // and more names to choose between
const PALACE_OPTS =[4,4,5,6,7,8];          // cued recall needs a falling guess floor
const PLACE_MS    =[3600,3400,3000,2600,2300,2000];  // less time to build each picture
const MEET_MS     =[3600,3400,3000,2600,2300,2000];
const SHUFFLE_FROM=4;                      // from L4 the walk is out of route order
const NUM_LEN =[4,5,6,8,10,12];            // Number Lock: digits to hold
const NUM_MS  =[5000,4600,4200,3800,3400,3000];
/* Number shapes: a digit is hard to picture, a thing is easy. */
const SHAPES={0:['🍩','doughnut'],1:['🕯️','candle'],2:['🦢','swan'],3:['🦋','butterfly'],
 4:['🪁','kite'],5:['🪝','hook'],6:['🍒','cherry'],7:['🪃','boomerang'],8:['⛄','snowman'],9:['🎈','balloon']};
const ORDERED_FROM=4;                      // Silly Film: recall IN ORDER from L4
const isOrdered=m=>lv(m)>=ORDERED_FROM;
function lv(mode){ return Math.min(MAXLV, Math.max(1, (P.lv&&P.lv[mode])||1)); }
function cfg(mode){ return LEVELS[lv(mode)-1]; }
/* level-up needs real mastery; level-down after two poor rounds in a row */
function grade(mode,right,wrong,total){
  P.lv=P.lv||{}; P.miss=P.miss||{};
  const cur=lv(mode);
  const strong = right>=Math.ceil(total*0.75) && wrong<=1;
  const weak   = right< Math.ceil(total*0.4);
  let moved=0;
  if(strong && cur<MAXLV){ P.lv[mode]=cur+1; P.miss[mode]=0; moved=1; }
  else if(weak){ P.miss[mode]=(P.miss[mode]||0)+1;
    if(P.miss[mode]>=2 && cur>1){ P.lv[mode]=cur-1; P.miss[mode]=0; moved=-1; } }
  else P.miss[mode]=0;
  save(P); return moved;
}
function pick(n){ const a=POOL.filter(e=>!used.includes(e)); const g=sh(a).slice(0,n); used=used.concat(g); return g; }


/* ---------- Endgame ----------
   Badges mark real feats rather than participation, and the Grand Tour only
   opens once the first three tricks are at level 3 -- so a veteran has
   something that did not exist on day one. */
const BADGES=[
 {id:'first', ic:'🎬', t:'First film',      d:'Finish Silly Film once'},
 {id:'walk',  ic:'🏠', t:'House walker',    d:'Walk your own palace'},
 {id:'names', ic:'🙂', t:'Good with names', d:'Name a whole room of people'},
 {id:'perfect',ic:'🏆',t:'Nothing missed',  d:'A perfect score, any trick'},
 {id:'order', ic:'🚂', t:'In order',        d:'A perfect round, in order'},
 {id:'long',  ic:'🦒', t:'Long route',      d:'A palace of 8 places or more'},
 {id:'crowd', ic:'🎈', t:'Big crowd',       d:'Name 10 people in one go'},
 {id:'three', ic:'🧠', t:'All three tricks', d:'Level 3 in every trick'},
 {id:'lock',  ic:'🔒', t:'Locksmith',      d:'Crack a Number Lock'},
 {id:'kept',  ic:'🦉', t:'Still got it',   d:'Perfect recall a day later'},
 {id:'tour',  ic:'🎉', t:'Grand Tour',      d:'Finish the Grand Tour'}
];
/* Badges store WHEN, not just whether. A timestamp is still truthy, so older
   saves keep working -- they simply have no date, and the milestone list skips
   them rather than inventing one. */
function award(id){ P.badges=P.badges||{}; if(P.badges[id]) return false;
  P.badges[id]=Date.now(); save(P); return true; }
function hasBadge(id){ return !!(P.badges&&P.badges[id]); }
function badgeCount(){ return BADGES.filter(b=>hasBadge(b.id)).length; }
function checkMastery(){ if([1,2,3].every(i=>lv('m'+i)>=3)) return award('three'); return false; }
const tourOpen=()=>[1,2,3].every(i=>lv('m'+i)>=3);
function badges(){
  app.innerHTML=`<h1>Your badges</h1>

        : `<div class="spot" style="opacity:.35"><div class="se">${ic(b.ic)}</div><div class="sn">${b.d}</div></div>`

}

/* ================= MODE 4 — NUMBER LOCK =================
   Digits are the material this age meets most and holds worst.
   Teaches chunking, then number-shape pegs. Round 3 lets the player
   choose where to split -- no split is objectively best, so it is a
   genuine meaningful choice rather than a quiz with a right answer.
   No arithmetic is ever asked: this is memory for numbers, not numeracy. */
function m4intro(){
  S={};
  app.innerHTML=`<h1>🔒 Number Lock</h1>
    <p class="muted">Phone numbers, dates, PINs — the stuff that slides straight out.</p>
    <div class="stage"><p class="big">${ic('🔒')}</p><p class="word">How many digits?</p>
    <p class="muted" style="margin-top:8px">A number will flash up. Tap it back.</p></div>
    <button onclick="m4r1()">Play</button>
    <button class="calm" onclick="home()" style="display:block;margin:8px auto 0">Back</button>`;
}
function makeNum(n){ return Array.from({length:n},()=>Math.floor(Math.random()*10)); }
function showNum(num,label,ms,chunks,cb){
  const body = chunks
    ? `<div class="digits">${chunks.map(c=>`<span class="chunk">${c.join('')}</span>`).join('')}</div>`
    : `<div class="digits">${num.join('')}</div>`;
  app.innerHTML=`<p class="muted">${label}</p><div class="stage">${body}
    <p class="link">${chunks?"Three small things beat one long thing.":"Hold it however you can."}</p></div>`;
  setTimeout(cb,ms);
}
function keypad(num,label,cb){
  const got=[];
  function draw(){
    app.innerHTML=`<p class="muted">${label}</p><h2>Tap it back</h2>
      <p class="entry">${got.join('')||'&nbsp;'}</p>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-d="${d}">${d}</button>`).join('')}

      </div>`;
    document.querySelectorAll('.key[data-d]').forEach(b=>b.onclick=()=>{
      if(got.length<num.length){got.push(+b.dataset.d);draw();}});
    document.getElementById('del').onclick=()=>{got.pop();draw();};
    const ok=document.getElementById('ok');
    if(got.length) ok.onclick=()=>{
      let right=0; num.forEach((d,i)=>{ if(got[i]===d) right++; });
      app.innerHTML=`<p class="muted">${label}</p>
        <div class="card"><p class="muted" style="font-size:15px">THE NUMBER</p>
          <div class="digits">${num.map((d,i)=>`<span class="chunk" style="border:2px solid ${got[i]===d?'var(--good)':'var(--bad)'}">${d}</span>`).join('')}</div>
          <p class="muted" style="font-size:15px;margin-top:10px">YOU TAPPED</p>
          <div class="digits">${num.map((d,i)=>`<span class="chunk">${got[i]!==undefined?got[i]:'·'}</span>`).join('')}</div>
          <p class="score"><span class="cnum" data-to="${right}">0</span><span style="font-size:23px;color:var(--muted)">/${num.length}</span></p></div>

function m4r1(){
  const C=NUM_LEN[lv('m4')-1], num=makeNum(C);
  showNum(num,`Level ${lv('m4')} · Round 1 — just remember it`,NUM_MS[lv('m4')-1],null,()=>
    keypad(num,"Round 1",(r,t)=>{ S.r1={r,t};
      app.innerHTML=`<p class="muted">Round 1</p><div class="card">
        <p class="score"><span class="cnum" data-to="${r}">0</span><span style="font-size:23px;color:var(--muted)">/${t}</span></p>
        <p class="muted">Long numbers slide out fast. There's a way round it.</p>

}
function m4teach(){
  app.innerHTML=`<p class="muted">The trick</p>
    <div class="card" style="text-align:left">
      <p style="font-size:21px"><b>1. Break it up.</b></p>
      <p class="muted" style="font-size:17px">Nobody remembers <b>0 7 3 9 1 4 2 8</b>.
      Everybody remembers <b>0739 · 1428</b>. Same digits, two things instead of eight.</p>
      <p style="font-size:21px;margin-top:16px"><b>2. Turn digits into things.</b></p>

function chunkOf(num){ const out=[];for(let i=0;i<num.length;i+=(num.length>6?4:3)) out.push(num.slice(i,i+(num.length>6?4:3)));return out; }
function m4r2(){
  const C=NUM_LEN[lv('m4')-1], num=makeNum(C);
  showNum(num,`Level ${lv('m4')} · Round 2 — in chunks`,NUM_MS[lv('m4')-1]+800,chunkOf(num),()=>
    keypad(num,"Round 2",(r,t)=>{ S.r2={r,t}; const up=r-S.r1.r;
      app.innerHTML=`<p class="muted">Round 2</p><div class="card">

          :up===0?`Same as last time — try smaller chunks.`:`Tricky one. Chunk it differently.`}</p></div>

/* Plant Picker: where to split is preference, not correctness. */
function m4r3(){
  const C=NUM_LEN[lv('m4')-1], num=makeNum(C);
  const cuts=new Set();
  function draw(){
    const chunks=[];let last=0;

          <div class="bar"><b>Round 2 — our chunks</b><div class="track"><div class="fill" id="f2">${S.r2.r}/${S.r2.t}</div></div></div>
          <div class="bar"><b>Round 3 — your chunks</b><div class="track"><div class="fill best" id="f3">${r}/${t}</div></div></div>
        </div></div>

          <b style="color:var(--good)">Level ${lv('m4')} unlocked! 🎉</b> Longer numbers next.</p></div>`
        :mv===-1?`<div class="card"><p class="muted" style="margin:0">Back a level — shorter numbers next time.</p></div>`:``}
        ${mastery?`<div class="card" style="border:2px solid var(--good)"><p style="margin:0;font-size:19px">${ic('🧠')} <b style="color:var(--good)">Badge: All three tricks</b></p></div>`:``}
        <div class="card" style="text-align:left"><p style="font-size:20px"><b>Yours now. 🔒</b></p>
        <p class="muted" style="font-size:16px">Break it up, then picture it. Works on phone numbers,
        dates, door codes — anything with digits.</p></div>
        <button onclick="home()">Pick another trick</button>
        ${progressLink()}`;
      setTimeout(()=>{document.getElementById('f1').style.width=Math.max(pc(S.r1),16)+'%';
        document.getElementById('f2').style.width=Math.max(pc(S.r2),16)+'%';

/* ---------- Spaced recall ----------
   The testing effect is the most replicated finding in memory research, and
   every other screen here tests you seconds after learning, which measures the
   wrong thing. Items go into a vault with a timestamp and come back after a
   real interval.

   It is an OFFER on the home screen, never a demand. There is no streak to
   break, no penalty for being away, and being absent for a month costs
   nothing. An appointment mechanic that punished absence would be a different
   game, and not one worth building for a child. */
const KIND={m1:['Things from your film','the things in your film'],
            m2:['Things you hid','the things you hid around your room'],
            m3:['People you met','the people you met'],
            m4:['A number you locked','the number you locked']};
const kind=v=>KIND[v.m]||KIND.m1;
const RECALL_AFTER = 20*60*60*1000;          // ~a day later, not a nagging loop
/* One vault, three kinds of material -- because a retention offer that covered
   only two of the four games would quietly teach that the other two don't stick. */
function vaultAdd(mode,payload){
  /* `l` is the level the material was learned at, so the day-later check is
     sized from it and gets harder exactly as the player does. */
  const e={m:mode,ts:Date.now(),l:lv(mode)};
  if(mode==='m3'){ if(!payload||!payload.length) return; e.k='faces'; e.cast=payload.slice(0,8); }
  else if(mode==='m4'){ if(!payload||!payload.length) return; e.k='num'; e.num=payload.slice(0,12); }
  else { if(!payload||!payload.length) return; e.k='grid'; e.items=payload.slice(0,8); }
  P.vault=(P.vault||[]).concat([e]).slice(-12);
  save(P);
}
function vaultDue(){
  const now=Date.now();
  return (P.vault||[]).filter(v=>now-v.ts>=RECALL_AFTER);
}
function ago(ts){
  const h=Math.floor((Date.now()-ts)/3600000);
  if(h<48) return 'yesterday';
  const d=Math.round(h/24);
  return d+' days ago';
}
function recallOffer(){
  const due=vaultDue(); if(!due.length) return '';
  return `<button class="mode" style="border-color:var(--good)" onclick="spacedStart()">
    <span class="ic-wrap">${ic('🧠','ic-lg')}</span>
    <span class="tx"><span class="tt">Still got it?</span>
    <span class="ds">${kind(due[0])[0]} ${ago(due[0].ts)} — 1 minute</span></span></button>`;
}
function spacedStart(){
  const due=vaultDue(); if(!due.length) return home();
  const v=due[0];
  app.innerHTML=`<h1>Still got it?</h1>
    <p class="muted">This is ${kind(v)[1]} ${ago(v.ts)}. No pressure — this is the interesting bit.</p>
    <div class="card"><p class="muted" style="font-size:16px">Remembering something a day later is
    the part that actually counts. <b>Trying to remember it is what makes it stick</b> — more than
    looking at it again would.</p></div>
    <button onclick="spacedRun()">Let's see</button>
    <button class="calm" onclick="home()" style="display:block;margin:8px auto 0">Later</button>`;
  window.__v=v;
}
function spacedRun(){
  const v=window.__v;
  const done=(r,t)=>{
    P.vault=(P.vault||[]).filter(x=>x!==v);
    P.ret=P.ret||[]; P.ret.push({r,t,ts:Date.now()}); P.ret=P.ret.slice(-20);
    if(r===t) award('kept');
    save(P);
    const pct=Math.round(100*r/t);
    app.innerHTML=`<h1>${pct>=70?"Still there. 🧠":"Some of it stayed"}</h1>
      <div class="card"><p class="score"><span class="cnum" data-to="${r}">0</span><span style="font-size:23px;color:var(--muted)">/${t}</span></p>
      <p class="muted">${pct>=70?"That is the trick working. A day later is the real test."
        :"Normal — a day is a long time. The ones you got are the ones the picture held."}</p></div>
      <div class="card" style="text-align:left"><p style="font-size:19px"><b>Why this matters</b></p>
      <p class="muted" style="font-size:16px">Testing yourself beats re-reading, every time.
      That is the whole reason this screen exists.</p></div>
      <button onclick="home()">Back</button>`;
  };
  const L=Math.min(MAXLV,Math.max(1,v.l||1));
  if(v.k==='faces'){
    const opts=NAME_OPTS[L-1];
    const qs=sh(v.cast.slice()).map(pr=>({cue:pr.f,cueText:"",ask:"Who's this?",answer:pr.n,
      options:[{v:pr.n,label:pr.n}].concat(
        sh(PEOPLE.filter(x=>x.n!==pr.n)).slice(0,opts-1).map(x=>({v:x.n,label:x.n})))}));
    return quiz(qs,"Still got it?",done);
  }
  if(v.k==='num') return keypad(v.num,"Still got it?",done);
  /* wider decoy field with level, and the order counts once it counts in the mode itself */
  const spread=3+Math.min(2,Math.floor((L-1)/2));
  gridRecall(v.items,"Still got it?",done,Math.min(36,v.items.length*spread),L>=ORDERED_FROM);
}
/* ---------- The curve ----------
   Hand-rolled inline SVG, no chart library: a 40KB dependency to draw twenty
   points would undo the whole performance budget.

   TWO SERIES, and the pairing is the honest part:
     - a DOT per day, which can and does go down;
     - a BEST-EVER line, which is monotone by construction.
   The line gives the upward shape that makes progress legible; the dots keep it
   truthful, because a flat run of dots under a flat line is visibly a plateau.
   A chart that only ever rises is flattery, and children detect flattery faster
   than adults do. */
const MODE_NAME={m1:'Silly Film',m2:'Memory Palace',m3:'Name Game',m4:'Number Lock'};
const MODE_IC={m1:'🎬',m2:'🏠',m3:'🙂',m4:'🔒'};
function hist(mode){ return (P.hist||[]).filter(h=>!mode||h.m===mode); }
const dayKey=ts=>{ const d=new Date(ts); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); };

/* The headline chart is ONE DOT PER DAY, which is a correction rather than a
   simplification. Plotting every attempt on a single axis silently compares the
   modes against each other: a Name Game round is worth fewer points than a
   level-3 Silly Film round, so a session spent on the cheaper trick drew a
   cliff that looked like the player falling apart.

   The day's BEST round is a fair summary of a day: it does not reward grinding
   one trick twenty times, and a weak day still shows as a low dot. Per-mode
   charts stay per-attempt, where the comparison is valid. */
function byDay(rows){
  const m=new Map();
  rows.forEach(h=>{ const k=dayKey(h.ts), v=power(h);
    if(!m.has(k)||m.get(k).v<v) m.set(k,{v,ts:h.ts,k}); });
  return [...m.values()].sort((a,b)=>a.ts-b.ts);
}

function curveSVG(rows,W,H,pre,marks){
  const pad={l:8,r:8,t:12,b:10};
  const pts=pre? rows.map(d=>d.v) : rows.map(power);
  const hi=Math.max(1,...pts);
  const n=pts.length;
  const x=i=> n<2? W/2 : pad.l + i*(W-pad.l-pad.r)/(n-1);
  const y=v=> H-pad.b - (v/hi)*(H-pad.t-pad.b);
  /* running best -- monotone, so this line never falls */
  let run=0; const bestPts=pts.map(v=>(run=Math.max(run,v)));
  const line=bestPts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area=`${line} L${x(n-1).toFixed(1)} ${H-pad.b} L${x(0).toFixed(1)} ${H-pad.b} Z`;
  const dots=pts.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4"/>`).join('');
  /* a milestone is drawn as a soft upright at the day it happened -- behind the
     line, never on top of it, so it marks the story without obscuring it */
  const mk=(marks||[]).map(i=>`<line class="cv-m" x1="${x(i).toFixed(1)}" y1="${H-pad.b}"
      x2="${x(i).toFixed(1)}" y2="${pad.t-6}"/>`).join('');
  return `<svg class="cv" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="Your progress: ${n} ${pre?(n===1?'day':'days'):(n===1?'go':'goes')}, best so far ${Math.round(hi)}">
    ${mk}<path class="cv-a" d="${area}"/><path class="cv-l" d="${line}"/>
    <g class="cv-d">${dots}</g></svg>`;
}

/* ---------- Regularity ----------
   This states what happened and asks for nothing:
     - no current-streak counter, and no "longest run" record either. A record
       you could beat is still a chain you can feel breaking.
     - a gap is drawn in exactly the same grey as a day that has not happened
       yet. Absence is not a colour.
     - the headline is a TOTAL, and a total only ever grows. Being away for a
       month subtracts nothing, because nothing was ever owed.

   What is left to motivate with, once threat is off the table, is evidence: a
   picture of a habit that already exists. */
const GRID_MAX_WEEKS=8;
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
/* The grid spans only the weeks the player actually has history in, never a
   fixed window. A fixed 8-week board shown to someone with one week of history
   is six rows of empty grey -- and empty space shames just as effectively as
   red does, which would undo the point of the copy underneath it. Growing the
   board instead means the picture gets bigger as the habit does. */
function gridWeeks(days){
  if(!days.length) return 1;
  const first=mondayOf(days[0].ts), now=mondayOf(Date.now());
  const w=Math.round((now-first)/(7*86400000))+1;
  return Math.max(1,Math.min(GRID_MAX_WEEKS,w));
}
function dayGrid(days){
  const best=Math.max(1,...days.map(d=>d.v));
  const byK=new Map(days.map(d=>[d.k,d.v]));
  const WEEKS=gridWeeks(days);
  const start=mondayOf(Date.now()); start.setDate(start.getDate()-7*(WEEKS-1));
  const today=dayKey(Date.now());
  let cells='',played=0;
  for(let w=0;w<WEEKS;w++) for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+w*7+i);
    const k=dayKey(d.getTime()), v=byK.get(k);
    const future=k>today;
    if(v!==undefined) played++;
    const lvl = v===undefined? 0 : v>=best*0.66? 3 : v>=best*0.33? 2 : 1;
    cells+=`<div class="gd g${lvl}${future?' gf':''}"${v!==undefined
      ? ` title="${d.toDateString()}"`:''}></div>`;
  }
  return {html:`<div class="grid-wk">${cells}</div>`, played, weeks:WEEKS};
}
function regularity(days){
  const g=dayGrid(days);
  const total=days.length;
  return `<p class="muted" style="margin-top:20px">When you played</p>
    <div class="card cv-card">
      <div class="wk-head">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div>
      ${g.html}
      <p class="cv-cap">${total} ${total===1?'day':'days'} of practice so far${
        g.played<total?` · ${g.played} in the last ${g.weeks} weeks`:''}.
      <b>Gaps are fine</b> — nothing here counts down.</p>
    </div>`;
}
/* ---------- Milestones and the text alternative ----------
   A line with no events on it is a shape; a line with events on it is a story.
   Level-ups need no new storage at all -- a level change between two
   consecutive history entries IS a level-up, so this works retroactively for
   every round already recorded.

   The list underneath is not a nicety. A chart is INVISIBLE to a screen reader:
   an <svg> full of <path> data says nothing whatever about progress. So the
   same information exists as sentences -- and writing it out turned out to be
   the better interface for everyone. */
function milestones(){
  const h=hist(), out=[];
  const seen={};
  h.forEach(e=>{
    const prev=seen[e.m];
    if(prev!==undefined && e.l>prev)
      out.push({ts:e.ts, ic:MODE_IC[e.m], t:`${MODE_NAME[e.m]} — level ${e.l}`});
    seen[e.m]=e.l;
  });
  BADGES.forEach(b=>{ const at=P.badges&&P.badges[b.id];
    if(typeof at==='number' && at>1) out.push({ts:at, ic:b.ic, t:b.t}); });
  return out.sort((a,b)=>a.ts-b.ts);
}
function dstr(ts){
  const d=new Date(ts), n=new Date();
  const days=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())
    -new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(days<=0) return 'today';
  if(days===1) return 'yesterday';
  if(days<7) return days+' days ago';
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
function milestoneList(ms){
  if(!ms.length) return '';
  const recent=ms.slice(-6).reverse();
  return `<p class="muted" style="margin-top:20px">Along the way</p>
    <div class="card" style="text-align:left">
      ${recent.map(m=>`<div class="ms"><span class="ic-wrap">${ic(m.ic)}</span>
        <span class="ms-t">${m.t}</span><span class="ms-d">${dstr(m.ts)}</span></div>`).join('')}
      ${ms.length>6?`<p class="muted" style="font-size:14px;margin:8px 0 0">
        …and ${ms.length-6} more before that.</p>`:''}
    </div>`;
}
/* The whole screen, said out loud. This is what a screen reader gets instead
   of the chart, and it is deliberately the same facts in the same order. */
function progressSummary(days,all,first,bestNow,ms){
  const dir = bestNow>first? `up from ${first} to ${bestNow}`
            : bestNow===first? `steady at ${bestNow}` : `${bestNow}`;
  return `Progress summary: ${all.length} ${all.length===1?'go':'goes'} played across ${days.length} `
    + `${days.length===1?'day':'days'}. Best score ${dir}. `
    + (ms.length? `${ms.length} milestone${ms.length===1?'':'s'} reached, most recently `
        + `${ms[ms.length-1].t} ${dstr(ms[ms.length-1].ts)}.` : `No milestones yet.`);
}
/* ---------- The flat-line note ----------
   An honest chart has a cost: someone whose ability has genuinely stopped
   growing sees a genuinely flat line, and that is the moment a child decides
   they are stuck.

   The wrong fix is to bend the curve. The right one is to say what a flat line
   MEANS -- it almost always means the level has caught up with them, which is
   information, not a verdict -- and to name one concrete thing to try. */
function flatNote(days){
  if(days.length<5) return '';
  const recent=days.slice(-5).map(d=>d.v);
  const n=recent.length, mx=(n-1)/2, my=recent.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0; recent.forEach((y,i)=>{num+=(i-mx)*(y-my);den+=(i-mx)*(i-mx)});
  const trend=den?num/den:0;
  if(trend>0.15) return '';                       /* still climbing -- say nothing */
  /* the trick they have touched least is the most useful thing to point at */
  const counts=['m1','m2','m3','m4'].map(m=>({m,n:hist(m).length}));
  const least=counts.sort((a,b)=>a.n-b.n)[0];
  return `<div class="card" style="text-align:left">
    <p style="font-size:19px;margin:0 0 6px"><b>Your line has been level lately</b></p>
    <p class="muted" style="font-size:16px;margin:0">That usually means <b>the level you're on has
    caught up with you</b> — which is what happens when you're being stretched properly.
    ${least.n===0?`You haven't tried <b>${MODE_NAME[least.m]}</b> yet — a different trick often
      shakes something loose.`:`<b>${MODE_NAME[least.m]}</b> is the one you've played least.`}</p>
  </div>`;
}
function progress(){
  const all=hist();
  if(all.length<2) return progressEmpty(all.length);
  const days=byDay(all);
  const bestNow=Math.round(Math.max(...all.map(power)));
  const first=Math.round(days[0].v);
  const modes=['m1','m2','m3','m4'].filter(m=>hist(m).length>=2);
  const ms=milestones();
  /* map each milestone onto the day column it belongs to */
  const dayIdx=new Map(days.map((d,i)=>[d.k,i]));
  const marks=[...new Set(ms.map(m=>dayIdx.get(dayKey(m.ts))).filter(i=>i!==undefined))];
  app.innerHTML=`<h1>How you're doing</h1>
    <p class="muted">${all.length} goes over ${days.length} ${days.length===1?'day':'days'}
      · your best is <b>${bestNow}</b></p>
    <p class="sr">${progressSummary(days,all,first,bestNow,ms)}</p>
    <div class="card cv-card">${curveSVG(days,300,120,true,marks)}
      <p class="cv-cap">One dot for each day you played — <b>how high you got that day.</b>
      The line is your best ever, so it only goes up.${marks.length?`
      <br>The upright marks are days something happened.`:''}</p></div>
    <div class="card" style="text-align:left">
      <p style="font-size:19px;margin:0 0 6px"><b>What the height means</b></p>
      <p class="muted" style="font-size:16px;margin:0">How many you got that <b>guessing wouldn't have
      given you</b> — counted harder when the game gave you less time to look. That's why it keeps
      making sense as the levels get tougher.</p></div>
    <div class="card"><p class="muted" style="margin:0;font-size:16px">First day: <b>${first}</b>
      · best now: <b>${bestNow}</b>${bestNow>first
        ? ` — <b style="color:var(--good)">${bestNow-first} more</b>${first>0?` (${Math.round(100*(bestNow-first)/first)}% up)`:``}`
        :``}</p></div>
    ${flatNote(days)}
    ${milestoneList(ms)}
    ${regularity(days)}
    ${modes.length>1?`<p class="muted" style="margin-top:18px">Each trick on its own</p>
      ${modes.map(m=>`<div class="card cv-card cv-sm">
        <p class="cv-t">${ic(MODE_IC[m])} ${MODE_NAME[m]} <span class="muted">· lv ${lv(m)}</span></p>
        ${curveSVG(hist(m),300,64)}</div>`).join('')}`:``}
    <button onclick="home()">Back</button>`;
}
/* Anyone who has finished a round has something to show, even if it predates
   the record. A returning player carries best scores, levels and badges but no
   history -- and hiding the entry point from THEM hid it from exactly the
   person most likely to go looking for it. */
function playedBefore(){
  return (P.hist||[]).length>0 || !!P.done ||
    ['m1','m2','m3','m4'].some(m=>P[m]!==undefined);
}
/* Offered at the end of a session, where the motivation to look is highest --
   the score is still on screen and the round that just moved the line is the
   one they just played. Only once there is a second point to draw. */
function progressLink(){
  return byDay(hist()).length>=2
    ? `<button class="calm" onclick="progress()" style="display:block;margin:8px auto 0">
        📈 See how you're doing</button>`
    : '';
}
/* Fewer than two days of history is not a curve, and drawing one from a single
   point would be a lie. But "come back later" was not an answer either: it told
   someone who had just finished a session that there was nothing to see. So
   this shows what IS known -- levels reached, badges earned -- and says plainly
   where the line will start. */
function progressEmpty(n){
  const played=['m1','m2','m3','m4'].filter(m=>P[m]!==undefined);
  app.innerHTML=`<h1>How you're doing</h1>
    <p class="muted">${n?`One go recorded. <b>The line needs two.</b>`
      :`Your line starts with your next go.`}</p>
    ${played.length?`<div class="card" style="text-align:left">
      <p style="font-size:19px;margin:0 0 8px"><b>Where you are now</b></p>
      ${played.map(m=>`<div class="ms"><span class="ic-wrap">${ic(MODE_IC[m])}</span>
        <span class="ms-t">${MODE_NAME[m]}</span>
        <span class="ms-d">level ${lv(m)} · best ${P[m]}</span></div>`).join('')}
    </div>`:``}
    ${badgeCount()?`<div class="card"><p class="muted" style="margin:0;font-size:16px">
      ${badgeCount()} of ${BADGES.length} badges found.</p></div>`:``}
    <div class="card" style="text-align:left"><p class="muted" style="font-size:16px;margin:0">
      From here on, <b>every go you finish becomes a dot</b> — and the line through them is your
      best ever, so it only goes up.${played.length?` What you have already done stays where it is:
      levels and badges are not lost, they just started before the chart did.`:``}</p></div>
    <button onclick="home()">${played.length?'Have a go':'Pick a trick'}</button>`;
}

/* ---------- The Grand Tour ---------- */
function tour(){
  S={};S.tour={score:0,total:0};used=[];
  app.innerHTML=`<h1>The Grand Tour</h1>
    <p class="muted">All three tricks, one after another. No help.</p>
    <div class="card" style="text-align:left">

function tourFilm(){

function tourPalace(){

        answer:pr.item,

          sh(POOL.filter(e=>!S.pairs.some(x=>x.item===e))).slice(0,3).map(e=>({v:e,label:`${ic(e)} ${nm(e)}`}))))}));
      return quiz(qs,"Grand Tour · 2 of 3",(r,t)=>{ S.tour.score+=r; S.tour.total+=t; tourNames(); });
    }

function tourNames(){

/* ============ shared: flash items ============ */
function flash(items,opts,cb){
  let i=0;

    if(i>=items.length){ cb(); return; }
    const e=items[i];
    const hint = opts.hint ? opts.hint(items,i) : "";
    app.innerHTML=`<p class="muted">${opts.label}</p>
      <div class="stage"><p class="big">${ic(e.e||e)}</p>
      <p class="word">${e.w||nm(e)}</p><p class="link">${hint}</p>
      <div class="pips">${items.map((_,k)=>`<div class="pip ${k<=i?'on':''}"></div>`).join("")}</div></div>`;
    i++; setTimeout(frame,opts.per||2400);
  })();
}
/* ============ shared: grid recall ============ */
function gridRecall(items,label,cb,tileCount,ordered){
  const want=tileCount||items.length*3;
  const dec=sh(POOL.filter(e=>!items.includes(e))).slice(0,Math.max(0,want-items.length));
  const tl=sh(items.concat(dec)); const picked=[];
  app.innerHTML=`<p class="muted">${label}</p><h2>${ordered?"Tap them <u>in order</u>":"Tap the ones you saw"}</h2>
    <p class="muted" id="cnt">${ordered?"Start with the first thing you saw":`Tap as many as you're sure of — up to ${items.length}`}</p>
    <div class="grid" id="g">${tl.map(e=>`<button class="tile" data-e="${e}" aria-label="${nm(e)}">${ic(e)}</button>`).join("")}</div>
    <button id="go" class="calm" disabled style="opacity:.4">Check</button>`;
  const g=document.getElementById("g"), go=document.getElementById("go");
  g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
    const e=t.dataset.e,at=picked.indexOf(e);
    if(at>-1){picked.splice(at,1);t.classList.remove("picked");t.querySelector(".tick")?.remove();}
    else if(picked.length<items.length){picked.push(e);t.classList.add("picked");
      t.insertAdjacentHTML("beforeend",'<span class="tick">⭐</span>');}
    document.getElementById("cnt").textContent= picked.length
      ? `${picked.length} chosen — tap Check when you're done`
      : (ordered?"Start with the first thing you saw":`Tap as many as you're sure of — up to ${items.length}`);
    go.disabled=picked.length===0; go.style.opacity=go.disabled?.4:1;
    go.classList.toggle('calm', go.disabled);   /* once actionable it becomes THE action */
  });
  go.onclick=()=>{
    let right=0,wrong=0;
    g.querySelectorAll(".tile").forEach(t=>{
      const e=t.dataset.e;
      /* ordered mode: a tile only counts if it is in the right position */
      const isT=ordered? (items.indexOf(e)===picked.indexOf(e) && picked.includes(e)) : items.includes(e);
      const isP=picked.includes(e);
      t.onclick=null; t.querySelector(".tick")?.remove(); t.classList.remove("picked");
      if(isP&&isT){t.classList.add("right");right++;t.insertAdjacentHTML("beforeend",'<span class="tick">✅</span>');}
      else if(isP){t.classList.add("wrong");wrong++;t.insertAdjacentHTML("beforeend",'<span class="tick">❌</span>');}
      else if(!ordered && isT){t.classList.add("missed");}
    });
    go.outerHTML=`<button onclick="window.__n()">Next</button>`;
    window.__n=()=>cb(right,items.length,wrong);
  };
}

/* ============ shared: one-at-a-time multiple choice ============ */
function quiz(qs,label,cb){
  let i=0,right=0;
  (function ask(){
    if(i>=qs.length){ cb(right,qs.length); return; }
    const q=qs[i];
    app.innerHTML=`<p class="muted">${label} — ${i+1} of ${qs.length}</p>
      <div class="stage" style="min-height:200px"><p class="big">${ic(q.cue)}</p>
      <p class="word">${q.cueText||""}</p></div>
      <h2 style="margin-top:14px">${q.ask}</h2>
      <div class="opts">${sh(q.options).map(o=>
        `<button class="opt" data-v="${o.v}">${o.label}</button>`).join("")}</div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.v===q.answer;
      if(ok)right++;
      document.querySelectorAll(".opt").forEach(x=>{
        x.onclick=null;
        if(x.dataset.v===q.answer)x.classList.add("right");
        else if(x===b)x.classList.add("wrong");
      });
      setTimeout(()=>{i++;ask();},900);
    });
  })();
}

function m1r3(){

/* She chooses and orders the six places. Saved, and reused with any items
   forever -- so the route regenerates value without us shipping another room. */
function m2build(){
  const need=PALACE_SPOTS[lv('m2')-1];
  const chosen=(P.palace||[]).slice(0,need);
  function draw(){
    app.innerHTML=`<h1>Build your palace</h1>
      <p class="muted">Tap ${need} places, in the order you'd walk past them at home.</p>
      <div class="card"><p class="muted" style="font-size:15px">Your route so far</p>
        <div class="spots">${Array.from({length:need},(_,k)=>k).map(k=>{
          const c=chosen[k]!==undefined?ALLSPOTS[chosen[k]]:null;
          return `<div class="spot ${c?'placed':''}"><div class="se">${c?ic(c.e):"·"}</div>
            <div class="sn">${c?c.n:`place ${k+1}`}</div></div>`;}).join("")}</div></div>
      <div class="spots">${ALLSPOTS.map((s2,i)=>
        chosen.includes(i)?`<div class="spot" style="opacity:.25"><div class="se">${ic(s2.e)}</div>
          <div class="sn">${s2.n}</div></div>`
        :`<button class="spot" data-i="${i}" aria-label="${s2.n}" style="cursor:pointer;color:inherit;font-family:inherit">
           <div class="se">${ic(s2.e)}</div><div class="sn">${s2.n}</div></button>`).join("")}</div>
      ${chosen.length?`<button class="calm" id="undo">Undo last</button>`:``}
      ${chosen.length===need?`<button id="done">That's my palace</button>`:``}`;
    document.querySelectorAll(".spot[data-i]").forEach(b=>b.onclick=()=>{
      if(chosen.length<need){ chosen.push(+b.dataset.i); draw(); }});
    const u=document.getElementById("undo"); if(u) u.onclick=()=>{chosen.pop();draw();};
    const d=document.getElementById("done"); if(d) d.onclick=()=>{
      P.palace=chosen.slice(); save(P); m2intro(); };
  }
  draw();
}

function m2place(){
  const need=PALACE_SPOTS[lv('m2')-1];
  const route=myPalace().slice(0,need);
  const it=pick(route.length);
  S.pairs=route.map((s,i)=>({spot:s,item:it[i]}));
  let i=0;
  (function step(){
    if(i>=S.pairs.length){ m2walk(); return; }
    const p=S.pairs[i];
    app.innerHTML=`<p class="muted">Level ${lv('m2')} · hiding ${i+1} of ${S.pairs.length}</p>
      <div class="stage"><p class="big">${ic(p.item)}</p><p class="word">${nm(p.item)}</p>
      <p class="link">Put it on <b>${p.spot.n}</b> ${p.spot.e} — picture it there, huge and silly.</p>
      <div class="pips">${S.pairs.map((_,k)=>`<div class="pip ${k<=i?'on':''}"></div>`).join("")}</div></div>
      <div class="spots">${S.pairs.map(({spot:s},k)=>`<div class="spot ${k<=i?'placed':''}">
        <div class="se">${ic(s.e)}</div><div class="sn">${s.n}</div>
        <div class="put">${k<=i?ic(S.pairs[k].item):"&nbsp;"}</div></div>`).join("")}</div>`;
    i++; setTimeout(step,PLACE_MS[lv('m2')-1]);
  })();
}
function m2walk(){
  const order=lv('m2')>=SHUFFLE_FROM? sh(S.pairs.slice()) : S.pairs;
  const qs=order.map(p=>({
    cue:p.spot.e, cueText:p.spot.n, ask:"What did you hide here?",

      <p class="muted" style="font-size:16px">Things come back <b>in order</b>, because your room has
      an order. Use the same six places every time and it gets stronger, not weaker.</p></div>
      ${mv===1?`<p style="color:var(--good);font-size:19px"><b>Level ${lv('m2')} unlocked! 🎉</b> A longer route next time.</p>`
       :mv===-1?`<p class="muted">Back a level — let's make that route shorter.</p>`:``}
      ${mastery?`<div class="card" style="border:2px solid var(--good)"><p style="margin:0;font-size:19px">${ic('🧠')} <b style="color:var(--good)">Badge: All three tricks</b> — the Grand Tour is open.</p></div>`:``}
      <button onclick="m2intro()">Hide new things</button>
      ${progressLink()}
      <button class="calm" onclick="home()" style="display:block;margin:8px auto 0">Pick another trick</button>`;
  });
}

      <button onclick="m3meet()">Meet more people</button>
      ${progressLink()}
      <button class="calm" onclick="home()" style="display:block;margin:8px auto 0">Pick another trick</button>`;
  });
}
