      { place: "Park Pond", text: "Families visit the Pond on the way home", why: "The Pond is on the way home from the bus, so families stop to enjoy it." },
      { place: "Bakery", text: "The Bakery sells more cakes on Saturday afternoons", why: "Families passing by after a day out stop for a treat." }
    ],
    d: [
      [ { place: "School", text: "The School opens on Saturday" }, { place: "Library", text: "The Library runs a Saturday bus" } ],
      [ { place: "Playground", text: "The Playground gets a bus stop" }, { place: "Bakery", text: "The Bakery closes on Saturdays" } ],
      [ { place: "Park Pond", text: "The Pond sells cakes" }, { place: "School", text: "The School sells cakes" } ]
    ],
    loop: null,
    fix: null
  },
  {
    id: "rt36",
    spark: "The Playground gets a new sandpit.",
    place: "Playground",
    chain: [
      { place: "Playground", text: "Little kids build sandcastles at the Playground", why: "A new sandpit is made for building, so little kids build castles in it." },
      { place: "Library", text: "Kids borrow books about castles", why: "Sandcastle building makes kids curious about real castles, so they look for castle books." },
      { place: "School", text: "Kids build castle models in class", why: "Kids who read about castles want to build them, and class is where models get made." }
    ],
    d: [
      [ { place: "Park Pond", text: "Kids build sandcastles by the Pond" }, { place: "Bakery", text: "The Bakery sells sandcastle cakes" } ],
      [ { place: "School", text: "The School teaches castle history" }, { place: "Bus Stop", text: "The Bus Stop gets a sandpit" } ],
      [ { place: "Playground", text: "The Playground turns into a castle" }, { place: "Library", text: "The Library builds a real castle" } ]
    ],
    loop: null,
    fix: null
  }
];
/* __SPARKS_END__ */

/* ---- game state ---- */
var S = {
  screen: "home",
  level: 1,
  session: null,
  round: null,
  bookOpen: false
};
function isUnlocked(n){ return n <= store.unlocked; }
function levelPool(links){
  return SPARKS.filter(function(sp){ return sp.chain.length === links; });
}
function loopPool(){
  return SPARKS.filter(function(sp){ return sp.chain.length === 3 && sp.loop; });
}
function fixPool(){
  return SPARKS.filter(function(sp){ return sp.chain.length === 3 && sp.fix; });
}
function newSession(level){
  var lv = LEVELS[level - 1];
  var types = [];
  var i;
  for(i = 0; i < ROUNDS_PER_GAME; i++) types.push("predict");
  if(lv.loop) types[0] = "loop";
  if(lv.fix) types[1] = "fix";
  types = shuffle(types);
  var used = [];
  var rounds = [];
  var predictPool = shuffle(levelPool(lv.links));
  var lPool = shuffle(loopPool());
  var fPool = shuffle(fixPool());
  var pi = 0, li = 0, fi = 0;
  function take(pool, idx){
    while(idx < pool.length && used.indexOf(pool[idx].id) >= 0) idx++;
    if(idx >= pool.length) return null;
    used.push(pool[idx].id);
    return {spark: pool[idx], next: idx + 1};
  }
  for(i = 0; i < types.length; i++){
    var t = types[i];
    var got = null;
    if(t === "predict"){ got = take(predictPool, pi); if(got) pi = got.next; }
    else if(t === "loop"){ got = take(lPool, li); if(got) li = got.next; }
    else if(t === "fix"){ got = take(fPool, fi); if(got) fi = got.next; }
    if(!got){
      /* Pool ran short (should not happen with 36 sparks): fall back to a
         predict round from any unused spark. */
      var any = shuffle(SPARKS.filter(function(sp){ return used.indexOf(sp.id) < 0; }));
      if(!any.length) any = shuffle(SPARKS);
      got = {spark: any[0]};
      used.push(any[0].id);
      t = "predict";
    }
    rounds.push({type: t, spark: got.spark});
  }
  return {level: level, rounds: rounds, idx: 0, points: 0, max: 0};
}
function startSession(){
  S.session = newSession(S.level);
  dealRound();
  render();
}
function dealRound(){
  var r = S.session.rounds[S.session.idx];
  if(r.type === "predict"){
    S.round = {type: "predict", spark: r.spark, step: 0, picks: [], options: optionsForStep(r.spark, 0, null), sel: -1, onBranch: false, branchPlace: null, done: false};
    S.screen = "play";
  } else if(r.type === "loop"){
    S.round = {type: "loop", spark: r.spark, answered: false, correct: false};
    S.screen = "loop";
  } else {
    S.round = {type: "fix", spark: r.spark, picked: -1};
    S.screen = "fixit";
  }
}
/* Options for one prediction step. On the true path the options are the true
   next link plus its two distractors. Once a pick goes off the true path,
   the next step follows from the place just picked, and no later pick can
   score - the reveal then shows the true chain and explains each link. */
function optionsForStep(spark, step, fromPlace){
  if(fromPlace === null){
    var opts = [{place: spark.chain[step].place, text: spark.chain[step].text, correct: true}];
    spark.d[step].forEach(function(dd){
      opts.push({place: dd.place, text: dd.text, correct: false});
    });
    return shuffle(opts);
  }
  var lead = NEXT[fromPlace];
  var others = PLACES.filter(function(p){ return p.name !== lead.place; });
  others = shuffle(others).slice(0, 2);
  var out = [{place: lead.place, text: lead.text, correct: false}];
  others.forEach(function(p){
    var g = GENERIC[p.name];
    out.push({place: p.name, text: g[Math.floor(Math.random() * g.length)], correct: false});
  });
  return shuffle(out);
}
function pickOption(i){
  if(!S.round || S.round.type !== "predict" || S.round.done) return;
  S.round.sel = i;
  render();
}
function confirmStep(){
  var r = S.round;
  if(!r || r.type !== "predict" || r.done || r.sel < 0) return;
  var picked = r.options[r.sel];
  r.picks.push(picked);
  if(picked.correct && !r.onBranch){
    /* stays on the true path */
  } else {
    r.onBranch = true;
    r.branchPlace = picked.place;
  }
  r.step++;
  r.sel = -1;
  if(r.step >= r.spark.chain.length){
    r.done = true;
    scorePredictRound();
    S.screen = "reveal";
  } else {
    r.options = optionsForStep(r.spark, r.step, r.onBranch ? r.branchPlace : null);
  }
  render();
}
function scorePredictRound(){
  var r = S.round;
  var pts = 0;
  for(var i = 0; i < r.picks.length; i++){
    if(r.picks[i].correct && !onBranchBefore(i)) pts++;
    else break;
  }
  r.points = pts;
  r.max = r.spark.chain.length;
  S.session.points += pts;
  S.session.max += r.max;
  if(store.book.indexOf(r.spark.id) < 0){
    store.book.push(r.spark.id);
    saveStore();
  }
}
function onBranchBefore(i){
  /* A pick is only on the true path while every earlier pick was correct. */
  var r = S.round;
  for(var k = 0; k < i; k++) if(!r.picks[k].correct) return true;
  return false;
}
function pickLoop(i){
  var r = S.round;
  if(!r || r.type !== "loop" || r.answered) return;
  var want = r.spark.loop.type === "reinforcing" ? 0 : 1;
  r.answered = true;
  r.correct = (i === want);
  r.points = r.correct ? 1 : 0;
  r.max = 1;
  S.session.points += r.points;
  S.session.max += r.max;
  if(store.book.indexOf(r.spark.id) < 0){
    store.book.push(r.spark.id);
    saveStore();
  }
  render();
}
function pickLever(i){
  var r = S.round;
  if(!r || r.type !== "fix" || r.picked >= 0) return;
  r.picked = i;
  var lever = r.spark.fix.levers[i];
  r.points = (lever.tier === "best") ? 1 : 0;
  r.max = 1;
  S.session.points += r.points;
  S.session.max += r.max;
  if(store.book.indexOf(r.spark.id) < 0){
    store.book.push(r.spark.id);
    saveStore();
  }
  render();
}
function nextRound(){
  S.session.idx++;
  if(S.session.idx >= S.session.rounds.length){
    finishSession();
  } else {
    dealRound();
  }
  render();
}
function finishSession(){
  var sess = S.session;
  var pct = sess.max > 0 ? Math.round(100 * sess.points / sess.max) : 0;
  if(store.best === null || pct > store.best) store.best = pct;
  store.sessions.push({level: sess.level, points: sess.points, max: sess.max});
  if(store.sessions.length > 10) store.sessions = store.sessions.slice(-10);
  /* Unlock: at least 7 of every 10 ripples right across the last two
     sessions at this level. Unlocking never forces the player up. */
  var recent = store.sessions.filter(function(s){ return s.level === sess.level; }).slice(-2);
  var pts = 0, mx = 0;
  recent.forEach(function(s){ pts += s.points; mx += s.max; });
  S.unlockedNow = false;
  if(recent.length === 2 && mx > 0 && pts * 10 >= mx * 7 && sess.level < 4 && store.unlocked === sess.level){
    store.unlocked = sess.level + 1;
    S.unlockedNow = true;
  }
  saveStore();
  S.screen = "end";
}
function playAgain(){
  S.session = newSession(S.level);
  dealRound();
  render();
}
function pickLevel(n){
  if(!isUnlocked(n)) return;
  S.level = n;
  render();
}
function goHome(){ S.screen = "home"; render(); }
function goHowto(){ S.screen = "howto"; render(); }
function goBook(){ S.screen = "book"; render(); }
function startOver(){
  store = {unlocked: 1, book: [], best: null, sessions: []};
  saveStore();
  S.level = 1;
  S.screen = "home";
  render();
}

/* ---- rendering ---- */
function mapHTML(litPlaces, sparkPlace, rippleOrder, pulsePlace){
  var h = '<div class="map">';
  PLACES.forEach(function(p){
    var cls = "place";
    if(p.name === sparkPlace) cls += " spark";
    if(litPlaces && litPlaces.indexOf(p.name) >= 0) cls += " lit";
    if(pulsePlace && p.name === pulsePlace) cls += " just-picked";
    var delay = "";
    var dot = "";
    if(rippleOrder && rippleOrder.indexOf(p.name) >= 0){
      var step = rippleOrder.indexOf(p.name);
      cls += " ripple-step";
      delay = ' style="animation-delay: ' + (step * 0.7).toFixed(1) + 's"';
      dot = '<span class="ripple-dot"' + delay + '></span>';
    }
    h += '<div class="' + cls + '"' + delay + '>' + dot + (p.name === sparkPlace ? '<span class="spark-mark">✨ SPARK</span>' : '') + '<span class="em">' + p.em + '</span><span class="nm">' + esc(p.name) + '</span></div>';
  });
  return h + "</div>";
}
function levelButtons(){
  var h = '<div class="levels">';
  for(var n = 1; n <= 4; n++){
    var locked = !isUnlocked(n);
    h += '<button onclick="pickLevel(' + n + ')" class="' + (S.level === n ? "sel" : "") + (locked ? " locked" : "") + '">' + LEVELS[n - 1].name + (locked ? " 🔒" : "") + '</button>';
  }
  return h + "</div>";
}
function renderHome(){
  var h = "<h1>🏘️ Ripple Town</h1>";
  h += '<p class="tagline">One small change. What happens next?</p>';
  h += '<p>A game for practising cause and effect in a pretend town.</p>';
  h += "<p>Pick your level:</p>";
  h += levelButtons();
  h += '<p class="small muted">' + esc(LEVELS[S.level - 1].blurb) + '</p>';
  h += '<p class="small muted">A level opens when you get 7 of every 10 ripples right across your last two games at the level below. Levels never drop - replay any level any time.</p>';
  h += '<p><button class="primary" onclick="startSession()">Play</button>';
  h += '<button onclick="goHowto()">How to play</button>';
  h += '<button onclick="goBook()">Ripple Book (' + store.book.length + ' chains)</button></p>';
  if(store.best !== null) h += '<p class="small">Best game so far: ' + store.best + '% of ripples right.</p>';
  h += '<p><button onclick="startOver()">Start over</button> <span class="small muted">Clears levels, Ripple Book and best score on this device.</span></p>';
  return h;
}
function renderHowto(){
  var h = "<h2>How to play</h2>";
  h += '<p>A game for practising cause and effect in a pretend town.</p>';
  h += '<div class="howto-grid">';
  h += '<div class="card"><h3>1. The Spark</h3><p>Something changes in the town - a new skate park, free bread, a week of rain. The map lights up where it happens.</p></div>';
  h += '<div class="card"><h3>2. Predict</h3><p>Talk it out before you tap. Pick what happens first, then what happens after that. One tap picks a card - "See what happens" locks it in.</p></div>';
  h += '<div class="card"><h3>3. The Reveal</h3><p>Watch the true chain play out, ripple by ripple. See where your guess matched and where the town surprised you - with one sentence explaining each link.</p></div>';
  h += "</div>";
  h += '<p>Some games add a <strong>Loop Spotter</strong> round: does the loop grow bigger and bigger, or settle back down? And a <strong>Fix It</strong> round: pick the lever that changes a bad ending.</p>';
  h += '<p class="small muted">Five rounds a game, about ten minutes. No timers, no streaks, no coins. Every chain you discover goes in your Ripple Book.</p>';
  h += '<p><button class="primary" onclick="goHome()">Back</button></p>';
  return h;
}
function renderPlay(){
  var r = S.round;
  var sp = r.spark;
  var lit = [sp.place];
  r.picks.forEach(function(pk){ if(lit.indexOf(pk.place) < 0) lit.push(pk.place); });
  var h = "<h2>Round " + (S.session.idx + 1) + " of " + ROUNDS_PER_GAME + " - " + esc(LEVELS[S.level - 1].name) + "</h2>";
  h += '<div class="card spark"><strong>The Spark:</strong> ' + esc(sp.spark) + '</div>';
  var lastPick = r.picks.length ? r.picks[r.picks.length - 1].place : null;
  h += mapHTML(lit, sp.place, null, lastPick);
  h += "<h3>Step " + (r.step + 1) + " - And then what?</h3>";
  h += '<p><strong>Talk it out before you tap.</strong></p>';
  r.options.forEach(function(o, i){
    h += '<div class="card opt' + (r.sel === i ? " sel" : "") + '" onclick="pickOption(' + i + ')"><strong>' + esc(o.place) + ':</strong> ' + esc(o.text) + '</div>';
  });
  h += '<p><button class="primary" onclick="confirmStep()"' + (r.sel < 0 ? " disabled" : "") + '>See what happens</button></p>';
  h += '<p class="small muted">Step ' + (r.step + 1) + ' of ' + sp.chain.length + ' in this chain.</p>';
  return h;
}
function renderReveal(){
  var r = S.round;
  var sp = r.spark;
  var h = "<h2>The Reveal</h2>";
  h += '<p class="small muted">The Spark: ' + esc(sp.spark) + '</p>';
  var chainPlaces = sp.chain.map(function(l){ return l.place; });
  h += mapHTML(chainPlaces, sp.place, chainPlaces);
  h += "<h3>What really happened</h3><ul class=\"chain\">";
  sp.chain.forEach(function(link, i){
    h += '<li class="chain-step" style="animation-delay: ' + (0.4 + i * 0.7).toFixed(1) + 's"><strong>' + (i + 1) + ". " + esc(link.place) + ":</strong> " + esc(link.text) + "<br><span class=\"small\">" + esc(link.why) + "</span></li>";
  });
  h += "</ul>";
  h += "<h3>Your chain</h3><ul class=\"chain\">";
  r.picks.forEach(function(pk, i){
    var ok = pk.correct && !onBranchBefore(i);
    h += '<li class="chain-step" style="animation-delay: ' + (0.4 + i * 0.5).toFixed(1) + 's">' + (ok ? '<span class="tick">✓ You got this one!</span> ' : '<span class="cross">The town surprised you here - here is why:</span> ') + "<strong>" + esc(pk.place) + ":</strong> " + esc(pk.text);
    if(!ok) h += "<br><span class=\"small\">" + esc(sp.chain[i].why) + "</span>";
    h += "</li>";
  });
  h += "</ul>";
  h += '<p class="score pop-in">' + r.points + " of " + r.max + " ripples</p>";
  h += '<p><button class="primary" onclick="nextRound()">' + (S.session.idx + 1 < ROUNDS_PER_GAME ? "Next round" : "See how the game went") + '</button></p>';
  return h;
}
function renderLoop(){
  var r = S.round;
  var sp = r.spark;
  var h = "<h2>Loop Spotter</h2>";
  h += '<p class="small muted">The Spark: ' + esc(sp.spark) + '</p>';
  h += "<p>Watch this chain play out:</p><ul class=\"chain\">";
  sp.chain.forEach(function(link, i){
    h += "<li><strong>" + (i + 1) + ". " + esc(link.place) + ":</strong> " + esc(link.text) + "</li>";
  });
  h += "</ul>";
  if(!r.answered){
    h += "<h3>What kind of loop is this?</h3>";
    h += '<p><button class="primary" onclick="pickLoop(0)">It grows bigger and bigger</button></p>';
    h += '<p><button class="primary" onclick="pickLoop(1)">It settles back down</button></p>';
  } else {
    h += '<div class="' + (r.correct ? "why" : "gentle") + '"><strong>' + (r.correct ? "You spotted it!" : "The town surprised you here - here is why:") + '</strong> ' + esc(sp.loop.why) + "</div>";
    h += '<p class="score">' + r.points + " of 1 ripple</p>";
    h += '<p><button class="primary" onclick="nextRound()">' + (S.session.idx + 1 < ROUNDS_PER_GAME ? "Next round" : "See how the game went") + '</button></p>';
  }
  return h;
}
function renderFixit(){
  var r = S.round;
  var sp = r.spark;
  var h = "<h2>Fix It</h2>";
  h += '<p class="small muted">The Spark: ' + esc(sp.spark) + '</p>';
  h += "<p>This chain ends badly:</p><ul class=\"chain\">";
  sp.chain.forEach(function(link, i){
    h += "<li><strong>" + (i + 1) + ". " + esc(link.place) + ":</strong> " + esc(link.text) + "</li>";
  });
  h += "<li><strong>Then:</strong> " + esc(sp.fix.bad) + "</li></ul>";
  if(r.picked < 0){
    h += "<h3>Pick a lever - talk it out first, one of these changes the ending.</h3>";
    sp.fix.levers.forEach(function(lv, i){
      h += '<div class="card opt" onclick="pickLever(' + i + ')">' + esc(lv.text) + '</div>';
    });
  } else {
    var lv = sp.fix.levers[r.picked];
    var best = sp.fix.levers.filter(function(x){ return x.tier === "best"; })[0];
    h += '<div class="' + (lv.tier === "best" ? "why" : "gentle") + '"><strong>' + esc(lv.text) + '</strong><br>' + esc(lv.why) + "</div>";
    if(lv.tier !== "best"){
      h += '<div class="why"><strong>The lever that works best:</strong> ' + esc(best.text) + ' - ' + esc(best.why) + "</div>";
    }
    h += '<p class="score">' + r.points + " of 1 ripple</p>";
    h += '<p><button class="primary" onclick="nextRound()">' + (S.session.idx + 1 < ROUNDS_PER_GAME ? "Next round" : "See how the game went") + '</button></p>';
  }
  return h;
}
function renderBook(){
  var h = "<h2>📖 Ripple Book</h2>";
  h += "<p>" + store.book.length + " chains discovered.</p>";
  if(!store.book.length){
    h += "<p>Play a game and every true chain you meet is added here, grouped by where it starts.</p>";
  } else {
    PLACES.forEach(function(p){
      var mine = SPARKS.filter(function(sp){ return sp.place === p.name && store.book.indexOf(sp.id) >= 0; });
      if(!mine.length) return;
      h += "<h3>" + p.em + " " + esc(p.name) + "</h3><ul class=\"chain\">";
      mine.forEach(function(sp){
        h += "<li><strong>" + esc(sp.spark) + "</strong><br><span class=\"small\">" + sp.chain.map(function(l){ return esc(l.place) + ": " + esc(l.text); }).join(" - ") + "</span></li>";
      });
      h += "</ul>";
    });
  }
  h += '<p><button class="primary" onclick="goHome()">Back</button></p>';
  return h;
}
function renderEnd(){
  var sess = S.session;
  var pct = sess.max > 0 ? Math.round(100 * sess.points / sess.max) : 0;
  var h = "<h2>How the game went</h2>";
  h += "<p>Chains played: " + ROUNDS_PER_GAME + "</p>";
  h += '<p class="score">' + sess.points + " of " + sess.max + " ripples - " + pct + "%</p>";
  h += "<p>Best game so far: " + store.best + "% of ripples right.</p>";
  if(S.unlockedNow){
    h += '<div class="why"><strong>New level unlocked: ' + LEVELS[sess.level].name + '!</strong><br>Finish two games at ' + LEVELS[sess.level - 1].name + ' getting 7 of every 10 ripples right to open the one after. Levels never drop.</div>';
  } else if(sess.level < 4){
    h += '<p class="small muted">Towards ' + LEVELS[sess.level].name + ": get 7 of every 10 ripples right across your last two games at " + LEVELS[sess.level - 1].name + " to unlock it. Levels never drop - keep playing.</p>";
  }
  h += '<p><button class="primary" onclick="playAgain()">Play again</button>';
  h += '<button onclick="goBook()">Look at my Ripple Book</button>';
  h += '<button onclick="goHome()">Home</button></p>';
  return h;
}
function render(){
  var h = "";
  if(S.screen === "home") h = renderHome();
  else if(S.screen === "howto") h = renderHowto();
  else if(S.screen === "play") h = renderPlay();
  else if(S.screen === "reveal") h = renderReveal();
  else if(S.screen === "loop") h = renderLoop();
  else if(S.screen === "fixit") h = renderFixit();
  else if(S.screen === "book") h = renderBook();
  else if(S.screen === "end") h = renderEnd();
  appEl.innerHTML = h;
}
render();

/* ---- node harness hook ---- */
if(typeof module !== "undefined" && module.exports){
  module.exports = {PLACES: PLACES, LEVELS: LEVELS, SPARKS: SPARKS, NEXT: NEXT, GENERIC: GENERIC,
    ROUNDS_PER_GAME: ROUNDS_PER_GAME, STORE_KEY: STORE_KEY,
    shuffle: shuffle, esc: esc, levelPool: levelPool, loopPool: loopPool, fixPool: fixPool,
    newSession: newSession, optionsForStep: optionsForStep,
    startSession: startSession, pickOption: pickOption, confirmStep: confirmStep,
    pickLoop: pickLoop, pickLever: pickLever, nextRound: nextRound, playAgain: playAgain,
    pickLevel: pickLevel, goHome: goHome, goHowto: goHowto, goBook: goBook, startOver: startOver,
    isUnlocked: isUnlocked, getS: function(){ return S; },
    getStore: function(){ return store; }, setStore: function(v){ store = v; }};
}
