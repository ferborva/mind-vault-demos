y regular by name, remembers what they read last, and rings them when a book they will love arrives. The giant knows their postcode. Greenleaf knows them.","r":"Turn It Around. The small size is not the weakness. It is the advantage. The giant can deliver any book, but it cannot know a reader. Greenleaf knows every regular by name and rings them when the right book arrives. Stop trying to be a smaller giant. Be the shop that knows its readers.","m":"flip"},{"s":"Hannah was rejected for the graduate job she wanted most, and she has been miserable for a week. The job was in a big firm, long hours, and a two-hour commute each way. The rejection forced her to look elsewhere, and she found a smaller firm, fifteen minutes away, doing the same work with a team of six. The rejection did not close a door. It moved her.","r":"Turn It Around. The rejection looks like a closed door, but the job behind it was long hours and a two-hour commute each way. The rejection pushed Hannah to a smaller firm, fifteen minutes away, doing the same work. The thing that felt like failure was the thing that moved her closer to the life she actually wants.","m":"flip"},{"s":"Omar spends two hours a day on the bus to work and back, and he hates every minute of it. He calls it dead time. In a year, two hours a day is more than four hundred hours. He started listening to audiobooks on the bus, one a week, and has now finished fifty books. The bus did not get shorter. The dead time became a library.","r":"Turn It Around. The two-hour bus ride is not dead time. It is more than four hundred hours a year, and Omar has already turned it into fifty books. The commute did not change. What changed is what he does with it. The thing in his way, the long bus ride, is the thing that makes the reading happen.","m":"flip"},{"s":"Jade is the youngest person on her team by ten years and she feels like she knows the least. In meetings, everyone else nods along to plans she does not understand. Last week she finally asked what a word meant, and three senior people admitted they did not know either. Her question did not expose her. It exposed that nobody else was asking.","r":"Turn It Around. Being the youngest is not the weakness. It is the advantage. Jade is the only one asking the obvious question, and last week her question showed three senior people did not know either. The thing that made her feel behind is the thing that makes the team honest. Keep asking.","m":"flip"},{"s":"Building work next door starts drilling at 7am, and Tara cannot study at home. She has been angry about it for a fortnight. Then she started going to the library at 8am, where it is quiet, the wifi is free, and she bumps into two classmates every day. Her marks have gone up. The drilling did not stop. Her study got better because of it.","r":"Turn It Around. The drilling is not the problem anymore. It is the push that moved Tara to the library at 8am, where it is quiet, the wifi is free, and two classmates study beside her. Her marks went up because of the noise, not despite it. The thing in her way became the thing that made her study.","m":"flip"},{"s":"The basketball team lost their star player to injury and everyone expected the season to collapse. She made half their baskets. But without her, the other four players started passing, moving, and sharing the ball. They have won four straight since she went down. The team did not lose its best player. It found its other four.","r":"Turn It Around. Losing the star player looks like the end of the season, but she made half the baskets. Without her, the other four pass, move, and share the ball, and they have won four straight. The injury did not weaken the team. It revealed a team that was hiding behind one player.","m":"flip"},{"s":"Liam is exhausted every morning, so he drinks three coffees to get through the day. The last coffee is at 4pm. He cannot fall asleep until 1am, so he wakes up exhausted. He drinks three coffees to get through the day. He has been tired for a month, and every day starts the same way: tired, coffee, late night, tired again.","r":"Spot the Circle. Tired, coffee, late night, tired again. The coffee is not fixing the tiredness. It is causing the late night that causes the tiredness. The circle goes round every day. Break it in one place, the 4pm coffee, and the whole circle stops.","m":"loop"},{"s":"The design team missed a deadline, so the manager added overtime to catch up. The overtime left everyone exhausted, so the next deadline slipped too. More overtime, more exhaustion, another missed deadline. The team has been catching up for three months and has never caught up. The overtime is not fixing the delay. It is feeding it.","r":"Spot the Circle. Missed deadline, overtime, exhaustion, missed deadline. The overtime is not catching the team up. It is the thing making them slower, which makes the next deadline slip, which brings more overtime. The circle goes round every month. Break it in one place, stop the overtime, and the team gets its speed back.","m":"loop"},{"s":"Emma has not called her grandmother in six weeks. She meant to call every week, and now she feels guilty about the gap. The guilt makes the call feel bigger, so she puts it off again. Another week passes, the guilt grows, and the call feels even bigger. Her grandmother is not angry. Emma is stuck in a circle of her own making.","r":"Spot the Circle. Guilt, delay, more guilt, more delay. The call is not getting harder because her grandmother is angry. Her grandmother is not angry. The call is getting harder because the guilt keeps growing. Break the circle in one place: call now, say sorry for the gap, and the six weeks shrink to one sentence.","m":"loop"},{"s":"Chris is overdrawn by $80 and the bank charges a $15 fee. Now he is overdrawn by $95, so next week there is another fee, and the one after that. He earns $600 a week and the fees are eating it. He is not overspending on luxuries. He is paying fees for being poor, and the fees are making him poorer.","r":"Spot the Circle. Overdrawn, fee, more overdrawn, another fee. The fees are not a punishment for overspending. Chris earns $600 a week and the fees are eating it. The circle goes round every week. Break it in one place: call the bank, ask for the fees back, and set up a low balance alert.","m":"loop"},{"s":"Noah is anxious about maths, so he skips the homework. Skipping the homework means he falls behind in class. Falling behind makes the next lesson scarier, so he skips the homework again. He has missed four weeks of homework now. He is not bad at maths. He is stuck in a circle where avoiding the scary thing makes it scarier.","r":"Spot the Circle. Anxious, skip, behind, more anxious, skip again. Avoiding the homework does not make maths less scary. It makes the next lesson scarier, which makes the homework easier to skip. Break the circle in one place: do ten minutes of tonight's homework, and the four weeks start shrinking.","m":"loop"},{"s":"When Lena is stressed, she goes quiet. When she goes quiet, Marco worries, so he asks her what is wrong, again and again. The questions make her feel crowded, so she goes quieter. Marco worries more and asks more. They have been doing this dance for a month. Neither of them is angry. They are stuck in a circle that neither of them started.","r":"Spot the Circle. Quiet, worry, questions, quieter, more worry. Lena is not angry and Marco is not nagging. She goes quiet because she is stressed, and he asks because she is quiet, and the asking makes her quieter. Break the circle in one place: Marco says, I am here when you are ready, and then waits.","m":"loop"}]}};

const PHASES = [
  { key: 'watch', label: 'Guess the trick', note: 'Tap the move you think it is. A guess, not a grade.' },
  { key: 'guided', label: 'Your turn, with the name', note: 'Your move is dealt face up. Say your reframe out loud, then see the expert.' },
  { key: 'solo', label: 'On your own', note: 'Say your reframe out loud — and tap the move you used.' }
];

let state = { track: null, round: 0, picked: null, revealed: false, rounds: null };

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* Draw n items at random from a pool, without replacement. */
function sample(pool, n) {
  const copy = pool.slice();
  const out = [];
  for (let i = 0; i < n && copy.length; i++) {
    out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  }
  return out;
}

/* IT6: every game draws a fresh six from the pool - 2 watch, 2 guided,
   2 solo, sampled at random from 40 per phase, then shuffled within each
   phase. Watch, guided, solo stay in that order - that is the scaffolding.
   No sets, no blocks. Called once per game, never on render, so the order
   is stable mid-game and no scenario repeats within a game. */
function drawRounds(trackKey) {
  const t = TRACKS[trackKey];
  const out = [];
  for (const p of PHASES) {
    sample(t[p.key], 2).forEach(function (d) {
      out.push({ phase: p.key, phaseLabel: p.label, s: d.s, r: d.r, m: d.m });
    });
  }
  const byPhase = {};
  for (const r of out) { (byPhase[r.phase] = byPhase[r.phase] || []).push(r); }
  const shuffled = [];
  for (const p of PHASES) { shuffled.push.apply(shuffled, shuffle(byPhase[p.key] || [])); }
  return shuffled;
}

function moveRow() {
  const keys = Object.keys(MOVES);
  const round = state.track ? (state.rounds || drawRounds(state.track))[state.round] : null;
  const pickable = !!(round && (round.phase === 'watch' || round.phase === 'solo') && !state.revealed);
  return '<div class="moverow">' + keys.map(function (k, i) {
    const sel = state.picked === k ? ' sel' : '';
    const pick = pickable ? ' pickable' : '';
    const click = pickable ? ' onclick="pickMove(\'' + k + '\')"' : '';
    return '<button type="button" class="movecard c' + i + sel + pick + '"' + click + '>' +
      '<span class="movename">' + esc(MOVES[k].name) + '</span>' +
      '<span class="movehint">' + esc(MOVES[k].hint) + '</span></button>';
  }).join('') + '</div>';
}

function progressBar() {
  const rounds = state.rounds || drawRounds(state.track);
  let segs = '';
  for (let i = 0; i < rounds.length; i++) {
    const cls = i < state.round ? 'seg done' : (i === state.round ? 'seg now' : 'seg');
    segs += '<span class="' + cls + '"></span>';
  }
  const label = state.round >= rounds.length
    ? 'Table talk'
    : 'Round ' + (state.round + 1) + ' of ' + rounds.length + ' — ' + esc(rounds[state.round].phaseLabel);
  return '<div class="progress"><span class="roundlabel">' + label + '</span><span class="segs">' + segs + '</span></div>';
}

function expertCard(round) {
  let html = '<div class="expwrap"><div class="burst"></div><div class="card exp">' +
    '<span class="sticker expert">The expert says…</span>' +
    '<div class="eyebrow">Expert card</div>' +
    '<p class="reframe">' + round.r + '</p>' +
    '<div class="movetag">Move: ' + esc(MOVES[round.m].name) + '</div>' +
    '<p class="cardfoot">Not a right answer — just a different one.</p></div></div>';
  if ((round.phase === 'watch' || round.phase === 'solo') && state.picked) {
    const named = state.picked === round.m;
    html += '<p class="compare">You picked <strong>' + esc(MOVES[state.picked].name) + '</strong>. ' +
      (named ? 'Same move the expert used. Nice spot!' :
        'The expert used <strong>' + esc(MOVES[round.m].name) + '</strong> — re-read the reframe with that move in mind.') +
      '</p>';
  }
  html += '<p class="beat">Beat the expert: whose works better here — yours or the expert’s — and why?</p>';
  return html;
}

function render() {
  const app = document.getElementById('app');
  if (!state.track) {
    app.innerHTML =
      '<p class="prompt">Six tricks. Six problems. <span class="hi">Can you spot the trick?</span></p>' +
      '<div class="trackpick">' +
      '<button type="button" class="trackbtn younger" onclick="pickTrack(\'younger\')"><strong>Younger</strong><span>Roughly 9–13. Six rounds, about fifteen minutes.</span></button>' +
      '<button type="button" class="trackbtn older" onclick="pickTrack(\'older\')"><strong>Older</strong><span>14+ / adult. Six rounds, about fifteen minutes.</span></button>' +
      '</div>' +
      '<p class="note">The six move cards are the tools. The game is learning their names — say the move out loud and you own it. No score, no timer, no points. Just the tricks.</p>' +
      '<p class="note">Over 200 problems in the deck. Every game deals you six fresh ones — same six moves, a new hand every time.</p>';
    return;
  }
  const rounds = state.rounds || drawRounds(state.track);
  const round = rounds[state.round];
  if (state.round >= rounds.length) {
    app.innerHTML =
      progressBar() +
      moveRow() +
      '<div class="card talk"><span class="sticker talk">Table talk</span>' +
      '<p class="talkq">1. What did you notice?</p>' +
      '<p class="talkq">2. Which bit was boring?</p>' +
      '<p class="talkq">3. Say each move back in your own words.</p>' +
      '<p class="talkq">4. Did the expert answer feel like the answer — or like another guess?</p>' +
      '<p class="cardfoot">A game nobody found boring usually means nobody finished it. Capture what people say, word for word.</p></div>' +
      '<button type="button" class="bigbtn" onclick="playAgain()">Play again?</button>' +
      '<button type="button" class="ghostbtn" onclick="switchTrack()">Switch track</button>';
    return;
  }
  let html = progressBar();
  html += moveRow();
  html += '<div class="card"><span class="sticker problem">Problem!</span><div class="eyebrow">Situation</div><p class="sit-text">' + esc(round.s) + '</p></div>';
  if (!state.revealed) {
    if (round.phase === 'watch') {
      html += '<p class="prompt"><span class="hi">Guess the trick!</span> ' + esc(PHASES[0].note) + '</p>';
      html += '<button type="button" class="bigbtn" onclick="reveal()" ' +
        (state.picked ? '' : 'disabled') + '>Show the expert</button>';
    } else if (round.phase === 'guided') {
      html += '<p class="dealt">Your move this round: <strong>' + esc(MOVES[round.m].name) + '</strong> — ' + esc(MOVES[round.m].hint) + '</p>';
      html += '<p class="prompt">' + esc(PHASES[1].note) + '</p>';
      html += '<button type="button" class="bigbtn" onclick="reveal()">Show the expert</button>';
    } else {
      html += '<p class="prompt">' + esc(PHASES[2].note) + '</p>';
      html += '<button type="button" class="bigbtn" onclick="reveal()" ' +
        (state.picked ? '' : 'disabled') + '>Show the expert</button>';
    }
  } else {
    html += expertCard(round);
    const last = state.round === rounds.length - 1;
    html += '<button type="button" class="bigbtn" onclick="nextRound()">' +
      (last ? 'Table talk' : 'Next round') + '</button>';
  }
  app.innerHTML = html;
}

function pickTrack(key) {
  state = { track: key, round: 0, picked: null, revealed: false, rounds: drawRounds(key) };
  render();
}

/* A fresh game deals a fresh six from the pool. A reload starts over. */
function playAgain() {
  state = { track: state.track, round: 0, picked: null, revealed: false, rounds: drawRounds(state.track) };
  render();
}

function pickMove(key) {
  if (!state.track || state.revealed) return;
  const phase = (state.rounds || drawRounds(state.track))[state.round].phase;
  if (phase !== 'watch' && phase !== 'solo') return;
  state.picked = key;
  render();
}

function reveal() {
  state.revealed = true;
  render();
}

function nextRound() {
  state.round += 1;
  state.picked = null;
  state.revealed = false;
  render();
}

function switchTrack() {
  state = { track: null, round: 0, picked: null, revealed: false, rounds: null };
  render();
}

render();
</script>
</body>
</html>
