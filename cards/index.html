<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Moves — the card game, on screen</title>
<style>
  :root{
    --pink:#ff2e88; --yellow:#ffd400; --lime:#7dff2e; --purple:#7b2eff;
    --cyan:#00d4ff; --orange:#ff6b00; --ink:#141414; --paper:#fffbe8;
    --white:#ffffff; --muted:#4a4a4a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    background-image:radial-gradient(#14141414 1.5px, transparent 1.5px);
    background-size:22px 22px;
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:26px 18px 90px}
  h1{
    display:inline-block; font-size:30px; line-height:1.05; font-weight:900;
    text-transform:uppercase; letter-spacing:-.01em; margin:0 0 10px;
    background:var(--yellow); padding:8px 14px; border:3px solid var(--ink);
    border-radius:12px; box-shadow:5px 5px 0 var(--ink); transform:rotate(-1.2deg);
  }
  .sub{font-weight:700; font-size:17px; margin:10px 0 20px}
  .tagline{
    display:inline-block; font-weight:900; text-transform:uppercase; font-size:15px;
    background:var(--pink); color:#fff; padding:6px 12px; border:3px solid var(--ink);
    border-radius:999px; box-shadow:3px 3px 0 var(--ink); transform:rotate(1.5deg);
    margin:0 0 18px;
  }
  .progress{
    display:flex; align-items:center; gap:10px; margin:0 0 16px; flex-wrap:wrap;
  }
  .progress .roundlabel{
    font-weight:900; text-transform:uppercase; font-size:13px; letter-spacing:.05em;
    background:var(--ink); color:#fff; padding:6px 10px; border-radius:999px;
  }
  .segs{display:flex; gap:6px}
  .seg{
    width:26px; height:14px; border:2.5px solid var(--ink); border-radius:999px;
    background:var(--white);
  }
  .seg.done{background:var(--lime)}
  .seg.now{background:var(--pink); animation:pulse 1s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
  @keyframes popin{
    0%{transform:scale(.88) rotate(-1deg); opacity:0}
    70%{transform:scale(1.03) rotate(.5deg); opacity:1}
    100%{transform:scale(1) rotate(0deg); opacity:1}
  }
  @keyframes slideup{
    from{transform:translateY(14px); opacity:0}
    to{transform:translateY(0); opacity:1}
  }
  @keyframes wiggle{
    0%{transform:rotate(-1.6deg)}
    50%{transform:rotate(1.6deg)}
    100%{transform:rotate(-1.6deg)}
  }
  .moverow{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px; margin-bottom:20px;
  }
  .movecard{
    font:inherit; text-align:left; cursor:default; color:var(--ink);
    border:3px solid var(--ink); border-radius:14px; padding:13px 14px;
    min-height:56px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .movecard:nth-child(odd){transform:rotate(-.8deg)}
  .movecard:nth-child(even){transform:rotate(.8deg)}
  .movecard.c0{background:var(--pink); color:#fff}
  .movecard.c1{background:var(--yellow)}
  .movecard.c2{background:var(--lime)}
  .movecard.c3{background:var(--purple); color:#fff}
  .movecard.c4{background:var(--cyan)}
  .movecard.c5{background:var(--orange); color:#fff}
  .movecard.pickable{cursor:pointer}
  .movecard.pickable:hover{animation:wiggle .35s ease-in-out infinite}
  .movecard.sel{
    transform:translate(-2px,-2px) rotate(0deg) scale(1.03);
    box-shadow:7px 7px 0 var(--ink); outline:3px solid var(--ink); outline-offset:2px;
  }
  .movename{display:block; font-size:17px; font-weight:900; text-transform:uppercase; letter-spacing:.02em; margin-bottom:3px}
  .movehint{display:block; font-size:13.5px; font-weight:600; line-height:1.4}
  .dealt{
    font-size:17px; font-weight:800; margin:4px 0 14px; padding:14px 16px;
    background:var(--yellow); border:3px solid var(--ink); border-radius:12px;
    box-shadow:4px 4px 0 var(--ink);
  }
  .card{
    background:var(--white); border:3px solid var(--ink); border-radius:16px;
    padding:22px 22px; margin-bottom:16px; box-shadow:6px 6px 0 var(--ink);
    animation:slideup .3s ease both; position:relative;
  }
  .card.exp{
    background:var(--yellow); animation:popin .35s ease both;
  }
  .card.talk{background:var(--lime)}
  .sticker{
    position:absolute; top:-14px; right:16px; font-weight:900; font-size:13px;
    text-transform:uppercase; letter-spacing:.05em; padding:6px 12px;
    border:3px solid var(--ink); border-radius:999px; box-shadow:3px 3px 0 var(--ink);
    transform:rotate(2.5deg);
  }
  .sticker.problem{background:var(--pink); color:#fff}
  .sticker.expert{background:var(--purple); color:#fff; transform:rotate(-2deg)}
  .sticker.talk{background:var(--ink); color:var(--lime)}
  .eyebrow{
    font-size:12px; font-weight:900; letter-spacing:.09em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }
  .sit-text{font-size:20px; line-height:1.45; font-weight:700; margin:0}
  .reframe{font-size:17px; line-height:1.55; font-weight:600; margin:0 0 8px}
  .movetag{
    display:inline-block; font-size:13px; font-weight:900; letter-spacing:.05em;
    text-transform:uppercase; color:#fff; background:var(--ink);
    border-radius:999px; padding:8px 14px; margin-top:10px;
  }
  .cardfoot{font-size:13.5px; font-weight:600; color:var(--muted); margin-top:12px}
  .prompt{font-size:17px; font-weight:800; margin:4px 0 14px}
  .prompt .hi{background:var(--yellow); padding:1px 6px; border:2px solid var(--ink); border-radius:6px}
  .compare{font-size:16px; font-weight:700; margin:12px 0 0}
  .compare strong{background:var(--pink); color:#fff; padding:1px 7px; border:2px solid var(--ink); border-radius:6px}
  .beat{
    font-size:16px; font-weight:800; margin:14px 0 0; padding:12px 14px;
    background:var(--white); border:2.5px dashed var(--ink); border-radius:12px;
  }
  .bigbtn{
    font:900 17px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer;
    background:var(--pink); color:#fff; border:3px solid var(--ink); border-radius:12px;
    padding:17px 22px; margin:8px 10px 8px 0; min-height:54px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .bigbtn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
  .bigbtn:disabled{background:#b9b2a6; cursor:default; transform:none; box-shadow:4px 4px 0 var(--ink)}
  .ghostbtn{
    font:900 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer;
    background:var(--white); color:var(--ink); border:3px solid var(--ink); border-radius:12px;
    padding:16px 20px; margin:8px 10px 8px 0; min-height:52px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .ghostbtn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
  .trackpick{display:grid; grid-template-columns:1fr; gap:14px; margin:20px 0}
  @media (min-width:560px){ .trackpick{grid-template-columns:1fr 1fr} }
  .trackbtn{
    font:inherit; text-align:left; cursor:pointer; color:var(--ink);
    border:3px solid var(--ink); border-radius:16px; padding:20px;
    min-height:56px; box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .trackbtn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
  .trackbtn.younger{background:var(--lime); transform:rotate(-.8deg)}
  .trackbtn.older{background:var(--purple); color:#fff; transform:rotate(.8deg)}
  .trackbtn strong{display:block; font-size:21px; font-weight:900; text-transform:uppercase; margin-bottom:4px}
  .trackbtn span{font-size:14.5px; font-weight:600}
  .note{font-size:14px; font-weight:600; color:var(--muted); margin-top:16px}
  .talkq{font-size:19px; font-weight:800; margin:0 0 8px}
  .burst{
    position:absolute; inset:-18px; z-index:-1; border-radius:50%;
    background:repeating-conic-gradient(var(--yellow) 0 12deg, transparent 12deg 24deg);
    opacity:.55; animation:spin 14s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .expwrap{position:relative; z-index:0}
</style>
</head>

<div class="wrap">
  <h1>Six Moves</h1>
  <p class="tagline">The card game, on screen</p>
  <div id="app"></div>

</div>

<script>
/* ---------------------------------------------------------------
   SIX MOVES — card game, on screen (Mind Vault, #28, IT3)
   Same canonical data as reframe.html and cards.html, same laws:
     1. Generate-then-compare. Never grade a free-response reframe.
     2. Worked examples first, then fade the scaffolding.
     3. The player must be able to NAME the move. (C1 / portable-skill test)
   No score, no timer, no streaks, no points. No network, no storage.
   Data: MOVES and TRACKS below are stamped from data/moves.json.
   IT3: plain move names, lighter younger situations, "Guess the trick"
   in Watch, "Beat the expert" compare, punk UI.
   IT6: a 240-scenario pool (40 per track per phase). Every game draws a
   fresh six at random - 2 watch, 2 guided, 2 solo, sampled without
   replacement, shuffled within each phase. No sets, no blocks. A reload
   starts over; nothing is stored.
--------------------------------------------------------------- */
const MOVES = {"out":{"name":"Step Back","hint":"Look at the whole thing, not just the bit in front of you."},"in":{"name":"Look Closer","hint":"The big problem has a small problem hiding inside it."},"seat":{"name":"Swap Places","hint":"Stand where they are standing and look from there."},"clock":{"name":"Run the Clock","hint":"What does this look like next week? Next year? Last year?"},"flip":{"name":"Turn It Around","hint":"The thing in your way might be the thing that makes it work."},"loop":{"name":"Spot the Circle","hint":"It's not happening once. It goes round and round, each step causing the next."}};
const TRACKS = {"younger":{"label":"Younger (roughly 9\u201313)","watch":[{"s":"Your football team loses most weeks and everyone says you need better players. But here's the weird bit: you usually WIN the first half. Then the last ten minutes hit, the other team brings on fresh legs, your coach's subs stay glued to the bench, and your whole team turns to jelly at exactly the same time. Nobody got worse in ten minutes. They just all ran out of legs together.","r":"Step back and look at the whole game, not just the score. The problem was never 'better players'  -  it was tired legs in the last ten minutes. That's a subs problem, not a players problem. Same team, same skills, just empty tanks at the same time every week.","m":"out"},{"s":"Your little brother keeps wrecking your Lego builds, so you want a lock on your door. But look at what actually happens. He only wrecks things when you're building alone with your door shut. When your cousin builds with him, he sits and watches for a whole hour without touching a single brick. And every time he walks in, the first thing he says is 'can I help?'  -  and you always say no, because he'll break it.","r":"Swap places and stand where he's standing. He isn't attacking your Lego  -  he's trying to get IN, and 'can I help?' is the only door he knows how to knock on. A lock stops the wrecking. It doesn't touch the reason. And the reason is standing in your doorway asking to help.","m":"seat"},{"s":"Your class keeps getting louder every afternoon and the teacher keeps moving the loudest kids. But here is the pattern. It starts quiet, then one person whispers, then their table laughs, then the next table starts talking to hear each other over the laughing, then the teacher raises her voice to be heard over the talking, and now everyone is shouting to be heard over the teacher. Moving the loud kids did not help - the noise just started somewhere else the next day.","r":"Spot the Circle: quiet, then a whisper, then a laugh, then talking to be heard, then the teacher louder, then shouting to be heard. Each step causes the next one. Moving kids treats one link and the circle just starts somewhere else. Break it anywhere - one quiet table resets the whole loop. Step Back only shows you a noisy room. The room is not the answer. The chain is.","m":"loop"},{"s":"Your best friend has stopped sitting with you at lunch and you are sure she is angry with you. The facts: she started sitting with the new girl on Monday. The new girl eats alone if nobody sits with her, and your friend told you last week she remembers what that felt like at her old school. She still saves you a seat at morning break and she still texts you every night.","r":"Swap Places and stand where she is standing. She is not leaving you - she is sitting with the girl who would eat alone, the way someone once sat with her. The seat at morning break and the texts every night are the facts that do not fit 'angry'. She has room for two tables. Step Back shows a fine friendship, which is true, but it does not explain lunch. Swap Places does.","m":"seat"},{"s":"Your class always runs out of time for art on Fridays, and everyone blames art for being last. But look at the whole Friday. Assembly runs ten minutes over, sport runs fifteen minutes over, and lunch runs late because the canteen queue is huge. By the time art starts, the day is already gone. Art isn't the problem. Friday is.","r":"Step Back and look at the whole Friday, not just the art lesson. The time was already gone before art started - assembly, sport, and a slow lunch ate it all. You can't fix art by moving art. You fix it by looking at the whole day and finding where the minutes actually went.","m":"out"},{"s":"The lost property box is overflowing with jumpers and everyone says the school has a jumper-eating monster. But step back and count. There are forty jumpers in the box and only three of them have a name written inside. The other thirty-seven belong to someone, but nobody can tell whose. The jumpers aren't lost. They're nameless.","r":"Step Back and look at the whole box, not just your missing jumper. Forty jumpers, three with names. The problem was never losing jumpers - it was that almost nobody writes their name in them. Name your jumper and the monster disappears. The box isn't eating jumpers. It's collecting nameless ones.","m":"out"},{"s":"The class group chat explodes every night at nine o'clock and everyone blames Sam for starting it. But step back and look at the whole evening. Homework is due at nine, everyone is tired and stressed, and the chat is the only place to complain. Sam doesn't start it. Nine o'clock does. The chat isn't the problem. The homework deadline is.","r":"Step Back and look at the whole evening, not just Sam's message. Homework is due at nine, everyone is tired, and the chat is where the stress goes. Sam is just the first one to type. Move the deadline or change the evening, and the explosion moves with it. The chat is the symptom. Nine o'clock is the cause.","m":"out"},{"s":"Your dog barks at the postie every morning and everyone says he's a bad dog who needs training. But step back and look at the week. He only barks on weekdays at eight o'clock, right when the postie arrives, and he stops the second the postie leaves. He never barks at visitors, the neighbours, or the cat. He's not a bad dog. He's a dog with a job he invented.","r":"Step Back and look at the whole week, not just the barking. Weekdays, eight o'clock, postie arrives, barking starts. Postie leaves, barking stops. He doesn't bark at anyone else. That's not a bad dog. That's a dog who gave himself one small job: barking at the postie, every weekday at eight.","m":"out"},{"s":"You invited twenty kids to your birthday and only eight came, so it feels like nobody likes you. But step back and count who stayed. The eight who came stayed for four hours, ate all the pizza, and two of them asked if they could come again next year. The party wasn't empty. It was small, and the small ones stayed for four hours.","r":"Step Back and look at the whole party, not just the empty chairs. Eight kids came and stayed for four hours and ate all the pizza. Two asked to come back next year. That's not a party nobody wanted. That's a small party where everyone stayed. Count the ones who stayed, not the ones who didn't.","m":"out"},{"s":"The cake stall at the school fete always runs out by ten o'clock and everyone says we need to bake more cakes. But step back and look at the whole fete. The cake stall opens at nine and sells out in an hour. The lolly stall next door still has half its stock at noon. The problem isn't too few cakes. It's that everyone wants cake and nobody wants lollies.","r":"Step Back and look at the fete, not the cake stall. Cakes sell out in an hour, lollies sit there until noon. The problem was never too few cakes - it was that the lolly stall is the wrong stall. Bake more cakes, or swap the lollies for something people want. The empty stall is telling you what everyone wants.","m":"out"},{"s":"Your bike won't go and you're sure it's broken for good, so you tell Mum you need a new one. But look closer. The chain slipped off one little clip. The wheels are fine, the brakes are fine, the bell still rings. One clip came off. The bike isn't broken. One tiny part is, and it takes two minutes to fix.","r":"Look Closer: 'my bike is broken' is a huge problem. Underneath it is a tiny one: one clip came off. The wheels, the brakes, the bell - all fine. Fix the clip and the bike is a bike again. Always check whether the huge problem has a small one hiding inside it.","m":"in"},{"s":"You hate swimming lessons and you want to quit the whole thing. But look closer at the lesson, minute by minute. You only hate the first two minutes, when the water is freezing and your teeth chatter. After that you're fine, and you love the games at the end. The problem isn't swimming. It's two cold minutes at the start.","r":"Look Closer: 'I hate swimming' is a huge feeling. Underneath it is a tiny one: two cold minutes at the start. The rest of the lesson is fine and the games at the end are the best part. Two minutes is not a reason to quit. It's a reason to jump in fast and get it over with.","m":"in"},{"s":"You suggested a new game for lunch and everyone laughed, so you're sure the whole class hates your idea. But look closer at who actually laughed. One kid laughed first, loudly, and everyone else just followed him. Three kids came up to you after lunch and said the game sounded fun. The whole class didn't laugh. One kid did, and the rest copied.","r":"Look Closer: 'everyone laughed' is a huge claim. Underneath it is a tiny one: one kid laughed first and the rest copied him. Three kids liked the idea enough to say so after lunch. The problem isn't your idea. It's one loud laugh that everyone else followed. Ask the three who liked it.","m":"in"},{"s":"Your room is a disaster and Mum says you have to clean the whole thing, so it feels impossible and you don't even start. But look closer. The floor is actually clear. The mess is one pile of clothes on your chair, and under the clothes is your school bag, and under the bag is your desk. The room isn't a disaster. One chair is.","r":"Look Closer: 'clean my room' is a huge job. Underneath it is a tiny one: one pile of clothes on one chair. Move the clothes, find the bag, find the desk. The room was never a disaster. One chair was. Start with the chair, not the room.","m":"in"},{"s":"Fractions make no sense and you're sure you're bad at maths. But look closer at what you can already do. You halve a pizza for you and your sister every Friday. You share a bag of lollies three ways without even thinking. The only bit that confuses you is the word 'denominator'. The maths is fine. One word is in the way.","r":"Look Closer: 'I'm bad at maths' is a huge label. Underneath it is a tiny one: one word, 'denominator', that confuses you. You already halve pizzas and share lollies three ways - that IS fractions. The problem isn't maths. It's one confusing word sitting in front of maths you can already do.","m":"in"},{"s":"Your friend sent a one-word text that just says 'ok' and you're sure she's angry with you. But look closer at the message. She sent it at eleven o'clock at night, from her mum's phone, because her own phone is broken and charging in the kitchen. One word, late at night, from the wrong phone. The problem isn't the friendship. It's a borrowed phone and a tired thumb.","r":"Look Closer: 'she's angry' is a huge conclusion from one word. Underneath it is a tiny one: a borrowed phone, eleven at night, a broken phone charging in the kitchen. One tired thumb typed 'ok' on the wrong phone. That's not anger. That's a late-night text from a mum's phone, and it says nothing about your friendship.","m":"in"},{"s":"Your teacher gives you extra homework and you're sure she's mean and hates your class. But swap places and stand where she's standing. She gives the whole class the same homework, and she stays late every single day to mark it, and she told you last week she hates marking more than anyone. She's not mean. She's tired, and she thinks the extra work will help.","r":"Swap Places and stand where she's standing. Same homework for everyone, late nights marking it, and she hates marking more than anyone. She's not being mean to you. She's doing the extra work too, and she thinks it will help. The extra homework isn't a punishment. It's a tired teacher trying to help.","m":"seat"},{"s":"Your little sister keeps stealing your pens and you want her banned from your room forever. But swap places and stand where she's standing. She has no pens of her own, and she only takes the sparkly ones, and she draws you pictures with them and leaves them on your pillow. She's not stealing. She's borrowing the good pens to make you things.","r":"Swap Places and stand where she's standing. No pens of her own, and the sparkly ones are the ones she wants. She draws you pictures and leaves them on your pillow. That's not stealing. That's a little sister with no pens, borrowing the good ones to make you things. Give her a pen and the stealing stops.","m":"seat"},{"s":"The new kid won't talk to anyone and everyone says he's rude and weird. But swap places and stand where he's standing. He moved here last month, he doesn't know a single person, and at his old school he was the funny one who made everyone laugh. He's not rude. He's the new kid, and being new is lonely, and lonely kids go quiet.","r":"Swap Places and stand where he's standing. New school last month, not one friend yet, and at his old school he was the funny one. He's not rude. He's a funny kid who lost his whole audience in one move, and now he's quiet because he's starting from zero. Go and say hello. That's the whole fix.","m":"seat"},{"s":"Your coach benches you every game and you're sure he doesn't like you and wants you off the team. But swap places and stand where he's standing. There are fifteen kids and eleven spots, and he rotates everyone, and last week he benched his own son for the whole game. He's not picking on you. He's sharing the bench around, and his own son gets benched too.","r":"Swap Places and stand where he's standing. Fifteen kids, eleven spots, and he rotates everyone - last week his own son sat the whole game. He's not picking on you. He's sharing eleven spots between fifteen kids, and the bench is part of the deal for everyone. Even his own son. The bench isn't about you. It's about the numbers.","m":"seat"},{"s":"Mum said no to the sleepover and it feels so unfair, like she's ruining your whole weekend. But swap places and stand where she's standing. She's the one driving you there and back, and it's a school night, and she has work at six in the morning. She's not being mean. She's the one doing the driving, and she's the one who has to get up at six.","r":"Swap Places and stand where she's standing. She's driving you there and back on a school night, then up for work at six in the morning. She's not ruining your weekend. She's the one doing the driving and the early morning. The 'no' isn't about you. It's about a school night and a six o'clock start.","m":"seat"},{"s":"Jake always wins at chess and everyone says he's a show-off who just likes beating people. But swap places and stand where he's standing. He practises every day after school, and he taught his little brother to play, and he always explains his moves after the game so you can learn them. He's not showing off. He's the kid who practises, and he wants you to get better too.","r":"Swap Places and stand where he's standing. He practises every day, he taught his little brother, and he explains his moves so you can learn them. That's not showing off. That's a kid who practises every day and wants you in it too. The winning isn't the point. The practising is, and he does it every day after school.","m":"seat"},{"s":"You tripped in front of the whole school at assembly and it feels like everyone will remember it forever. Run the clock back. Last month someone else tripped at assembly and you can't even remember who it was. Run it forward. Next week, nobody will remember yours either. The embarrassment feels forever. It lasts about a week.","r":"Run the Clock back: last month someone else tripped and you've already forgotten who. Run it forward: next week nobody remembers yours. Embarrassment feels like forever, but the clock says a week. The trip isn't the story. The story is that everyone forgets, including you, and it already happened to someone else.","m":"clock"},{"s":"You've fallen off your bike three times and you're sure you'll never learn to ride it. Run the clock back. Last year you couldn't ride at all, and now you can ride the whole street before you wobble. Run it forward. In a month you'll wonder why this felt so hard. You're not stuck. You're halfway there, and halfway looks like falling off.","r":"Run the Clock back: last year you couldn't ride at all, and now you ride the whole street. Run it forward: in a month this will feel easy. Three falls isn't 'never'. It's the middle of learning, and the middle always looks like falling off. The clock says you're closer than you think.","m":"clock"},{"s":"Your favourite show just ended and it feels like nothing good will ever be on again. Run the clock back. You said the exact same thing when your last favourite show ended, and then you found this one, and it became your favourite too. Run it forward. In a month you'll have a new favourite, and you'll wonder why you were so sad about this one.","r":"Run the Clock back: you said the same thing when the last show ended, and then you found this one. Run it forward: in a month there's a new favourite. The sadness isn't about the show ending. It's about forgetting that you've felt this before, and last time a new favourite showed up. The clock has seen this before.","m":"clock"},{"s":"You're the shortest kid in the class and it feels like you'll always be the shortest, forever. Run the clock back. Your older brother was the shortest in his class in Year 5, and now he's 180 centimetres tall and has to duck through doorways. Run it forward. Bodies don't grow on a timetable, and yours hasn't had its turn yet.","r":"Run the Clock back: your brother was the shortest in Year 5 and now he's 180 centimetres and ducking through doorways. Run it forward: your turn hasn't come yet, and bodies don't grow on a timetable. Being the shortest now says nothing about later. The clock says: not yet, not never.","m":"clock"},{"s":"You're moving house and you're sure you'll lose all your friends and never make new ones. Run the clock forward. Your cousin moved last year and she still talks to her old friends every single day, and she has new ones too. Run it back. You made your best friend in one week when you started this school. Friends don't end with a move. They just get further away.","r":"Run the Clock forward: your cousin moved last year, still talks to her old friends daily, and has new ones too. Run it back: you made your best friend in a week at this school. A move doesn't end friendships. It moves them, and making new ones took you a week last time. The clock says: further away, not gone.","m":"clock"},{"s":"You didn't make the school play and it feels like the end of everything. Run the clock back. Last year you didn't make it either, and you ended up doing backstage, loved it, and did it again for the next play. Run it forward. There are two more plays this year, and the drama teacher told you to try again. The end isn't the end. It's a pause.","r":"Run the Clock back: last year you missed the play too, and backstage turned out to be great. Run it forward: two more plays this year, and the teacher told you to try again. Missing one play isn't the end. It's a pause, and the pause already gave you backstage once. The clock says: try again.","m":"clock"},{"s":"Rain ruined the picnic and the whole day feels wasted. But flip it. The rain means you get to build the blanket fort inside, and the fort is the best part, and you only ever build forts when it rains. The rain didn't ruin the day. The rain made the fort happen, and the fort is better than the picnic.","r":"Turn It Around: the rain didn't ruin the day. It made the fort happen, and the fort is better than the picnic. The thing that wrecked the plan - the rain - is the thing that built the best part. Without the rain there'd be no fort. The rain was the gift, not the problem.","m":"flip"},{"s":"Your little brother follows you everywhere and it's so annoying, like you can never have a minute to yourself. But flip it. He follows you because you're the coolest person he knows, and when he's older he'll be your best mate, and right now he's your biggest fan. The annoying thing is a compliment in disguise, and the compliment is following you around.","r":"Turn It Around: the annoying thing is a compliment in disguise. He follows you because you're the coolest person he knows, and right now he's your biggest fan. The thing in your way - a little brother under your feet - is the thing that says you're worth following. Annoying is just what a compliment looks like from the inside.","m":"flip"},{"s":"The power went out on a Friday night and the whole evening feels ruined. But flip it. No power means no screens, so you play board games by candlelight, and it's the best night in ages. The power cut didn't ruin the evening. It made the best night, and the best night had no power in it.","r":"Turn It Around: the power cut didn't ruin the evening. It made the best night. No screens, board games, candlelight - the thing that took the evening away is the thing that gave you the best night in ages. The power cut was the gift, not the problem. Without it, you'd just be watching screens.","m":"flip"},{"s":"You're the only one in your class without a phone and it feels awful, like you're the odd one out. But flip it. You're the only one who isn't glued to a screen at lunch, and you actually talk to people, and last week two kids said they wish they could put their phones down. The thing that makes you different is the thing they want.","r":"Turn It Around: being the only one without a phone isn't the problem. It's the thing two kids already wish they had. You talk to people at lunch while they're glued to screens, and they want what you have. The thing that makes you the odd one out is the thing they want. Different isn't worse. Here, it's better.","m":"flip"},{"s":"Your handwriting is messy and the teacher keeps telling you to slow down. But flip it. You write fast because your brain is faster than your hand, and the messy pages are the ones with the best ideas on them. The mess isn't the problem. The mess is proof your brain is quick, and the quick pages are the good ones.","r":"Turn It Around: the mess isn't the problem. It's proof your brain is faster than your hand, and the messy pages hold the best ideas. The thing the teacher wants you to fix - the messy writing - is the thing that shows your brain is quick. The mess is the speed.","m":"flip"},{"s":"You got put in the B team and it feels like a demotion, like you're not good enough for the real team. But flip it. The B team plays more games, and you get to try every position, and last year three B team kids made the A team because they'd played everywhere. The B team isn't a demotion. It's a training ground.","r":"Turn It Around: the B team isn't a demotion. It's a training ground. More games, every position, and last year three B team kids made the A team because they'd played everywhere. The thing that feels like being left out is the thing that gets you ready for the A team.","m":"flip"},{"s":"You can't sleep because you're worried about being tired tomorrow, and the worrying keeps you awake, and being awake makes you more worried. Each step causes the next one. You lie there worrying about not sleeping, and the worrying is the thing keeping you awake. The worry about being tired is what's making you tired.","r":"Spot the Circle: worry keeps you awake, being awake makes you more worried, and more worry keeps you awake longer. Each step causes the next one. The worry about being tired tomorrow is what's making you tired tonight. Break it anywhere - even one calm minute cuts the circle, and the circle is the problem, not the sleep.","m":"loop"},{"s":"You keep losing your pencils, so you stop bringing good pencils and bring cheap ones instead. Because they're cheap you don't care if you lose them, so you lose more of them. Because you lose more, you bring even cheaper ones. The circle is simple: losing pencils makes you care less, and caring less makes you lose more.","r":"Spot the Circle: losing pencils makes you care less, and caring less makes you lose more, and losing more makes you bring cheaper ones. Each step causes the next one. The problem isn't the pencils. It's the circle. Break it anywhere - bring one good pencil and actually care about it, and the circle stops.","m":"loop"},{"s":"You're bored, so you watch videos. The videos are boring too, so you scroll faster. Scrolling faster makes you more bored, so you watch more videos. Each step causes the next one. The boredom isn't cured by the videos. The videos are feeding it, and the more you watch, the more bored you get.","r":"Spot the Circle: bored, so you watch videos, so you're still bored, so you scroll faster, so you're more bored, so you watch more videos. Each step causes the next one. The videos aren't fixing the boredom. They're feeding it. Break it anywhere - put the phone down and do one real thing, and the circle stops.","m":"loop"},{"s":"You don't practise guitar because you're bad at it, and you're bad at it because you don't practise. Not practising makes you worse, and being worse makes you practise less. Each step causes the next one. The circle is the reason you're stuck, not the guitar. The guitar is fine. The circle is the problem.","r":"Spot the Circle: not practising makes you worse, and being worse makes you practise less, and practising less makes you worse again. Each step causes the next one. The guitar isn't the problem. The circle is. Break it anywhere - five minutes of practice, even bad practice, cuts the circle, and the circle is the only thing in your way.","m":"loop"},{"s":"You and your friend keep arguing. She says something sharp, so you say something sharper, so she says something sharper still, and by the end neither of you remembers what started it. Each step causes the next one. The argument isn't about the first thing any more. It's about the circle, and the circle is the argument now.","r":"Spot the Circle: sharp, sharper, sharpest, and neither of you remembers what started it. Each step causes the next one. The argument isn't about the first thing any more. It's about the circle, and the circle feeds itself. Break it anywhere - one soft word, one 'sorry', one pause, and the circle stops.","m":"loop"},{"s":"You're always late for school. Because you're late, you rush. Because you rush, you forget things. Because you forget things, you have to go back for them. Because you go back, you're even later. The circle starts with being late and ends with being later, and it runs the same way every single morning.","r":"Spot the Circle: late, so you rush, so you forget, so you go back, so you're later. Each step causes the next one. The circle starts with being late and ends with being later. Break it anywhere - get everything ready the night before, and the morning has nothing to forget, and the circle never starts.","m":"loop"}],"guided":[{"s":"You got 4 out of 10 on the spelling test and it feels like the whole year is ruined. Total disaster. Except  -  the facts. There are 30 marks in the term, so this is one of thirty. Last term you got 3 out of 10 on your FIRST test and finished the term on 8 out of 10. And you've got eleven weeks left.","r":"Run the clock forward: in June this is one mark out of thirty. Run it back: last term you got 3 out of 10 on your first test and you can't even remember it now. The feeling is real. The size of it is borrowed from today.","m":"clock"},{"s":"You only get 20 minutes a day to practise piano, and that feels like not enough to get good. But here's what actually happens. When you had an hour, you played the songs you already know, because they're fun and you sound great at them. With 20 minutes you only have time for the one bar you keep fumbling  -  the same bar, every single day, for a week. Your teacher says that bar is now the only part you never get wrong. The bar you hate is now your best bar.","r":"Twenty minutes a day is WHY you'd get good. With an hour you'd play the bits you already like. With twenty minutes you have to pick the one bar you keep fumbling  -  and the limit picked the right practice for you. The wall was the teacher all along.","m":"flip"},{"s":"You hate reading time because you are the slowest reader in the class and everyone finishes before you. But look at the actual numbers. You read 20 pages in reading time. The fastest kid reads 24. You both read the same book. And you are the only one who can tell the teacher what happened in chapter 4 without looking back.","r":"Look Closer: 'slowest reader' is a huge label for a 4-page gap, and the gap hides the real question - who actually remembers the chapter? You do. The problem was never speed. It was measuring the wrong thing. Spot the Circle would say slow reading feeds itself, but the numbers say there is no circle here - just a 4-page gap and a memory nobody else has.","m":"in"},{"s":"Your team lost the grand final by one point and it feels like the worst day of the year. Run the clock. Last year you lost in the semi-finals by twenty points. This year you lost the final by one. Their best player turns fourteen next season and moves up an age group. Yours does not.","r":"Run the Clock forward: last year a semi-final loss by twenty, this year a final lost by one - the line is pointing the right way, and next year the team that beat you loses its best player to the older group. Run it back: the worst day of the year is also the best your team has ever done. Turn It Around would say the loss itself helped - it did not. What helps is what next year looks like from here.","m":"clock"},{"s":"Your class raises money for new library books and everyone is arguing about which books to buy. Maya wants graphic novels, Tom wants joke books, and the list on the board has twelve titles on it. But count the money first: the class raised sixty dollars, and one new book costs thirty dollars. Twelve titles, sixty dollars, two books.","r":"Step Back and look at the whole thing, not just the argument. The problem was never which twelve books to buy - it was that sixty dollars only buys two. Pick the two everyone wants most and the argument disappears, because the real choice was always much smaller than the list on the board.","m":"out"},{"s":"Everyone says the school bus is always late and blames the driver, but look at the timetable. The bus picks up three schools, and the first school's bell rings five minutes before the bus is meant to leave. Every morning the kids sprint out of class, the bus waits for them, and the whole run starts ten minutes behind.","r":"Step Back and look at the whole run, not just the driver. The bus is not late because the driver is slow - it is late because the first school's bell gives the kids no time to get out. The timetable is the problem, not the person. Move the pickup five minutes later and the whole run is on time.","m":"out"},{"s":"The lost-property box overflows every term and everyone says kids are careless with their jumpers. But look at where the box lives: at the far end of the school, past the oval, down a corridor nobody ever walks. Nobody loses a jumper on purpose - they just never walk past the box to check it.","r":"Step Back and look at the whole school, not just the pile of jumpers. The problem was never careless kids - it was a box sitting where nobody goes. Move the box to a spot every kid walks past, and the pile shrinks, because now checking it is easy.","m":"out"},{"s":"Three subjects set homework this week, twenty minutes each, so that is one hour in total, and everyone says the teacher gives too much. But look at the due date: all three pieces are due on Friday, so Friday night is one solid hour of homework and the rest of the week is nothing.","r":"Step Back and look at the whole week, not just Friday night. The problem was never too much homework - it was one hour of homework all landing on the same night. Spread the three pieces across the week and the hour feels easy, because the amount was never the problem. The timing was.","m":"out"},{"s":"Your footy team wins every home game and loses every away game, and everyone says the team is just bad. But look at the times: away games start at nine in the morning after a forty-minute drive, and the team arrives with no warm-up at all. Home games start at eleven, after a proper warm-up, and the team is ready.","r":"Step Back and look at the whole season, not just the score. The problem was never a bad team - it was a nine o'clock start, a forty-minute drive, and no warm-up. Same team, same skills, just cold legs at nine in the morning. Fix the warm-up and the away games change.","m":"out"},{"s":"The group chat explodes every Sunday night and one kid always gets blamed for starting it. But look at what Sunday night is: the day the coach posts the team roster, and every single week the same two kids are left on the bench. The fight is never about what someone said - it is about the same two kids sitting out again.","r":"Step Back and look at the whole week, not just the chat. The problem was never one kid starting a fight - it was the same two kids on the bench every single week. The roster is the problem, not the chat. Fix the bench and Sunday nights go quiet.","m":"out"},{"s":"The class printer jams every single time someone prints the newsletter, and everyone says the printer is broken. But look closer: the newsletter is the only thing in the whole class that prints double-sided, and the paper always gets stuck on the flip. Nothing else ever jams. Not the worksheets, not the homework, not the permission slips.","r":"Look Closer: the huge problem 'the printer is broken' is actually one tiny problem hiding inside it. Only the newsletter prints double-sided, and only the newsletter jams. The flip is the problem, not the printer. Print the newsletter single-sided and the jam disappears.","m":"in"},{"s":"Your lunch keeps going missing from the school fridge and you are starting to think someone is stealing it. But look closer: it only ever goes missing on Tuesdays, and Tuesday is the day the fridge gets cleaned out. Anything without a name on it gets thrown away, and the name on your lid rubbed off weeks ago.","r":"Look Closer: the huge problem 'someone is stealing my lunch' is actually one tiny problem hiding inside it. Your lunch is not stolen, it is thrown out on Tuesdays because your name rubbed off the lid. Write your name on it in big letters and your lunch will be waiting for you.","m":"in"},{"s":"Your dog barks every afternoon and everyone says he is naughty and needs training. But look closer: he only ever barks at three o'clock, and three o'clock is when the postie comes. The postie rings the bell twice, the dog barks at the bell, and then he is quiet for the rest of the day.","r":"Look Closer: the huge problem 'the dog is naughty all afternoon' is actually ten seconds at three o'clock. He is not barking at the afternoon - he is barking at the bell, twice, at three o'clock. The bell is the problem, not the dog. Teach him the bell means a treat and the barking stops.","m":"in"},{"s":"Your bike chain keeps falling off and you think the bike is broken and needs replacing. But look closer: it only ever falls off when you change gear going uphill, and never on the flat. The gear cable is loose, so every time you shift under pressure the chain jumps off. On the flat, where you barely shift, it never happens.","r":"Look Closer: the huge problem 'my bike is broken' is actually one loose cable hiding inside it. The chain only jumps when you shift uphill, which is exactly when the loose cable cannot hold it. Tighten the cable and the chain stays on, because the bike was never broken at all.","m":"in"},{"s":"You keep failing your spelling tests and you are starting to think you are just bad at spelling. But look closer: you only ever fail the words with double letters. Balloon, address, necessary - every single one has a double letter in it, and every single time you write one letter where there should be two.","r":"Look Closer: the huge problem 'I am bad at spelling' is actually one tiny habit hiding inside it. You only miss double letters, and you always write one where there should be two. Practise just the double-letter words and your score jumps, because the rest of your spelling was fine all along.","m":"in"},{"s":"Your library book is always overdue and you think you are just forgetful. But look closer: the book lives in your school bag, and your school bag lives under a pile of clothes on your bedroom floor, so you never actually see it. It is not your memory that is the problem - it is where the book sleeps.","r":"Look Closer: the huge problem 'I am forgetful' is actually one small thing hiding inside it. The book is buried under clothes, so you never see it, so you never remember it. Put the book on your pillow tonight and you will hand it in tomorrow, because seeing it is remembering it.","m":"in"},{"s":"The new kid never joins in at lunch and everyone says she is stuck-up and thinks she is too good for us. But swap places: she moved here from another country last month, she does not know a single person in the whole school, and nobody has ever once asked her to sit with them. She eats alone because nobody has invited her.","r":"Swap Places and stand where she is standing. From her seat, lunch is not 'choosing to be alone' - it is 'nobody has asked'. She moved countries, she knows nobody, and the whole school has walked past her for a month. One invitation changes everything, because the problem was never her. It was the empty seat next to her.","m":"seat"},{"s":"The teacher is grumpy every single Monday and everyone says she just hates Mondays. But swap places: on Mondays she teaches four classes back to back with no break in between, and her classroom is the one with the heater that broke in winter and never got fixed. Four hours of talking, no break, and a freezing room.","r":"Swap Places and stand where she is standing. From her seat, Monday is four hours of talking with no break in a freezing room, and the grumpiness is tiredness, not dislike. She does not hate Mondays - she is cold and exhausted by lunchtime. A fixed heater and one break would change the whole day.","m":"seat"},{"s":"Your little brother always wrecks your Lego and you are sure he does it on purpose just to annoy you. But swap places: he is four years old, he cannot reach the shelf where the Lego lives, and the only way he can play with it is to pull the whole box down. Every crash is him trying to reach the bricks, not trying to wreck them.","r":"Swap Places and stand where he is standing. From his seat, it is not wrecking - it is the only way a four-year-old can reach the bricks. He pulls the box down because the shelf is too high, not because he wants to ruin your build. Give him his own small box on a low shelf and the crashes stop.","m":"seat"},{"s":"The goalie never comes out for the ball and the whole team says she is scared. But swap places: she is the smallest kid on the team, the ball comes at her faster than she can see it, and the last time she came out for one she got knocked flat. Staying on the line is the only safe place she has found.","r":"Swap Places and stand where she is standing. From her seat, staying on the line is not fear - it is the only safe place she has found after getting knocked flat. The ball is too fast for her to track, and she is the smallest kid out there. Practise with a soft ball and she will start coming out.","m":"seat"},{"s":"The bus driver never waits when you are running late and you think he is just mean. But swap places: if he waits for you, the whole bus runs late, the kids at the next school miss their bell, and he gets in trouble with the company. Waiting for one kid makes twenty kids late, and he is the one who has to explain it.","r":"Swap Places and stand where he is standing. From his seat, waiting for one kid makes twenty kids late and gets him in trouble, so it is not mean - it is the timetable. The fix is leaving two minutes earlier, because the bus cannot wait for one person and still be on time for everyone else.","m":"seat"},{"s":"The shopkeeper always watches you when you walk around her shop and you are sure she thinks you are a thief. But swap places: last month someone stole two hundred dollars of stock from her shop, and now she watches everyone who comes in, not just you. She is not watching you - she is watching everybody, all day, every day.","r":"Swap Places and stand where she is standing. From her seat, she is not watching you - she is watching everyone, because last month cost her two hundred dollars. It was never about you at all. Smile and say hello, and you are just another friendly customer, not a suspect.","m":"seat"},{"s":"You spend all your pocket money on the first day and then you have nothing left for the rest of the week. But run the clock: next week is the same, and the week after, and by the end of the month you have spent forty dollars on lollies. The game you actually want costs thirty dollars, and you still do not have it.","r":"Run the Clock and look at next month, not just today. The lollies are gone and the game is still thirty dollars, and you still do not have it. Save five dollars a week and in six weeks the game is yours. The choice was never 'lollies or nothing' - it was 'lollies now or the game in six weeks'.","m":"clock"},{"s":"Your class plants a tree in the playground and everyone is bored because it is tiny and looks like a stick. But run the clock: in one year it will be taller than you, in five years it will shade the whole playground at lunchtime, and in ten years kids who are not even born yet will climb it. Right now it is just a stick in the dirt.","r":"Run the Clock and look at five years from now, not just today. Next week it is still a stick, but in five years it shades the whole playground and in ten years kids climb it. The payoff is later, not now - and the kids who plant it are the ones who get to watch it grow.","m":"clock"},{"s":"You and your best friend have a huge fight over who gets the last biscuit and you think the friendship is over forever. But run the clock: last year you fought over the exact same thing, and the year before that, and both times you were best friends again by lunchtime. This is the third biscuit fight, and the friendship survived the first two.","r":"Run the Clock and look at last year, not just today. This fight looks huge right now, but last year's biscuit fight lasted until lunchtime, and so did the one before that. The friendship is bigger than one biscuit, and by lunchtime tomorrow you will both be laughing about it.","m":"clock"},{"s":"You hate your braces and you want them off right now, today, this minute. But run the clock: the braces come off next year, your teeth are straight after that, and the two years of braces are a tiny part of your whole life. Two years feels like forever when you are twelve, and like nothing when you are twenty.","r":"Run the Clock and look at next year, not just today. Two years feels forever now, but next year the braces are off and your teeth are straight for the rest of your life. The payoff is after, not during - and twenty-year-old you will be glad twelve-year-old you stuck it out.","m":"clock"},{"s":"You want a new bike right now and your old one is fine, it still works, it just is not the cool one. But run the clock: your birthday is in two months, and with birthday money you can afford the bike you actually want. The one you can afford today is not the one you want - it is just the one you can buy today.","r":"Run the Clock and look at two months from now, not just today. The bike you can afford today is not the one you want, but in two months, with birthday money, it is. Waiting is not missing out - it is getting the right one. Your old bike still works, so the wait costs you nothing.","m":"clock"},{"s":"It rains on the day of the school fete and everyone says the fete is ruined and the whole day is wasted. But run the clock: last year it rained too, and the fete moved inside, and the inside fete was the best one ever because everyone was packed in together. The rain did not ruin last year - it made it better.","r":"Run the Clock and look at last year, not just today. Last year's rain made the best fete ever, because inside meant everyone together. Rain does not ruin the fete - it just moves it. This year's rain is not a disaster, it is last year's best day happening again.","m":"clock"},{"s":"You break your arm and you cannot play footy for six weeks, and it feels like the season is over for you. But turn it around: six weeks on the bench means you watch every single game, you learn all the plays, and you see the whole team's patterns. When your arm heals, you will know the game better than anyone on the field.","r":"Turn It Around: the thing keeping you off the field is the thing teaching you the game. Six weeks of watching is six weeks of learning the plays and the patterns, and nobody else on the team is doing that. You come back knowing more than the kids who never left the field.","m":"flip"},{"s":"You are the smallest kid in the class and you hate it, because everyone is taller and stronger than you. But turn it around: you are the fastest through the obstacle course, you fit through gaps nobody else can squeeze through, and in the game of tag nobody can catch you because you turn faster than anyone. Small is not the problem.","r":"Turn It Around: the thing that makes you small is the thing that makes you fast and hard to catch. You turn faster, you fit through gaps, and you fly through the obstacle course. The other kids are taller, but you are quicker - and in tag, quick beats tall every single time.","m":"flip"},{"s":"Your classroom is next to the road and the trucks are so loud you can barely hear the teacher. But turn it around: because nobody can hear her properly, the teacher writes everything on the whiteboard now, and the whole class has better notes than any other class in the school. The noise made the notes better.","r":"Turn It Around: the noise that blocks the lesson is the reason the notes are the best in the school. The trucks made the teacher write everything down, and written-down lessons are easier to revise than spoken ones. The obstacle made the work better, not worse.","m":"flip"},{"s":"The bus takes forty-five minutes to get to school and everyone hates the ride because it is so boring. But turn it around: forty-five minutes is the only time in the whole day that nobody can ask you to do anything, so it is the best reading time you have got. You have finished three books this term, all of them on the bus.","r":"Turn It Around: the boring ride is the reason you have read three books. Forty-five minutes with nobody asking you for anything is the only free time in your day, and you spent it reading. The wasted time is not wasted at all - it is the best reading time you have got.","m":"flip"},{"s":"The teacher is super strict about handwriting and everyone hates it because she makes you rewrite anything messy. But turn it around: your handwriting is now the neatest in the whole class, and the teacher for next year already knows your name because your work is so easy to read. The strict rule made your work stand out.","r":"Turn It Around: the strict rule that annoyed you is the reason your work stands out. The rewriting made your handwriting the neatest in the class, and neat work gets noticed. The annoying rule is the advantage - and next year's teacher already knows your name because of it.","m":"flip"},{"s":"Your footy field is always muddy and everyone says it is the worst ground in the whole league. But turn it around: your team trains on mud every single week, so when it rains in a real game, the other team slips everywhere and your team does not. The mud is not a disadvantage - it is the training.","r":"Turn It Around: the worst ground in the league is the reason you win in the rain. You train on mud every week, so mud is normal for you and a nightmare for the other team. The thing everyone complains about is the thing that makes you better than them.","m":"flip"},{"s":"You do your homework late at night, so you are tired the next day, so you cannot concentrate in class, so you do your homework late again that night. It is the same every single day: late homework, tired morning, no concentration, late homework. You are too tired to fix it, and too late to rest.","r":"Spot the Circle: late homework makes you tired, being tired makes the homework late, and round it goes again. It is not happening once - it goes round and round, each step causing the next. Break one step, like doing it before dinner, and the whole circle stops.","m":"loop"},{"s":"One kid teases you at lunch, so you tease him back, so he teases you harder, so you tease him back harder, and now you are both in trouble with the teacher. It started with one joke and now it is a full-blown fight, and neither of you can remember who started it or what the joke even was.","r":"Spot the Circle: every tease causes the next one, and the next one is always bigger. It is not one mean thing - it is a circle that keeps going round. The way out is not to win it, it is to stop feeding it, because the circle only survives while someone answers back.","m":"loop"},{"s":"Your room is messy so you cannot find your shoes, so you are late for school, so you dump your bag on the floor when you get home, and that makes the room even messier. The next morning you cannot find your shoes again, so you are late again, and the pile on the floor just keeps growing.","r":"Spot the Circle: the mess makes you late, and being late makes the mess worse, and round it goes again. It is not one messy morning - it is a circle that feeds itself. Tidy for five minutes tonight and the circle breaks, because tomorrow the shoes are right where you left them.","m":"loop"},{"s":"You check your phone at night, so you stay up too late, so you are tired all day, so you cannot be bothered doing anything, so you check your phone again because you are bored. The phone keeps you up, being tired makes you bored, and being bored sends you straight back to the phone, every single night.","r":"Spot the Circle: the phone keeps you up, being tired makes you bored, and being bored sends you back to the phone. It is not one late night - it is a circle that runs every single night. Charge the phone outside your room and the circle stops, because the phone cannot call you back from outside.","m":"loop"},{"s":"You worry about the test, so you cannot sleep, so you are tired for the test, so you do badly, so you worry even more about the next test. It is the same before every test: the worrying makes the sleep bad, the bad sleep makes the test worse, and the worse test makes the worrying bigger. Round and round it goes.","r":"Spot the Circle: the worry makes the sleep bad, the bad sleep makes the test worse, and the worse test makes the worry bigger. It is not one bad test - it is a circle. The way in is the sleep, not the worry, because a good night's sleep breaks the circle before the test even starts.","m":"loop"},{"s":"You trade your sandwich for chips at lunch, so you are hungry by the afternoon, so you trade tomorrow's sandwich for chips again because you are already hungry. Now you never eat a proper lunch at all, and every afternoon you are starving, and every morning you trade the sandwich away before you even open it.","r":"Spot the Circle: the trade makes you hungry, and the hunger makes you trade again, and round it goes. It is not one bad swap - it is a circle that leaves you starving every afternoon. Eat the sandwich just once and tomorrow you are not starving, so the circle has nothing to feed on.","m":"loop"}],"solo":[{"s":"Your friends always pick the one game you're worst at, and you're starting to think you should leave the group. Here's lunch break, exactly. Mia picks the game every single day. Mia always picks dodgeball. You're the worst at dodgeball. Nobody else has EVER picked  -  nobody's ever even asked. Mia is the self-appointed Minister of Games and nobody voted for her.","r":"'Should I leave my friends' is an ENORMOUS question. Underneath it is a tiny one: one person picks the game, at one moment, once a day. Asking Mia for a turn, or suggesting you take turns, is a small cheap thing to try. Changing a friendship is not. Always check whether the huge problem has a small one hiding inside it.","m":"in"},{"s":"Homework takes you three hours. Everyone else says it takes them one. Your week, exactly. You start at 4 and finish at 7, too tired to do anything but sleep. The next day you start tired, so the same homework takes even longer. By Friday you finish at 8. On Monday you start the week already tired. It's like a snowball rolling downhill, except the snowball is you and the hill is homework.","r":"Three hours makes you tired. Tired makes tomorrow's homework slower, which makes you more tired. You never get an evening back to recover, so it never resets. That isn't a homework problem  -  it's a circle that feeds itself. And circles can be cut anywhere, not only at the place they started.","m":"loop"},{"s":"Everyone in your class is arguing about whether the school should ban phones at lunch. Half the class says phones ruin lunch. The other half says banning them ruins lunch. You keep going around in circles. But step back: nobody is arguing about lunch. The phone kids eat together at the phone table. The no-phone kids eat together at the other table. Lunch already split into two lunches months ago - the argument is about which lunch counts as the real one.","r":"Step Back: the argument is not about phones, it is about two lunches that already exist. The phone table and the other table stopped being one lunch months ago. You cannot settle 'should we ban phones' until you see that the question is really 'whose lunch is lunch?' Look Closer would hunt for one small thing hiding inside it - but there is no small thing here. The whole shape is the problem: two tables, two lunches.","m":"out"},{"s":"You have to do a talk in front of the whole class and you are terrified of looking stupid. Here is the thing nobody tells you: the kids who look stupid are the ones who memorised every word and freeze when they forget one. The kids who do best are the ones who mess up, laugh, and keep going - because the class likes them more after the mess-up, not less. The audience is on your side exactly when you stop pretending you do not need them.","r":"Turn It Around: the mess-up you are scared of is the thing that makes the talk work. A perfect talk keeps the class at arm's length; a stumble invites them in. The thing in your way - looking silly - is the thing that makes them like you. You do not need to be flawless. You need one honest stumble. Swap Places would say the audience is kind - true, and it does not fix the fear. The fear is about you looking stupid, and the fix is that looking stupid is the move, not the mistake.","m":"flip"},{"s":"Your school bus is late almost every day and everyone blames the driver. But here is the timetable, exactly. The bus picks up from three schools. The first school lets out ten minutes late every single day. Your school is the third stop. The driver leaves the depot on time every morning, and the route is already ten minutes behind before the bus even reaches you.","r":"Step back and look at the whole route, not just your stop. The driver is not late - the timetable is. Three schools, one late bell, and the lateness rolls downhill to you. The problem is not the person driving the bus, it is a route that was already broken before the bus moved.","m":"out"},{"s":"Your whole class keeps failing the times tables test and everyone says the class is bad at maths. But here is the pattern, exactly. The test is always on Friday afternoon, the very last lesson of the week. Scores are fine on Monday and slide a little every day. By Friday afternoon everyone is running on empty, and the test lands right when nobody has any brain left.","r":"Step back and look at the whole week, not just the score. The class is not bad at maths - the test is bad at timing. Monday brains pass, Friday-afternoon brains do not. It is not a maths problem, it is a Friday-afternoon problem, and moving the test would change the score.","m":"out"},{"s":"Your class group chat is always arguing and everyone blames one kid for starting it. But here is the chat, exactly. Thirty kids, a hundred messages an hour, and nobody reads anything properly. Everyone replies to half a sentence they saw for two seconds. The kid everyone blames only types the most because she is the only one who actually reads the whole thread.","r":"Step back and look at the whole chat, not just one kid. Thirty kids, a hundred messages an hour, and nobody reading properly - the argument is not one person, it is a chat too big and too fast for anyone to actually listen. Slow the chat down and the fights slow down with it.","m":"out"},{"s":"Your dog keeps escaping the yard and everyone says she is a naughty dog. But here is the yard, exactly. There is a gap under the back gate where the ground slopes down. The dog only ever escapes after rain, when the soil goes soft and the gap gets bigger. On dry weeks she never even tries the gate, she just sleeps in the sun.","r":"Step back and look at the whole yard, not just the dog. She is not naughty - there is a gap under the gate that only opens when it rains. Fix the gap and the escaping stops. The problem was never the dog, it was a fence with a hole that appears on wet days.","m":"out"},{"s":"The school library is always empty at lunch and everyone says kids these days do not like reading. But here is the map, exactly. The library sits at the far end of the school, past the oval. Lunch is forty minutes. Walk there and back and you have fifteen minutes left to actually read. Nobody is avoiding books - they are avoiding a ten-minute walk for fifteen minutes of reading.","r":"Step back and look at the whole school, not just the empty chairs. It is not a reading problem, it is a distance problem. Forty minutes of lunch, ten minutes of walking, fifteen minutes left. Move the books closer to where kids already are and the library fills up.","m":"out"},{"s":"Your little sister keeps taking your stuff and everyone says she is a thief. But here is the bedroom, exactly. You share one room and there is no shelf, no drawer and no box with your name on it. Everything you own lives on the floor. She only ever takes things that are lying on the floor, because from the floor everything looks like it belongs to nobody.","r":"Step back and look at the whole room, not just your sister. She is not a thief - the room has nowhere to put things, so everything on the floor looks like fair game. Give your stuff a shelf with your name on it and the taking stops. The problem is the room, not your sister.","m":"out"},{"s":"You keep losing your hat at school and you are starting to think you need a new one, or a better memory. But here is the pattern. You only ever lose it on sports days. You take it off for the game, you leave it on the bench, and you run back to class without it. On normal days it stays on your head from the gate to home time.","r":"Look closer - the huge 'I always lose things' problem is one tiny moment. The bench, on sports days, after the game. Put the hat in your bag before the whistle blows and the losing stops. The problem was never your memory, it was one bench on one day a week.","m":"in"},{"s":"You keep losing your house key and you are sure you need a better memory. But here is the pattern. You only lose it on the days you wear your footy shorts, because they have no pockets and you tuck the key into your sock. Every other day it lives on the hook by the door and you never lose it. The key is not the problem. The pocket is.","r":"Look closer - the huge 'I have a terrible memory' problem is one tiny thing: shorts with no pockets. Put the key on the hook, or wear shorts with a pocket, and the key never goes missing. You do not need a better memory. You need a pocket.","m":"in"},{"s":"You keep forgetting your homework and you are starting to think your memory is terrible. But here is the pattern, exactly. You only ever forget the homework the teacher writes on the whiteboard. The homework in your diary you always remember, every single time. You never look at the whiteboard after class ends, so the whiteboard homework simply never reaches your bag.","r":"Look closer - the huge 'my memory is terrible' problem is one tiny gap. The homework you forget is the homework that lives in only one place, a whiteboard you never look at again. Copy it into your diary before the bell and the forgetting stops. The problem was never your memory, it was where the homework lived.","m":"in"},{"s":"Your phone battery always dies by lunch and you are sure the battery is broken. But here is the pattern, exactly. It only ever dies on the days you play the space game at recess. That game eats forty percent of the battery in twenty minutes. On days you do not play it, the battery is still half full at home time, every single time.","r":"Look closer - the huge 'my battery is broken' problem is one game. Forty percent gone in twenty minutes, before lunch even starts. Skip the game at recess and the battery lasts the whole day. The phone is fine, the battery is fine, and one game is the whole problem.","m":"in"},{"s":"You keep getting in trouble for talking in class and you are starting to think the teacher has it in for you. But here is the pattern. It only ever happens in the lesson right after lunch, when you are still buzzing from the playground. And you sit right next to your best friend, who makes you laugh just by pulling a face. No other lesson, no other seat, ever.","r":"Look closer - the huge 'the teacher hates me' problem is one seat at one time of day. Right after lunch, next to your best friend, still buzzing. Ask to move one seat over for that single lesson and the trouble stops. The problem was never the teacher, it was the seat and the hour.","m":"in"},{"s":"The plant on your windowsill keeps dying and you are sure you have no green thumb at all. But here is the pattern, exactly. You water it every single day, and it keeps dying. The other plant, the one you forgot about for a whole week, is growing new leaves. Same windowsill, same sun, same soil. The only difference is how often the watering can comes out.","r":"Look closer - the huge 'I have no green thumb' problem is one watering can. The plant you drown every day dies, the plant you forgot for a week thrives. Water it once a week and leave it alone. The problem was never you, it was too much water.","m":"in"},{"s":"Your mum keeps saying no to a sleepover and you are sure she is just being mean. But here is her side, exactly. She is the one who drives, feeds four kids, and gets up at six in the morning for work. Last sleepover the kids stayed up until two in the morning, and she was up at six anyway, running on four hours of sleep and a smile.","r":"Swap places and stand where your mum is standing. From her side it is not one sleepover, it is a six o'clock alarm after a two o'clock night, four kids to feed, and a day of work. A yes to the sleepover is a yes to all of that. Ask what would make it easier.","m":"seat"},{"s":"Your teacher keeps giving you extra homework and you are sure she is picking on you. But here is her side, exactly. She has thirty kids in the class and you are the only one who finished the last three tasks early. The extra work is the extension sheet she gives to anyone who finishes early, and this week that is only you, every single time.","r":"Swap places and stand where your teacher is standing. From her side it is not punishment, it is the only way to keep the fastest finisher busy while thirty kids are still working. The extra sheet is not a punishment, it is what early finishers get. Ask her for a harder challenge instead of more of the same.","m":"seat"},{"s":"Your friend will not share their brand new game and you are sure they are being selfish. But here is their side, exactly. They saved their pocket money for six whole weeks to buy it. The last time they lent something, their favourite book came back with the cover torn off and pages bent. Six weeks of saving, one broken thing, and now they hold on tight.","r":"Swap places and stand where your friend is standing. From their side it is not selfish, it is six weeks of saving and one favourite book that came back torn. They are not keeping the game from you, they are keeping it safe. Offer to play it together at their place instead of asking to borrow it.","m":"seat"},{"s":"Your older brother will not let you into his room and you are sure he hates you. But here is his side, exactly. He is sixteen, he has exams in two weeks, and he studies at the desk in his room every night. Last time you went in you knocked his laptop off the bed and it took him an hour to get it working again.","r":"Swap places and stand where your brother is standing. From his side it is not hate, it is exam week and one dead laptop. His room is the only quiet place he has to study. Knock, ask for five minutes, and bring him a snack - a closed door is not a closed friendship.","m":"seat"},{"s":"The new kid at school never talks to anyone and you are sure they are just rude. But here is their side, exactly. They moved here from another country two weeks ago and they do not know a single person. At recess they stand by the fence on their own, because nobody has ever asked them to join a game. Nobody, not once, in two whole weeks.","r":"Swap places and stand where the new kid is standing. From their side it is not rudeness, it is two weeks in a new country with nobody to play with. They are not ignoring you, they are waiting for someone to ask. One 'want to join our game?' is all it takes.","m":"seat"},{"s":"The referee keeps calling fouls on you and you are sure they are biased against your team. But here is their side, exactly. The referee is a parent who volunteered, and they stand on the far side of the field, a whole field away from your tackles. From over there, every single one of your tackles looks a second late, even the clean ones.","r":"Swap places and stand where the referee is standing. From their side it is not bias, it is the worst view on the whole field. A whole field away, every tackle looks late. They are not against you, they are just a long way off. Play cleaner where they can actually see you.","m":"seat"},{"s":"You want to quit karate after one bad class and it feels like the whole thing is a waste of time. But here is last year, exactly. You wanted to quit swimming after one bad lesson, and your mum said give it one more month. A month later you were the fastest in your squad, and now you cannot imagine giving swimming up. One bad class felt exactly like this.","r":"Run the clock and look at last year. One bad swimming lesson felt exactly like this karate class feels now, and a month later you were the fastest in your squad. Bad days are not verdicts, they are Tuesdays. Give it a month, then decide - the clock is on your side.","m":"clock"},{"s":"Everyone is laughing at your new haircut and it feels like the worst day of your whole life. But here is the calendar, exactly. Hair grows about one centimetre a month. In three weeks it will look completely different, and in six weeks it will be gone. The joke only works while the haircut is fresh, and fresh runs out fast.","r":"Run the clock and look at next month. Hair grows a centimetre a month, and this haircut is already on its way out. In three weeks nobody will even remember it, because the joke needs the haircut to be fresh. Worst days have expiry dates - this one is three weeks long.","m":"clock"},{"s":"You got picked last for the team and it feels like nobody wants you there at all. But here is last term, exactly. You got picked last then too, every single week. By the end of the term you were scoring goals and the captains were arguing over who got you first. Picked last is how it started last time, and look how that ended.","r":"Run the clock and look at last term. Picked last, every week, and by the end of the term the captains were arguing over who got you first. Picked last is a Tuesday, not a verdict. The clock already proved it once - it is about to prove it again.","m":"clock"},{"s":"Your best friend is moving away and it feels like the friendship is completely over. But here is your cousin, exactly. She moved away two years ago and you still talk every single week on video, and she still sends you the funniest memes. Moving away changed where she sleeps, and it did not change a single thing about how much you talk.","r":"Run the clock and look two years ahead. Your cousin moved away two years ago and you still talk every week. Moving changes where someone sleeps, not whether you talk. Two years from now this will just be a video call, and the friendship will still be there.","m":"clock"},{"s":"You are saving for a bike and it feels like you will never, ever have enough money. But here is the maths, exactly. The bike costs one hundred and twenty dollars. You save five dollars a week. That is twenty-four weeks, and you have already saved forty dollars. You are a third of the way there and you have not even noticed.","r":"Run the clock and look at the maths. Twenty-four weeks sounds like forever, but you are already a third of the way there, and next term the bike is yours. Saving is slow until it is suddenly done. The clock is not your enemy here - it is the plan.","m":"clock"},{"s":"The school play is in three weeks and you feel like you will never learn your lines. But here is last year, exactly. You learned your lines in the final week, and the year before that you did exactly the same thing. Every single year the lines land in the last week, and every single year they land. Three weeks is ages, an
