d you know it.","r":"Run the clock and look at last year. The lines landed in the final week, and the year before that too. Three weeks is ages, and every year the lines land in the last week. The panic is early, the lines are not late - the clock has done this twice already.","m":"clock"},{"s":"It is raining on sports day and everyone says the whole day is ruined. But here is the program, exactly. The rain cancels the running races, which your class always loses. What stays is the tug-of-war, which your class has won three years in a row. The rain did not cancel the day - it cancelled the races you lose and kept the one you win.","r":"Turn it around - the rain did not ruin the day, it fixed it. The races you lose are gone, the tug-of-war you always win is still on. The thing in your way, the rain, is the thing that took away the worst part of the day. Sometimes the worst weather is the best draw.","m":"flip"},{"s":"You are the shortest kid in the class and you hate it, every single day. But here is the obstacle course, exactly. The course has a tunnel, a low bar and a narrow gap between the mats. You are the fastest through all three, because you are the only one who fits without ducking or squeezing. The tallest kids have to slow down for every single one.","r":"Turn it around - the thing that makes you shortest is the thing that makes you fastest. The tunnel, the low bar, the narrow gap - you fit, and the tall kids have to slow down. Your height is not the problem, it is the advantage, and the obstacle course proves it every time.","m":"flip"},{"s":"You have to wear a mouthguard for footy and you hate it, it feels big and stupid in your mouth. But here is the game, exactly. The mouthguard protects your teeth, and because your teeth are protected you can go in harder for the ball. The kids without mouthguards hold back a little, because one bad knock means a trip to the dentist.","r":"Turn it around - the thing in your mouth that annoys you is the thing that lets you play harder. Your teeth are safe, so you can go in for the ball without holding back. The mouthguard is not in your way, it is what lets you play properly.","m":"flip"},{"s":"You are the slowest reader in your class and you hate reading out loud because everyone finishes before you. But here is the thing. Because you read slowly, you actually notice the words - the jokes, the clues, the bits everyone else skims past. When the teacher asks what happened in the chapter, you are the only one who remembers the detail that matters.","r":"Turn it around - being slow is not the problem. It is the thing that makes you good at this. Fast readers skim and forget. You read every word and you remember. The thing that embarrasses you is the exact thing that makes your answers the best in the room.","m":"flip"},{"s":"You have to do the dishes every single night and it feels like the worst chore in the world. But here is the kitchen, exactly. The dishes take ten minutes, and they are the only ten minutes of the whole day when nobody talks to you. The radio is on, the kitchen is yours, and nobody asks you a single question for ten whole minutes.","r":"Turn it around - the chore is the only quiet ten minutes in the whole day. Ten minutes, the radio on, nobody talking to you, nobody asking anything. The dishes are not in your way, they are the one bit of the day that is actually yours.","m":"flip"},{"s":"Your team has to play the best team in the whole league first, and everyone says you are doomed. But here is the draw, exactly. Nobody expects you to win, so there is no pressure at all. And whatever you learn from playing the best team helps you in every single game after that, because you have already faced the hardest one.","r":"Turn it around - the worst draw is the freest game you will ever play. No pressure, nobody expects a win, and everything you learn from the best team helps you for the rest of the season. The thing in your way, the hardest team first, is the thing that teaches you the most.","m":"flip"},{"s":"You stay up late, you are tired at school, you do badly, you feel bad about it, and then you stay up late again to feel better. But here is the week, exactly. Monday you stayed up till midnight, Tuesday you could barely stay awake in class, Wednesday you got your worst mark of the year, and Wednesday night you stayed up till midnight again because you felt awful.","r":"Spot the circle - tired makes the day bad, the bad day makes the night late, and the late night makes the next day tired. Round and round, each step causing the next. One early night breaks the whole circle, because the circle only works if every step happens.","m":"loop"},{"s":"You do not practise your guitar because you are bad at it, and you are bad at it because you do not practise. But here is the month, exactly. You skipped practise every day for four weeks, and you went from playing three chords to barely playing one. The less you practise, the worse you get, and the worse you get, the less you want to practise.","r":"Spot the circle - 'I am bad so I do not practise' and 'I do not practise so I am bad' are the same circle going round. Four weeks of skipping, three chords down to one. Ten minutes of practise breaks the circle, because the circle only works if you never start.","m":"loop"},{"s":"You and your brother argue about the TV remote every single night, and it always ends in a fight. But here is last night, exactly. He grabbed the remote, you grabbed it back, he grabbed it back harder, you grabbed it back harder still, and then he shoved you. Every grab is an answer to the last grab, and every answer is bigger than the one before.","r":"Spot the circle - each grab is an answer to the last grab, and each answer is bigger. Grab, grab back harder, grab back harder still, shove. Round and round until someone gets hurt. Not grabbing back even once breaks the whole circle, because the circle needs both of you.","m":"loop"},{"s":"You tease your friend, they tease you back harder, you tease harder still, and it always ends in a real fight. But here is yesterday, exactly. You called his haircut stupid, he called your shoes stupid, you called his whole family stupid, and then he pushed you. Each tease is an answer to the last tease, and every single answer is meaner than the one before.","r":"Spot the circle - each tease is an answer to the last tease, and every answer is meaner. Haircut, shoes, family, push. Round and round until someone gets hurt. Not teasing back even once breaks the whole circle, because the circle needs someone to answer.","m":"loop"},{"s":"You leave your school bag unpacked every night, and every morning is a rush and a panic. But here is the morning, exactly. You cannot find your homework, you cannot find your hat, you are late for the bus, and you are stressed before the day even starts. Then you get home, dump the bag on the floor, and do not unpack it again.","r":"Spot the circle - the morning rush is made the night before. Unpacked bag, lost homework, late bus, stressed day, dumped bag, unpacked again. Round and round. One bag unpacked tonight breaks tomorrow's rush, because the circle starts the night before, not the morning.","m":"loop"},{"s":"You keep checking your phone because something on it worries you, and checking only makes you worry more. But here is the evening, exactly. You check the group chat, you see a message that worries you, you check again to feel better, and you see three more worrying messages. Every check is meant to calm you down, and every check adds a new worry.","r":"Spot the circle - checking does not calm the worry, it feeds it. Check, worry, check again, more worry. Round and round, and every round adds a new worry. One hour without the phone breaks the whole circle, because the circle needs you to keep checking.","m":"loop"}]},"older":{"label":"Older (14+ / adult)","watch":[{"s":"Your team's releases keep breaking. Everyone agrees the answer is more testing.","r":"Plot the bugs by day: they cluster on Fridays. This isn't a testing problem, it's a deadline-shape problem  -  you ship when people are tired. And more tests would have made it <em>harder</em> to see, because they'd quietly absorb the symptom while the cause kept running.","m":"out"},{"s":"A city has terrible traffic, so it widens the motorway.","r":"Wider road \u2192 faster commute \u2192 living further out becomes reasonable \u2192 more cars \u2192 traffic. It's called induced demand, and the fix fed the problem. Anything that makes a system's pain cheaper tends to buy you more of whatever was causing the pain.","m":"loop"},{"s":"Your startup's churn is up 20% and the board wants a retention programme. But look at the numbers underneath: churn is up only among customers who joined during the discount campaign. Full-price customers churn at the same rate as last year. The discount brought in people who were never going to stay - they came for the price, and the price went back up.","r":"Look Closer: 'churn is up 20%' is one big number hiding two different populations. Full-price churn has not moved. The campaign bought a crowd that was always going to leave, and now their leaving looks like a product problem. The retention programme would be treating customers who were never yours. Step Back shows a company-wide retention problem - but there is not one. There is a campaign-shaped hole, and it closes itself when the discount cohort finishes leaving.","m":"in"},{"s":"A museum's most popular exhibit is also its most complained-about: visitors say it is too crowded to enjoy. The director's instinct is to cap tickets. But the complaints started the year the museum added a cafe next door - and the cafe's queue runs through the exhibit hall. The crowd is not there for the exhibit. It is queuing for coffee, inside the thing they came to see.","r":"Turn It Around: the crowd is the problem and the crowd is also the clue - nobody is complaining about the exhibit, they are complaining about standing in a coffee queue that happens to be inside it. Move the queue and the 'too popular' exhibit is popular again. The thing ruining the exhibit is the thing feeding it. Spot the Circle would say crowds attract crowds - true of the cafe, not of the exhibit. The loop is coffee, queue, crowd. Break it at the queue, not at the door.","m":"flip"},{"s":"Four flatmates are arguing about the electricity bill. One of them built a spreadsheet to split it to the cent, and the argument has run for three weeks. But look at the bill itself: it tripled the month the old fridge started humming all night, and the fridge belongs to the landlord. They are fighting over how to split a bill that is not even theirs to pay.","r":"Step Back and look at the whole bill, not just the split. The spreadsheet is solving the wrong problem. The bill tripled because a fridge that belongs to the landlord started humming all night. Call the landlord, get the fridge fixed, and the argument disappears with the bill.","m":"out"},{"s":"You have spent three weeks rewriting the introduction to your essay. Twelve drafts, and it still does not feel right. The essay is due on Friday. Now count the words: the introduction is 200 words. The essay is 3,000. You have written 200 words in three weeks and 2,800 words in zero days, because the body does not exist yet.","r":"Step Back: the introduction is not the problem. It is 200 words out of 3,000, and you have polished it twelve times while the body sits at zero. The essay is not stuck on the first paragraph. It is stuck on the 2,800 words that have not been written yet. Write the body first. The introduction can wait.","m":"out"},{"s":"Your gym's 6pm class is always full and members keep asking for more evening classes. The manager says the gym is at capacity. But look at the timetable: the gym runs 40 classes a week, and only three of them start after 5pm. Eighty percent of the members work nine to five. The gym is not full. It is empty all day and crowded for one hour.","r":"Step Back and look at the whole timetable, not just the 6pm class. Forty classes a week, three after five, and eighty percent of members work nine to five. The problem is not popularity. It is that almost everything runs while the members are at work. Move two daytime classes to the evening and the queue disappears.","m":"out"},{"s":"Your cafe's queue moves slowly at lunchtime and customers keep leaving. You are sure the menu board is the problem, so you redesign it twice. But watch the counter for one lunch rush: there is one till, and the coffee machine takes four minutes per order. The queue is not reading the menu. It is waiting for one till and one slow machine.","r":"Step Back: the menu was never the bottleneck. One till, one machine, four minutes an order, and a queue that forms behind them. Redesigning the board changes nothing, because nobody in the queue is stuck on choosing. They are stuck on waiting. Fix the till, not the typeface.","m":"out"},{"s":"Your daughter's marks dropped in first period maths and you have booked a tutor, bought workbooks, and set an hour of extra study every night. But look at when it started: the drop began the week daylight saving ended and the school bus started leaving at 6:40am. She is not struggling with maths. She is falling asleep in first period because she is up before dawn.","r":"Step Back: the tutor is solving the wrong problem. The marks dropped the week the bus moved to 6:40am, and first period is now a sleep test, not a maths test. Nothing about her maths changed. Her mornings did. Fix the mornings first, and see what the marks do then.","m":"out"},{"s":"Your support team is drowning in tickets and the manager wants to hire two more staff. The queue grows every week and everyone is working late. But count the tickets: seven out of ten are the same password reset question. The reset link in the welcome email has been broken for three months. The team is not short-staffed. It is answering the same question all day.","r":"Step Back: seven in ten tickets are one question, and the answer is a link that has been broken for three months. Hiring two people treats a staffing problem that does not exist. Fix the link in the welcome email and most of the queue vanishes overnight. The team was never drowning. It was repeating itself.","m":"out"},{"s":"You failed the whole subject and you are sure your degree is in trouble. But look at how the subject is marked: there are four assessments. You passed three of them. The one you failed was worth fifteen percent, and you missed it because you were sick that week. You did not fail a subject. You missed one quiz.","r":"Look Closer: 'I failed the subject' is one big sentence hiding four small ones. Three passes, one miss, fifteen percent, one sick week. The subject is not failed. One quiz is. Retake the quiz, keep the three passes, and the disaster shrinks to a single afternoon.","m":"in"},{"s":"Your landlord says the flat is falling apart and wants to raise the rent to cover repairs. The list he sent has twelve items on it. Eleven of them are a dripping tap, a loose handle, a cracked tile, and other small wear. The twelfth is the oven, which the law says he has to fix anyway. The flat is not falling apart. It is a tap and a handle.","r":"Look Closer: twelve items sounds like a disaster, but eleven are small wear and the twelfth is his legal job anyway. The 'falling apart' flat is a tap, a handle, and a cracked tile. The rent rise is not paying for repairs. It is paying for a list that looks bigger than it is.","m":"in"},{"s":"You are sure you are getting slower every year, and you are thinking about giving up running. But look at your times properly: on flat courses your times are identical to last year, to the second. The slower times are all on the hilly course you started running this year. You are not slower. You are running hills.","r":"Look Closer: one big fear, 'I'm slower', is hiding two different courses. Flat times have not moved. The slow times all sit on the hills you only started this year. You are not getting worse at running. You are doing a harder version of it, and the clock is comparing the wrong two things.","m":"in"},{"s":"Nobody comes into your shop anymore and you are sure the business is dying. But the door count says otherwise: foot traffic is the same as last year. What changed is the layout. You moved the bestsellers to the back wall and the front window now shows storage boxes. People come in, cannot see what they want, and leave. The shop is not empty. It is hiding its own stock.","r":"Look Closer: the business is not dying, the window is. Foot traffic has not moved. The bestsellers did, to the back wall, and the window now shows boxes. Customers are not staying away. They are walking in, not seeing what they came for, and walking out. Move the stock back to the front and the shop comes back with it.","m":"in"},{"s":"Nobody in your group does any work and you want to report them all. But check the group chat: four people have asked what to do, and three of them asked twice. The instructions are in your head. You wrote the plan, you know the steps, and you never sent any of it. The group is not lazy. It is waiting for a message that only exists in your head.","r":"Look Closer: 'nobody does any work' is hiding a smaller truth. Four people asked what to do, three asked twice, and the plan never left your head. The group is not refusing to work. It has nothing to work on. Send the instructions and the laziness will turn out to have been a missing message.","m":"in"},{"s":"Your car is falling apart and you are sure you need a new one. Three things broke this month: the wiper blades, a headlight bulb, and the air filter. But check what they are: all three are consumables, and all three were due at the same mileage. The engine, the gearbox, and the brakes are fine. Nothing structural has failed. Three small parts wore out together.","r":"Look Closer: 'falling apart' is three consumables that wore out at the same mileage, not a dying car. Wipers, a bulb, and a filter are the cheap parts doing exactly what cheap parts do. The engine, gearbox, and brakes are fine. Replace the three small things and the new car can wait.","m":"in"},{"s":"Your flatmate leaves her dishes in the sink every night and you are sure she is lazy. But look at her hours: she works the late shift at the hospital and gets home at 1am. The building has quiet hours after 10pm, and the dishwasher has been broken for a month. She cannot wash up without waking the neighbours, and she cannot use a dishwasher that does not work.","r":"Swap Places: from her seat at 1am, the sink is not laziness, it is a trap. Wash up and she breaks quiet hours. Use the dishwasher and she is using a broken machine. She is stuck between two rules, not ignoring one. Fix the dishwasher and the dishes disappear with the dilemma.","m":"seat"},{"s":"Your boss keeps rejecting your proposal without reading it, and you are sure she does not respect your work. But look at her week: she is in back-to-back meetings from nine to five, every day. Your proposal arrived as a twelve-page document at 4:55pm on a Friday. From her seat it is not a proposal. It is homework at the end of a very long week.","r":"Swap Places: she is not dismissing your work, she is drowning in hers. Twelve pages at 4:55pm on a Friday, after a week of meetings from nine to five, is not a proposal she can read. It is a weekend she does not have. Send one page on a Monday morning and see what she does with it.","m":"seat"},{"s":"Your best friend has stopped replying to your messages and you are sure she is angry with you. But look at what changed: she started a new job last month with a 6am start, and her phone stays on silent during her shifts. Your messages arrive at 9pm, when she has been asleep for an hour. She is not ignoring you. She is asleep.","r":"Swap Places: from her seat, your 9pm message arrives after she has been asleep for an hour, and her phone is silent until her shift ends. She is not reading your messages and choosing not to answer. She is not reading them at all. Text her at lunchtime and the friendship will turn out to be fine.","m":"seat"},{"s":"Your teacher marked your essay harshly and you are sure she hates your writing. But look at her week: she marks 120 essays, and yours was number 119. The feedback is three lines long. She wrote it at midnight, after a full day of teaching, and your essay was the second-to-last one in a pile of 120. The short feedback is not about your essay. It is about midnight.","r":"Swap Places: from her seat at midnight, essay 119 of 120, the short feedback is exhaustion, not judgement. She taught all day and marked all night, and yours was second-to-last. The mark is not a verdict on your writing. It is a verdict on her week. Ask her about one line, in person, and you will get the real feedback.","m":"seat"},{"s":"A customer left a one-star review saying your staff were rude and nobody told her anything. But look at that night: the kitchen oven broke and there was nothing to serve, and only one staff member was rostered on the floor. She spent the whole night apologising to a queue of thirty people. The customer heard silence because the one person who could talk to her was thirty people away.","r":"Swap Places: from the customer's seat, silence reads as rudeness. On the floor, one staff member spent the night apologising to thirty people while the oven sat broken. She did not ignore the customer. She was thirty people away from her. The review is not about rude staff. It is about a broken oven and a one-person roster.","m":"seat"},{"s":"Your mum keeps asking when you will get a real job, and you are sure she does not respect your freelance work. But look at her life: she left school at sixteen and worked the same factory job for thirty years. In her language, 'real job' means a job that cannot disappear overnight. She is not dismissing your work. She is scared it will vanish.","r":"Swap Places: from her seat, thirty years in one factory, 'real job' is not a judgement, it is a wish. She is not saying your work is not real. She is saying she wants it to still be there next year. The question is about fear, not respect, and it is answered by showing her the work lasts.","m":"seat"},{"s":"You failed your driving test and you are sure you will never drive. But run the clock: you can retake it in two weeks, and the test is forty minutes out of a year. In twelve months you will have been driving for eleven of them. The test is not a verdict on your driving. It is one bad forty minutes.","r":"Run the Clock forward: a failed test, retaken in two weeks, is forty minutes out of a year. In twelve months you will have been driving for eleven of them. It feels like a verdict today because today is the only day you can see. In a year it is a story about the first time, not the last.","m":"clock"},{"s":"Your baby wakes every two hours and it feels like this is forever. But run the clock back: a year ago you slept through the night without thinking about it. Run it forward: in six months the baby will sleep through, and in a year you will not remember the 2am feeds. The 'forever' is a season, not a life, and seasons end.","r":"Run the Clock: a year ago you slept through the night, and in six months the baby will too. The 2am feeds feel endless because you are living inside them. The shape is clear: a season, not a life. Seasons end, and this one has a date on it.","m":"clock"},{"s":"The office is moving to a new suburb and everyone is furious about the longer commute. The move adds twenty minutes each way. But run the clock forward a month: the new office is next to the childcare centre, and the school run drops from forty minutes each way to five. The commute costs forty minutes a day and saves seventy. The fury is about the drive, not the day.","r":"Run the Clock forward a month: the commute costs forty minutes a day, but the school run saves seventy. The new office is not further from your life. It is further from the old drive and closer to everything else. The fury counts the drive and forgets the day. Count the whole day and the move pays for itself.","m":"clock"},{"s":"You have been practising guitar for a month and you are sure you are not getting anywhere. Your fingers still hurt and the songs still sound wrong. But run the clock back: a month ago you could not play one chord cleanly. Today you play three songs all the way through. The change is there, it is just measured in songs, not in how it feels.","r":"Run the Clock back: a month ago, zero clean chords. Today, three songs all the way through. Your fingers and your ears are the wrong instruments - they measure the discomfort, and the change happened in the songs. You are not stuck. You are three songs further along than the person who picked it up, and the clock says so.","m":"clock"},{"s":"You will never afford a house, because prices go up faster than you can save. But run the clock: you have eight thousand dollars saved, and the deposit you need is forty thousand. At two hundred dollars a week, you reach it in a hundred and sixty weeks, just over three years. Three years feels like forever. The clock says it is a date, not a dream.","r":"Run the Clock forward: eight thousand saved, forty thousand needed, two hundred a week, a hundred and sixty weeks. Three years is not forever, it is a date on a calendar. The gap feels infinite because you are looking at it from today. Look at it from three years out and it is closed.","m":"clock"},{"s":"You and your partner argue about the grocery shop every Sunday and it feels like the relationship is broken. But run the clock back: the argument started the week you both began working Saturdays. Neither of you is home on Saturday anymore, so Sunday is the only day to shop, and you are both tired. The argument is not about groceries. It is about Saturdays.","r":"Run the Clock back: the argument is younger than the relationship. It started the week Saturdays disappeared, and Sunday became the only shopping day for two tired people. The argument is not about groceries. It is a roster problem wearing a relationship's clothes, and rosters change.","m":"clock"},{"s":"Your cafe has only eight seats and you are sure the small room is killing the business. But watch the street: a queue forms outside every morning, and people see the line and assume the coffee is worth waiting for. The queue is the best advertising on the street. The smallness is not the problem. It is the marketing.","r":"Turn It Around: the tiny room is not a weakness, it is the reason for the queue, and the queue is the reason people stop. Eight seats means a line outside, and a line outside means the coffee must be good. What you want to fix is doing the selling. Keep the room small and let the queue work.","m":"flip"},{"s":"Reading is slow for you, so you record every lecture and listen to it twice while you walk. Your classmates skim the notes once and call it study. In the exam, you remember the walks. They remember the skim. The slow reading did not hold you back. It built a habit that works better than theirs.","r":"Turn It Around: the slow reading is not the disadvantage. It is the reason you listen twice, and listening twice is the reason you remember. Your classmates skim once and forget. The thing that made study harder made the study stick. The obstacle built the method.","m":"flip"},{"s":"Your amateur football team has no star player and the coach is sure that is the weakness. But look at the scores: every player has scored this season, and the other team cannot mark one player out of the game. There is no star to stop. The attack is spread across eleven players, and the other team does not know where it is coming from.","r":"Turn It Around: no star is not a weakness, it is the attack. The other team cannot mark one player out because there is not one to mark. Every player has scored, and the goals come from everywhere. The thing you want to fix is the thing that makes you hard to stop. Keep the goals spread.","m":"flip"},{"s":"You only get thirty minutes a day to write because of the kids, and you are sure that is not enough to finish a book. But look at the pages: you write in short scenes because thirty minutes only fits a scene. The short scenes are what make the book fast and readable. The limit is not slowing the book down. It is giving it its shape.","r":"Turn It Around: thirty minutes is not too little, it is the reason the book works. A scene a day, short and fast, is a style, not a compromise. Give yourself three hours and the scenes would sprawl. The constraint is not in the way of the book. It is the book.","m":"flip"},{"s":"Your job is an hour away by train and you hate the commute. But look at what the train gives you: an hour of reading a day, with no phone signal and nobody to interrupt. That hour is how you finished the course that got you the promotion. The commute is not wasted time. It is the study hall that paid for the job.","r":"Turn It Around: the commute is not wasted time, it is the reason for the promotion. An hour of reading a day, no signal, no interruptions, is a study hall on rails. The train you hate is the classroom that got you the job. The thing you want to shorten is the thing that got you here.","m":"flip"},{"s":"The newest member of your team asks 'dumb' questions in every meeting and everyone finds it annoying. But look at what her questions keep catching: last week her question found the bug that would have broken the release. The week before, her question found the deadline nobody had written down. The questions are not dumb. They are the quality control.","r":"Turn It Around: the 'dumb' questions are not a nuisance, they are the check nobody else does. A bug that would have broken the release, a deadline nobody wrote down, both caught by the person who asks what everyone else assumes. The questions are not slowing the team down. They are keeping it from falling over.","m":"flip"},{"s":"You stay up late to finish your study, so you are tired in class, so you do not understand the lesson, so you have to stay up late to catch up. The late nights are not catching you up. They are making the next day harder, and the harder day makes the next night later. It is not one bad night. It is the same night, every night.","r":"Spot the Circle: late night, tired class, missed lesson, later night. Each step causes the next, and the next makes the first one worse. The study is not failing because you are behind. You are behind because the circle keeps you tired. Break it anywhere: sleep first, and the lesson lands the next day.","m":"loop"},{"s":"You skip lunch to finish your work, so by 3pm you are foggy and slow, so the work takes longer, so you skip lunch again the next day to catch up. The skipped lunch is not saving time. It is making the afternoon slower, and the slower afternoon makes the next day longer. The time you save at noon, you pay for at three.","r":"Spot the Circle: skip lunch, foggy afternoon, longer day, skip lunch again. The lunch you skip does not buy time, it spends it, at 3pm, with interest. The work is not too much for the day. The day is too little for the work, because the circle keeps eating the afternoon. Eat lunch and the circle starves.","m":"loop"},{"s":"You stop telling your partner things because he gets defensive, so he feels shut out and gets defensive, so you stop telling him even more. The silence is not protecting the relationship. It is feeding the defensiveness, and the defensiveness is feeding the silence. Neither of you is the problem. The circle is.","r":"Spot the Circle: silence, defensiveness, more silence. Each one causes the next, and the next makes the first one bigger. You are not fighting about the thing you stopped mentioning. You are fighting about the circle that grew around it. Break it anywhere: say one small thing, and the circle has a gap in it.","m":"loop"},{"s":"You check your bank balance, see it is low, and feel anxious, so you stop checking it. Because you stop checking, you overspend, because you do not know where you stand. The balance drops further, so you avoid checking it even more. The anxiety is not caused by the number. It is caused by not looking at the number.","r":"Spot the Circle: low balance, anxiety, avoid, overspend, lower balance. Each step causes the next, and the next makes the first one worse. The checking is not the painful part. The not-checking is, because it is what lets the spending run free. Look at the number once a week and the circle loses its fuel.","m":"loop"},{"s":"You stop going to the gym because you are embarrassed about being unfit, so you get less fit, so you are more embarrassed, so you stop going even more. The embarrassment is not a reason to stay away. It is the result of staying away, and staying away is what makes it worse. The gym is not judging you. The circle is.","r":"Spot the Circle: embarrassment, absence, less fit, more embarrassment. Each step causes the next, and the next makes the first one bigger. You are not unfit because you stopped going. You stopped going because you felt unfit, and the feeling grew in the gap. Go once, badly, and the circle has a hole in it.","m":"loop"},{"s":"You micromanage your team because they make mistakes, so the team stops thinking for themselves, so they make more mistakes, so you micromanage even more. The control is not fixing the mistakes. It is causing them, by taking away the thinking that would prevent them. The team is not careless. It is trained not to think.","r":"Spot the Circle: control, dependence, mistakes, more control. Each step causes the next, and the next makes the first one worse. The mistakes are not the reason for the control. The control is the reason for the mistakes. Let the team make one small decision and the circle starts to unwind.","m":"loop"}],"guided":[{"s":"Customers keep asking for a feature you're fairly sure is a bad idea.","r":"From their seat they are not requesting a feature. They're describing a workaround they already built for a problem you never saw. The feature is <em>their solution</em>, not their need  -  which is why it looks wrong from here. Ask what they did the last time it happened, not what they want.","m":"seat"},{"s":"\"Our marketing isn't working.\"","r":"\"Marketing\" isn't a thing that can fail; it's a word covering about nine things. Somewhere between a person first hearing the name and a person paying, there is exactly one step where most of them stop. That step is the actual problem, it is much smaller than \"marketing\", and you can usually find it in an afternoon.","m":"in"},{"s":"Two departments have been fighting over the same budget for a year and every meeting ends the same way. Finance says marketing spends too much. Marketing says finance does not understand growth. But step back and count: the budget they are fighting over is 4% of company spend. The real money - 60% - sits in a contract nobody has renegotiated in six years, and neither department owns it, so neither of them fights about it.","r":"Step Back: a year of fighting over 4% while 60% sits untouched in a contract nobody owns. The fight is not about the money - it is about the only money either side is allowed to touch. The boundary of the argument is the problem; the budget line they cannot see is where the money actually is. Swap Places would help each side understand the other - and they already do. Understanding is not the missing piece. The missing piece is the 60% neither of them is looking at.","m":"out"},{"s":"A hospital ward keeps missing its discharge targets, so management adds a daily targets meeting. The meeting takes the senior nurse off the ward for an hour. Discharges slip further. Management adds a second meeting to find out why. The senior nurse is now off the ward for two hours, and the targets slip further still.","r":"Spot the Circle: missed targets, meeting, nurse off the ward, more missed targets, another meeting. Every attempt to fix it feeds it. The meeting is not observing the problem, it IS the problem - it takes the one person who moves discharges off the floor to talk about discharges. Cut the circle anywhere: cancel one meeting and the nurse is back where the work happens. Run the Clock would ask what this looks like next month - worse, by the same mechanism. The clock does not break circles; it just shows you them getting bigger.","m":"loop"},{"s":"Lena runs a cafe and she is sure her coffee beans cost too much, so she spends Sundays hunting for a cheaper supplier. She has switched beans three times this year and her regulars keep noticing. But the cafe is packed at breakfast and empty from 11 to 2, and the rent stays the same. The beans are 8% of her costs. The empty lunch hours are the hole.","r":"Step Back: the beans are 8% of her costs and the cafe is packed at breakfast, so the beans were never the problem. The hole is the empty lunch hours, 11 to 2, with rent ticking over on empty tables. Fix the lunch hours and the bean price stops mattering. Look at the whole week, not the shopping list.","m":"out"},{"s":"The footy team wins nearly every home game and loses nearly every away game, and the coach blames pressure. But look at the whole season: every away ground is a bus trip of three hours or more, the team eats lollies on the bus, and they arrive with twenty minutes to warm up. At home they warm up for an hour. Same players, same skills, different preparation.","r":"Step Back: the problem is not pressure, it is the trip. Three hours on a bus, lollies for lunch, twenty minutes to warm up - that is not preparation, it is a rush. At home they get an hour. Fix the away-day routine and the away record follows. The whole season says so, not just the scoreboard.","m":"out"},{"s":"Priya has rewritten the introduction to her 2,000-word history essay twelve times and she is sure the essay is hopeless. She has spent four evenings on the first 150 words. The body of the essay is still a rough draft with gaps, and the conclusion does not exist yet. The introduction is 150 words out of 2,000. She is polishing a paragraph while the essay is unfinished.","r":"Step Back: the introduction is 150 words out of 2,000, and the body is still a rough draft. Four evenings on the first paragraph will not save an unfinished essay. Write the body, write the conclusion, then come back to the introduction last. The whole essay is the job, not the first paragraph.","m":"out"},{"s":"Maya and Tom argue about the washing up every night. Maya says Tom never does it, and Tom says she leaves the pans. But look at the whole week: both work until seven and get home starving, and the sink is full by eight because dinner happens at eight. Nobody has a free hour. The argument is about the dishes, but the week has no slack in it.","r":"Step Back: the dishes are not the problem, the week is. Both work until seven, dinner is at eight, and nobody has a free hour. The sink is full because the evening is full. Fix the schedule - a roster, a dishwasher, takeaway on Thursdays - and the argument about the pans disappears with it.","m":"out"},{"s":"Dan runs a small surf shop and sales dipped in June, so he is about to cut his marketing budget in half. But look at the whole year: sales dip every June, because winter keeps the beach empty, and they always bounce back in September. June is his quietest month, not his worst. Cutting marketing now means no new customers arriving when the sun comes back in spring.","r":"Step Back: June dips every year because winter empties the beach, and sales always bounce back in September. June is the quiet month, not a crisis. Cutting marketing now starves the spring, when the customers return. Judge the year, not the month, and keep the marketing running.","m":"out"},{"s":"Alex has lifted for a year and the weight on the bar has not moved for three weeks, and he thinks he has hit his limit. But look at the whole year: he added two kilos to his squat most months, and his starting weight has doubled. Three flat weeks after eleven months of steady gains is a pause, not a ceiling. One bad month does not erase a year.","r":"Step Back: eleven months of steady gains and a doubled starting weight, then three flat weeks. That is a pause, not a ceiling. One bad month does not erase a year of progress. Keep lifting, eat, sleep, and check again in a month. The whole year says he is still improving.","m":"out"},{"s":"The project team keeps missing deadlines and everyone blames bad communication. But look closer at how the work actually moves: the shared plan lives in a document nobody owns, so nobody updates it. Tasks change in the chat, the chat scrolls past, and the document still says last week. The team talks plenty. The plan is just never written down anywhere that sticks.","r":"Look Closer: the huge problem is 'bad communication', but underneath it is a tiny one - a document nobody owns, so nobody updates it. Give the plan one owner and one home, and the missed deadlines shrink. The team does not need to talk more. It needs one place where the plan is true.","m":"in"},{"s":"Jess says she cannot concentrate and she is falling behind in her nursing course, so she is thinking about dropping a subject. But look closer at where she studies: the lounge, with the television on, her flatmates coming and going, and her phone buzzing every few minutes. The library is a ten-minute walk and it is open until ten. She has never tried studying there, not once.","r":"Look Closer: 'I cannot concentrate' is a huge problem, but underneath it is a small one - the lounge, the television, the flatmates, the buzzing phone. The library is ten minutes away and open until ten, and she has never tried it. Change the room before changing the course. The small fix comes first.","m":"in"},{"s":"Sam is always late with the rent and his flatmates think he is bad with money. But look closer: rent is due on the 1st and Sam gets paid on the 15th, so he is always two weeks short. He pays in full by the 16th, every month. He is not bad with money. His payday and the rent date do not line up.","r":"Look Closer: 'bad with money' is a huge label, but underneath it is a tiny timing problem - rent on the 1st, payday on the 15th. He pays in full by the 16th, every month. Move the rent date to the 16th and the problem disappears. Check the dates before judging the person.","m":"in"},{"s":"The netball team keeps conceding goals in the last quarter and the coach says the team loses focus. But look closer at the last quarter, exactly: the same centre player cramps at the same time every game, because she skips the water break to keep coaching the younger players on court. She is not losing focus. She is dehydrated, and she is the one running the attack.","r":"Look Closer: 'the team loses focus' is a huge problem, but underneath it is a small one - one player cramping because she skips the water break. She is dehydrated and she runs the attack. Give her the water break and the last quarter changes. The huge problem had a small one hiding inside it.","m":"in"},{"s":"Chris says he cannot save money and blames his salary. But look closer at where the money actually goes: a $14 lunch every workday, a $6 coffee on the way in, and a food delivery most Friday nights. That is about $110 a week, before the weekend. His salary is fine. The small daily spend is the leak, and it is the only part he never counts.","r":"Look Closer: the salary is not the problem, the $110 a week is. A $14 lunch, a $6 coffee, a Friday delivery - small spends that never get counted. Pack lunch three days a week and the leak closes. The huge problem was a small daily habit hiding in plain sight.","m":"in"},{"s":"Amara hates group projects and is sure she works better alone. But look closer at the last three projects: the same person never replies to the group chat, so Amara ends up doing that person's share the night before it is due. The group has no rule for a missing reply and no deadline for drafts. She does not hate groups. She hates doing two people's work.","r":"Look Closer: 'I hate groups' is a huge conclusion, but underneath it is a small one - one person never replies and the group has no rule for it. Set a draft deadline and a rule for a missing reply, and the extra work stops landing on Amara. The huge problem had a small missing rule inside it.","m":"in"},{"s":"Ravi manages a small team and his newest staff member, Zoe, is slow with the new booking system. He has told her twice to speed up. But stand where Zoe is standing: nobody showed her the new system, the training was a single email, and the manual is 80 pages long. She is not slow. She is guessing her way through a system she was never taught.","r":"Swap Places: from Zoe's side there was no training, just one email and an 80-page manual. She is not slow, she is guessing. Sit with her for an hour, show her the system, and the speed follows. The problem was never Zoe. It was the missing hour of teaching.","m":"seat"},{"s":"Mr Patel is annoyed that his tenant never reports problems until they are serious, like the leak that stained the ceiling. But stand where the tenant is standing: she reported a dripping tap three times, a broken heater twice, and nobody came. The tap still drips. She stopped reporting because reporting changed nothing. The leak is the first problem she could not ignore.","r":"Swap Places: from the tenant's side, three tap reports and two heater reports went nowhere, and the tap still drips. She stopped reporting because reporting changed nothing. Fix the tap, answer the next report fast, and the reports will come back. Trust is built by showing up, not by asking for it.","m":"seat"},{"s":"Ms Tran is frustrated that her student Jayden never hands in homework, and she has started to think he does not care. But stand where Jayden is standing: he works at a cafe until ten every weeknight to help his mum with the rent, and he gets home too tired to open a book. He cares. He is just choosing between the homework and the rent, and the rent wins.","r":"Swap Places: from Jayden's side, the cafe closes at ten, the rent needs his wages, and homework comes after an empty tank. He is not careless, he is choosing the rent. Ask what his evenings actually look like before deciding he does not care. The homework is not the whole story.","m":"seat"},{"s":"A customer is shouting at the shop assistant because the refund is taking forever and the queue is growing. But stand where the assistant is standing: the till crashed twenty minutes ago, the manager is on the phone to head office, and she cannot process a single refund until the system comes back. She is not slow. She is stuck behind a screen that will not move.","r":"Swap Places: from the assistant's side, the till crashed twenty minutes ago and no refund can move until the system comes back. She is not slow, she is stuck. The queue is angry at the wrong person. Wait for the system, or let the manager explain it, and the shouting stops being aimed at her.","m":"seat"},{"s":"Karen is upset that her teenage son never talks to her any more, and she keeps asking him what is wrong. But stand where he is standing: every time he mentions something, it turns into a lecture about his grades, his friends, or his phone. He learned that talking leads to a lecture, so he stopped talking. He is not hiding anything. He is avoiding the lecture.","r":"Swap Places: from his side, every conversation becomes a lecture about grades, friends, or his phone, so he stopped starting them. He is not hiding anything, he is avoiding the lecture. Listen to one story all the way through without fixing it, and the talking comes back. The lecture is the wall, not the silence.","m":"seat"},{"s":"The coach is annoyed his striker, Ben, is not chasing the ball the way he used to, and the coach is thinking about benching him. But stand where Ben is standing: his ankle has hurt for three weeks and he has told nobody, because last year another player lost his spot after mentioning an injury. He is not lazy. He is playing hurt and hiding it to keep his place.","r":"Swap Places: from Ben's side, his ankle has hurt for three weeks and last year a player lost his spot for mentioning an injury, so he hides it. He is not lazy, he is playing hurt. Ask about the ankle before benching, and make it safe to say it hurts. The effort is there, the injury is the story.","m":"seat"},{"s":"Ella hates chemistry, her marks are ordinary, and her friends say drop it and be happy. But run the clock forward: next year, chemistry is a prerequisite for the nursing course she wants, and without it she waits a whole extra year. She hates chemistry now, but she wants nursing more. Dropping it feels good now and costs a year next year.","r":"Run the Clock: next year chemistry is a prerequisite for nursing, and without it she waits a whole extra year. She hates chemistry now but wants nursing more. A term of hating chemistry buys the course she wants. Look at next year, not just this term, and the drop stops looking free.","m":"clock"},{"s":"Marcus is about to buy a ten-year-old car for $3,000 because it looks fine, and the seller says it just needs new tyres. But run the clock forward a year: the tyres are $600, the brakes are due, the rego is $800, and the mechanic has already warned him the gearbox is noisy. The cheap car costs $5,000 by next winter. The price tag is not the price.","r":"Run the Clock: a year from now the tyres are $600, the brakes are due, the rego is $800, and the gearbox is noisy. The $3,000 car costs $5,000 by next winter. The price tag is not the price. Look at next winter, not just today, and the cheap car stops looking cheap.","m":"clock"},{"s":"Three straight losses, and the club is about to sack the coach. But run the clock back a year: the same coach lost his first four games last season and then won the league. The team has three new players who are still learning the system, and two starters are injured. Three losses is a slow start, and last year a slow start became a title.","r":"Run the Clock: last year the same coach lost four straight and then won the league, and this year three new players are still learning the system with two starters injured. Three losses is a slow start, not a verdict. Look at last season, not just last week, and the sack looks rushed.","m":"clock"},{"s":"Nina is about to break her lease because the neighbour's building work starts at seven every morning. But run the clock forward three weeks: the building work finishes, the street goes quiet, and her rent is $80 a week cheaper than anywhere else nearby. She would be paying more to move, for a noise that ends in three weeks. The lease is a year, the noise is three weeks.","r":"Run the Clock: the building work finishes in three weeks, the street goes quiet, and her rent is $80 a week cheaper than anywhere else nearby. She would pay more to move, for a noise that ends in three weeks. The lease is a year, the noise is three weeks. Wait it out.","m":"clock"},{"s":"After a month at the gym, Omar is about to quit, because he still has to force himself to go. But run the clock forward a year: if he keeps going three times a week, the habit is automatic by then. A month of forcing it is the price of a year of not thinking about it. Quitting now buys back the forcing, not the ease.","r":"Run the Clock: a year from now, three times a week has made the habit automatic. A month of forcing it is the price of a year of not thinking about it. Quitting now buys back the forcing, not the ease. Look a year ahead, not just this month, and the hard part is already nearly paid for.","m":"clock"},{"s":"The rent is cheap, so Mei is about to sign a five-year lease on a shopfront. But run the clock forward two years: the council is redeveloping the street, the footpath will be closed for a year, and half the shops are already leaving. The cheap rent is cheap because everyone knows what is coming. Five years is a long time to be stuck behind a fence.","r":"Run the Clock: in two years the council redevelops the street, the footpath closes for a year, and half the shops are already leaving. The rent is cheap because everyone knows what is coming. Five years behind a fence is a long time. Look at year two, not just today, and the cheap lease stops looking cheap.","m":"clock"},{"s":"The beach trip is ruined because it has rained all weekend, so the group sits in the holiday house staring at the walls. But the rain is the point: the trail behind the house has waterfalls, and after a wet weekend they run at their best. The beach was the plan, but the rain made the trail the better day. The rain that ruined the beach made the hike.","r":"Turn It Around: the rain that ruined the beach is what makes the waterfalls run at their best. The trail behind the house was the backup plan, but after a wet weekend it is the better day out. The obstacle was the advantage all along. The rain did not ruin the weekend, it moved it to the trail.","m":"flip"},{"s":"The car broke down two hours into the road trip and the group is stuck at a petrol station waiting for a tow. But the breakdown is the point: the only other route goes through the city, and by the time the car is fixed the traffic will have cleared. The delay means they miss the worst of the city. The breakdown that wasted the day saved the drive.","r":"Turn It Around: the breakdown that wasted the day is what lets them miss the worst of the city. By the time the car is fixed, the traffic has cleared. The delay was not lost time, it was a free pass through the city. The thing in the way was the thing that made the drive work.","m":"flip"},{"s":"Jake is the only student in his tutorial without a laptop, so he takes notes by hand while everyone else types, and he feels behind. But the handwriting is the point: he has to decide what matters as he writes, so he listens harder and remembers more. In the last test he scored higher than the typists. The thing that made him feel behind made him learn.","r":"Turn It Around: writing by hand forces him to decide what matters as he writes, so he listens harder and remembers more. He scored higher than the typists in the last test. The thing that made him feel behind is the thing that made him learn. The missing laptop was the advantage all along.","m":"flip"},{"s":"Grace's bookshop has no parking, and she is sure it costs her customers, because the chain store down the road has a car park. But the lack of parking is the point: every customer walks past three shops to reach her door, and half of them come in because they were already walking. The chain store's car park means nobody walks past it. Her worst feature is her foot traffic.","r":"Turn It Around: the lack of parking means every customer walks past three shops to reach her door, and half come in because they were already walking. The chain store's car park means nobody walks past it. Her worst feature is her foot traffic. The thing in her way is the thing that brings customers in.","m":"flip"},{"s":"The basketball team lost its star scorer to injury and everyone says the season is over, because the attack ran through her. But the loss is the point: the other four players have to score now, so the defence cannot just guard one person, and the team has won its last three games by sharing the ball. The star made the team predictable. Losing her made it harder to guard.","r":"Turn It Around: the star made the team predictable, because the attack ran through her. Now the other four have to score, so the defence cannot just guard one person, and the team won three straight by sharing the ball. Losing her made the team harder to guard. The thing in the way was the thing that made it work.","m":"flip"},{"s":"Aisha hates her night shifts at the warehouse because the hours are lonely, and she is thinking about quitting for a day job. But the nights are the point: the warehouse is quiet after midnight, nobody interrupts her, and she has finished two online courses on those shifts. The day job would pay the same and leave her no time to study. The lonely hours are her classroom.","r":"Turn It Around: the warehouse is quiet after midnight, nobody interrupts her, and she has finished two online courses on those shifts. The day job would pay the same and leave her no time to study. The lonely hours are her classroom. The thing she wants to escape is the thing that is getting her qualified.","m":"flip"},{"s":"Leo is exhausted every morning, so he drinks coffee late in the afternoon to get through the day. But the coffee is the circle: the late coffee keeps him awake at night, so he sleeps badly, so he wakes up exhausted, so he drinks more coffee. He is tired because of the coffee, and he drinks coffee because he is tired. The fix is not more coffee, it is less.","r":"Spot the Circle: the late coffee keeps him awake, so he sleeps badly, so he wakes up exhausted, so he drinks more coffee. He is tired because of the coffee, and he drinks coffee because he is tired. Break the circle at the coffee, not at the morning. One step causes the next, and the next causes the first.","m":"loop"},{"s":"The team argues in every meeting, so people have started skipping the meetings to avoid the arguments. But skipping is the circle: with fewer people in the room, decisions get made without them, misunderstandings grow, and the next meeting has even more to argue about. The arguments cause the skipping, and the skipping causes the arguments. The meetings are not the problem, the empty chairs are.","r":"Spot the Circle: the arguments cause the skipping, and the skipping causes the arguments. Fewer people in the room means decisions get made without them, misunderstandings grow, and the next meeting has more to argue about. Break the circle by showing up, not by staying away. The skipping feeds the arguing, and the arguing feeds the skipping.","m":"loop"},{"s":"Noah puts off his assignments because they make him anxious, so he watches videos instead. But the delay is the circle: the closer the deadline gets, the more anxious he feels, and the more anxious he feels, the harder it is to start. He is anxious because he has not started, and he has not started because he is anxious. The videos are not relaxing him, they feed the worry.","r":"Spot the Circle: he is anxious because he has not started, and he has not started because he is anxious. The closer the deadline gets, the harder it is to start, and the videos feed the worry. Break the circle by starting small, not by waiting. The worry grows while he waits, and the waiting grows while he worries.","m":"loop"},{"s":"Tara shops online when she is stressed, because buying something feels like a treat after a hard week. But the shopping is the circle: the money she spends leaves her short before payday, being short stresses her out, and the stress sends her back to the shops. She shops because she is stressed, and she is stressed because she shops. The treat is the thing making the week harder.","r":"Spot the Circle: she shops because she is stressed, and she is stressed because she shops. The money leaves her short before payday, being short stresses her out, and the stress sends her back to the shops. Break the circle at the shops, not at the stress. The spending feeds the stress, and the stress feeds the spending.","m":"loop"},{"s":"The gym cut its cleaning budget to save money. But the cut is the circle: the showers are dirty, members complain and some leave, revenue falls, and the owner cuts the cleaning budget again to make up the shortfall. The saving causes the dirty showers, and the dirty showers cause the saving. The budget cut is eating the business it was meant to save.","r":"Spot the Circle: the saving causes the dirty showers, and the dirty showers cause the saving. Members complain, some leave, revenue falls, and the owner cuts cleaning again to make up the shortfall. Break the circle by spending on the showers, not by cutting them. The cut feeds the dirt, and the dirt feeds the cut.","m":"loop"},{"s":"Hassan speeds on his delivery run because he is running late. But the speeding is the circle: he gets a fine, he has to work extra shifts to pay it, the extra shifts leave him tired and late again, and he speeds again. The fine costs more time than the speeding saved. He is late because he speeds, and he speeds because he is late.","r":"Spot the Circle: he is late because he speeds, and he speeds because he is late. The fine means extra shifts, the shifts leave him tired and late again, and he speeds again. The fine costs more time than the speeding saved. Break the circle by leaving earlier. The speeding feeds the lateness, and the lateness feeds the speeding.","m":"loop"}],"solo":[{"s":"You never have time to learn the thing that would save you time.","r":"No time \u2192 don't learn the time-saver \u2192 still no time. It's self-sealing, and self-sealing loops never open by trying harder <em>inside</em> them  -  the loop is what's converting your effort into more loop. They open when someone spends, once, a resource they've decided they can't afford.","m":"loop"},{"s":"A charity finds that donations drop every time it publishes how efficiently it spends money.","r":"From the donor's chair the message isn't \"we're careful with your money.\" It reads as \"we're fine.\" Efficiency sounds like <em>sufficiency</em>, and nobody rushes to rescue something that's coping. The numbers were true and the reader was wrong  -  which is a failure of seating, not of honesty.","m":"seat"},{"s":"Your open-source project keeps getting angry issues from users, and the maintainers are burning out. The issues all read the same way: 'this does not work'. But check what actually happened in the last ten: seven of them never said what they tried, three of them were using a two-year-old version, and every single one of them got a fix within a day - then never came back to say thanks, or to say it worked. The maintainers see a wall of anger. The users see a wall of silence.","r":"Swap Places: from the user's seat, 'this does not work' is the whole report they know how to write, and silence after a fix reads as 'nobody cares'. From the maintainer's seat, silence after a fix reads as 'nobody appreciates it'. Both sides are reading the same silence and hearing opposite things. The fix is not a better issue template - it is a reply that says 'fixed, let us know', so the silence stops meaning two different things. Look Closer would hunt for the one broken thing in the ten issues - but there is not one. The versions differ, the reports differ. The common thread is what happens after the fix: nothing. And nothing is doing the damage.","m":"seat"},{"s":"You have been in the same job for six years and you tell yourself you are stuck. The facts: in year one you could not run a meeting. In year three you ran the biggest project in the team. This year you trained two people to do the job you had in year three. Your title has not changed once. Your work has changed completely - three times - and the title is the only thing standing still.","r":"Run the Clock back: year one you could not run a meeting; year three you ran the biggest project; this year you trained your own replacements. Run it forward: the person who trained two successors is not stuck, they are out of room in this shape. The title is a label from year one, and you are measuring a six-year career against a word that stopped moving in year two. Turn It Around would say being stuck is useful - it is not. What is useful is seeing that 'stuck' describes the title, not the work. The work moved three times. The word did not.","m":"clock"},{"s":"Priya is failing statistics and is ready to drop her whole degree. She failed the two statistics tests, both held at 8am on Tuesdays. She works night shifts at a warehouse on Mondays until 3am, so she walks into those tests on three hours of sleep. Her other four subjects, all in the afternoon, are distinctions. The degree is not the problem.","r":"Step Back and look at the whole degree, not just one subject. Four distinctions, two fails, and both fails sit at 8am after a night shift. The problem is not statistics and it is not Priya. It is a timetable that puts her test at her worst hour. Change the shift or the class time, and the degree looks different.","m":"out"},{"s":"Sam's bakery sells out of sourdough every single day by 10am, and the shop still loses money. The sourdough takes 18 hours to make, uses the most expensive flour, and sells for $9 a loaf. The muffins take 20 minutes, cost almost nothing, and sell for $6. The queue is there for the bread, but the profit is sitting in the muffins.","r":"Step Back and look at the whole shop, not just the queue. The sourdough brings people in, but each loaf costs more to make than it earns. The muffins are the business. Sam does not need more sourdough. Sam needs the queue to notice the muffins, or a sourdough price that covers its 18 hours.","m":"out"},{"s":"Nadia's caf\u00e9 makes the best coffee in the suburb and the tables are empty every morning. She has tried new beans, cheaper prices, and a loyalty card. The caf\u00e9 sits at the dead end of a side street, behind the car park, with no sign on the main road. The busy caf\u00e9 two streets over serves worse coffee from a cart, right where the commuters walk past.","r":"Step Back and look at the whole street, not just the cup. Nadia has been fixing the coffee, but the coffee was never the problem. Her caf\u00e9 is invisible from the main road, and the busy cart two streets over proves the customers are there. The fix is a sign or a stall on the main road, not new beans.","m":"out"},{"s":"The flatmates have been arguing for months about the power bill, and everyone is sure it is Jake's gaming computer. Jake's computer draws 400 watts for three hours a night. The hot water system is 22 years old, runs all day and night, and the bill shows hot water is 55% of the total. Jake's computer is 4%. The argument has been about the wrong appliance for months.","r":"Step Back and look at the whole bill, not just the loudest machine. Jake's computer is 4% of the total and the hot water system is 55%. The flatmates have spent months blaming the wrong appliance. The fix is not a rule about gaming. It is a new hot water system, or a switch on the old one.","m":"out"},{"s":"Leo moved to a new city six months ago and is convinced nobody there wants friends. He goes to work, to the supermarket, and home, every single day. He has not joined a club, a team, or a class. He has not been to a single pub, park, or party. Six months, three places, zero invitations. The city is not the problem.","r":"Step Back and look at the whole six months, not just the lonely evenings. Leo has visited exactly three places and joined nothing, so nobody has had a chance to meet him. Friendship needs a place where it can happen. One club, one team, one regular spot, and the city starts looking completely different.","m":"out"},{"s":"The product team has worked three weekends in a row and everyone feels like they are failing. The launch date on the wall is Friday. The real deadline, the one the client agreed, is the following Wednesday, and the contract says so on page two. The team is five days ahead of the real deadline and five days behind the date someone wrote on the wall.","r":"Step Back and look at the whole calendar, not just the date on the wall. The team is five days ahead of the deadline the client actually agreed, and five days behind a date someone invented. They are not failing. They are burning out over a deadline that does not exist. Rub the wall date out and the failure disappears.","m":"out"},{"s":"Maya's budget spreadsheet says the event will lose $3,000 and her boss wants to cancel it. Every line looks right. The venue is $2,000, catering is $1,500, tickets bring in $5,000. Then she spots it. Cell D14, the ticket income, is typed as $500, not $5,000. One missing zero. The whole event was never losing money.","r":"Look Closer. The huge problem, a $3,000 loss, is a tiny one: a single zero missing from one cell. Fix cell D14 and the event makes $1,500. Always check whether the enormous problem has a small one hiding inside it before cancelling anything.","m":"in"},{"s":"Jon is sure his friendship with Max is finished. Max has not replied to a single message in three weeks. Jon has been replaying their last conversation, sure he said something wrong. Then he opens his messages. His last three texts are still sitting in drafts, never sent. Max has not been ignoring him. Max has not heard from him at all.","r":"Look Closer. The huge question, whether the friendship is over, is a tiny one: three texts sitting in drafts. Max is not ignoring Jon, because Max never got a message to ignore. Send the drafts before deciding a friendship is finished. The small problem is the whole problem.","m":"in"},{"s":"The flat is freezing every night and the heating bill has doubled. The landlord says the whole system needs replacing, $3,000, and the flatmates are saving up. Then Ana notices the living room window. The latch is broken, so the window sits open two centimetres all night, all winter. The heating has been warming the street.","r":"Look Closer. The huge problem, a $3,000 new heating system, is a tiny one: a broken latch holding one window open two centimetres. Fix the latch and the flat stays warm. Always check the small cheap thing before paying for the enormous one.","m":"in"},{"s":"The team says they cannot communicate. Every meeting runs over by an hour and nothing gets decided. The Monday meeting has twelve people, no agenda, and no finish time. The Thursday meeting has four people, one page of notes, and ends in twenty minutes with decisions made. Same team, same people. The problem is not communication. It is one meeting.","r":"Look Closer. The huge problem, a team that cannot communicate, is a tiny one: the Monday meeting has twelve people and no agenda. The Thursday meeting proves the team can decide things in twenty minutes. Fix the one meeting, or cancel it, and the communication problem shrinks with it.","m":"in"},{"s":"Dan's phone dies by lunchtime every day and he is ready to buy a new one for $1,200. The battery is at 100% at 8am and dead by 1pm. The battery settings show one app, a game he opened once at the airport, has used 68% of the power running in the background. The phone is fine. One app he never plays is eating it alive.","r":"Look Closer. The huge problem, a dead phone and a $1,200 replacement, is a tiny one: a single app burning 68% of the battery in the background. Delete the game he opened once at the airport and the phone lasts the day. The phone was never broken. One app was.","m":"in"},{"s":"Ella has rewritten her history essay four times and is sure she cannot write. Her tutor keeps writing 'unclear argument' on every draft. The essay itself is good: the evidence is strong and the conclusion is clear. But the first paragraph promises an argument about trade, and the essay is actually about war. The tutor has been reading the promise, not the essay.","r":"Look Closer. The huge problem, an essay that cannot be written, is a tiny one: the first paragraph promises trade and the essay delivers war. The tutor is not confused by the essay. The tutor is confused by the promise. Rewrite one paragraph so it promises war, and the 'unclear argument' disappears.","m":"in"},{"s":"Karen is furious that her team keeps missing deadlines. She has told them three times that they are not trying hard enough. From the team's side, the brief has changed four times this week: new target customer on Monday, new budget on Wednesday, new launch date on Friday. They are not missing the deadline. They are chasing a deadline that keeps moving.","r":"Swap Places and stand where the team is standing. From Karen's chair, the team looks lazy. From the team's chairs, the brief changed four times in a week and the deadline moved with it. The team is not failing to hit a target. There is no target to hit. Freeze the brief for a week and watch the deadlines land.","m":"seat"},{"s":"Mark thinks his 16-year-old daughter is rude. She slams her door and answers in one word. From her side, every conversation for a month has started the same way: a criticism about her room, her grades, or her friends. She is not slamming the door on her father. She is slamming it on the first sentence, because she already knows how it ends.","r":"Swap Places and stand where she is standing. From Mark's side, his daughter is rude. From her side, every conversation opens with a criticism, so she stops listening before it starts. She is not rude to her father. She is bracing for the first sentence. Open with a question instead of a criticism, and the door stays open.","m":"seat"},{"s":"A customer has been waiting forty minutes for a main course and is writing a one-star review in his head. From the waiter's side, the kitchen lost two cooks to a flu outbreak this morning, the chef is doing the work of three people, and the waiter has already apologised twice and offered free bread. The customer sees a slow waiter. The waiter sees a kitchen running on one cook.","r":"Swap Places and stand where the waiter is standing. From the table, the service looks lazy. From the floor, the kitchen lost two cooks this morning and the chef is doing the work of three. The waiter has already apologised twice. The slowness is not the service. It is a flu outbreak, and no amount of hurrying fixes that.","m":"seat"},{"s":"Mrs Hart, the landlord, thinks her tenant is difficult. He keeps complaining about the heater and she thinks he is angling for cheaper rent. From his side, he reported the broken heater three times: in writing, in May, in July, and again in September. It is now November and the heater still does not work. He is not difficult. He is cold.","r":"Swap Places and stand where the tenant is standing. From Mrs Hart's side, he looks difficult. From his side, he reported a broken heater three times in writing, across May, July, and September, and it is November now. He is not angling for cheaper rent. He is cold. Fix the heater and the difficult tenant disappears.","m":"seat"},{"s":"Mr Chen thinks Jayden does not care about school. Jayden falls asleep in class and has not handed in homework for a month. From Jayden's side, he works twenty hours a week at a fast food place to help his mum pay rent, finishes at midnight, and starts school at 8am. He is not lazy. He is a tired kid carrying an adult's load.","r":"Swap Places and stand where Jayden is standing. From Mr Chen's desk, Jayden looks like he does not care. From Jayden's side, he works twenty hours a week, finishes at midnight, and starts school at 8am. He is not lazy. He is exhausted. The homework is not the problem. The twenty hours are.","m":"seat"},{"s":"Sofia thinks her friend Ben has gone cold. He never replies to her messages anymore. From Ben's side, the group chat fires 400 messages a day, and Sofia's messages arrive in the middle of that flood. He opens the chat, sees 87 unread, and closes it again. He is not ignoring Sofia. He is drowning in a chat that never stops.","r":"Swap Places and stand where Ben is standing. From Sofia's side, Ben has gone cold. From Ben's side, the group chat fires 400 messages a day and hers arrive in the middle of the flood. He is not ignoring her. He cannot find her. Message him directly, one to one, and the message stops being one of 400.","m":"seat"},{"s":"Rachel has a job offer from a startup that pays less but does work she actually cares about. Her current job pays well and bores her rigid. She has been turning the offer over for a month. The startup job, if she takes it, means a tighter year. Her current job, if she stays, means five more years of the same boredom, and she already knows how that feels.","r":"Run the Clock forward. The startup means one tighter year. Staying means five more years of a boredom she already knows by heart. A tight year ends. Five years of boredom does not. The question is not which job pays more. It is which year she wants to live through, and then which five.","m":"clock"},{"s":"Tom and his best mate have not spoken in two weeks over a $40 split of a dinner bill. Tom paid, his mate said he would transfer it, and the transfer never arrived. Tom is ready to end a ten-year friendship over it. Ten years, hundreds of dinners, one $40 transfer. In a year, the $40 will be forgotten. The friendship might not be.","r":"Run the Clock forward a year. The $40 will be forgotten, because $40 always is. The ten-year friendship, once ended, does not come back in a year. Tom is not deciding about $40. He is deciding about ten years. Ask for the $40, plainly, and keep the ten years.","m":"clock"},{"s":"Alex needs new work boots. The cheap pair is $90 and lasts about six months. The good pair is $240 and lasts about three years. Alex buys the cheap pair every six months and complains about money. In three years, the cheap boots will have cost $540. The good boots will have cost $240, and he will still be wearing them.","r":"Run the Clock forward three years. The cheap boots cost $540 and the good boots cost $240. Alex is not saving money by buying cheap. He is spending more than twice as much and complaining about it. The expensive boots are the cheap boots. Buy once, wear them for three years, and keep the difference.","m":"clock"},{"s":"Zoe is lying awake the night before her biology exam, convinced it decides her future. It is one exam, worth 15% of one subject, in a degree with forty exams. She has already passed thirty of them. In five years, nobody will ask about this one exam. They will ask whether she finished the degree, and she is thirty exams into that answer.","r":"Run the Clock forward five years. This exam is 15% of one subject in a degree with forty exams, and Zoe has already passed thirty of them. In five years, nobody asks about one exam. They ask whether she finished. She is thirty exams into that answer. Sleep, sit the exam, and keep going.","m":"clock"},{"s":"Rob and Ellie have been arguing for a week about the wedding napkins. Ivory or white, linen or cotton, and the hire company charges $2 per napkin either way. The wedding is one day. The marriage is the next fifty years. In ten years, neither of them will remember the napkins. They will remember whether the week before the wedding felt like a fight or a celebration.","r":"Run the Clock forward ten years. The napkins cost $2 either way and the wedding lasts one day. The marriage lasts fifty years. In ten years, neither of them remembers the napkins. They remember whether the week before felt like a fight or a celebration. Pick a napkin in five minutes and spend the week celebrating.","m":"clock"},{"s":"Nina wants to learn Italian before a trip in a year, but she is sure she has no talent for languages. She tried once, an hour a day for a week, then stopped. Fifteen minutes a day for a year is ninety hours. An hour a day for a week is seven hours, then nothing. She needs ninety hours spread out, not seven hours in a burst.","r":"Run the Clock forward a year. Fifteen minutes a day is ninety hours. An hour a day for a week is seven hours, then nothing. Nina does not need talent. She needs the small daily habit, not the big burst. Start tonight, fifteen minutes, and the trip arrives with ninety hours behind her.","m":"clock"},{"s":"Greenleaf, a bookshop with three staff, is losing customers to a giant online retailer. The giant has every book and delivers in a day. Greenleaf cannot match the range or the price. But Greenleaf knows ever
