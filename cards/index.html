<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Moves — the card game, on screen</title>
<style>
  :root{
    --pink:#ff2e88; --yellow:#ffd400; --lime:#7dff2e; --purple:#7b2eff;
    --cyan:#00d4ff; --orange:#ff6b00; --ink:#141414; --paper:#fffbe8;
    --white:#ffffff; --muted:#4a4a4a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    background-image:radial-gradient(#14141414 1.5px, transparent 1.5px);
    background-size:22px 22px;
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:26px 18px 90px}
  h1{
    display:inline-block; font-size:30px; line-height:1.05; font-weight:900;
    text-transform:uppercase; letter-spacing:-.01em; margin:0 0 10px;
    background:var(--yellow); padding:8px 14px; border:3px solid var(--ink);
    border-radius:12px; box-shadow:5px 5px 0 var(--ink); transform:rotate(-1.2deg);
  }
  .sub{font-weight:700; font-size:17px; margin:10px 0 20px}
  .tagline{
    display:inline-block; font-weight:900; text-transform:uppercase; font-size:15px;
    background:var(--pink); color:#fff; padding:6px 12px; border:3px solid var(--ink);
    border-radius:999px; box-shadow:3px 3px 0 var(--ink); transform:rotate(1.5deg);
    margin:0 0 18px;
  }
  .progress{
    display:flex; align-items:center; gap:10px; margin:0 0 16px; flex-wrap:wrap;
  }
  .progress .roundlabel{
    font-weight:900; text-transform:uppercase; font-size:13px; letter-spacing:.05em;
    background:var(--ink); color:#fff; padding:6px 10px; border-radius:999px;
  }
  .segs{display:flex; gap:6px}
  .seg{
    width:26px; height:14px; border:2.5px solid var(--ink); border-radius:999px;
    background:var(--white);
  }
  .seg.done{background:var(--lime)}
  .seg.now{background:var(--pink); animation:pulse 1s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
  @keyframes popin{
    0%{transform:scale(.88) rotate(-1deg); opacity:0}
    70%{transform:scale(1.03) rotate(.5deg); opacity:1}
    100%{transform:scale(1) rotate(0deg); opacity:1}
  }
  @keyframes slideup{
    from{transform:translateY(14px); opacity:0}
    to{transform:translateY(0); opacity:1}
  }
  @keyframes wiggle{
    0%{transform:rotate(-1.6deg)}
    50%{transform:rotate(1.6deg)}
    100%{transform:rotate(-1.6deg)}
  }
  .moverow{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px; margin-bottom:20px;
  }
  .movecard{
    font:inherit; text-align:left; cursor:default; color:var(--ink);
    border:3px solid var(--ink); border-radius:14px; padding:13px 14px;
    min-height:56px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .movecard:nth-child(odd){transform:rotate(-.8deg)}
  .movecard:nth-child(even){transform:rotate(.8deg)}
  .movecard.c0{background:var(--pink); color:#fff}
  .movecard.c1{background:var(--yellow)}
  .movecard.c2{background:var(--lime)}
  .movecard.c3{background:var(--purple); color:#fff}
  .movecard.c4{background:var(--cyan)}
  .movecard.c5{background:var(--orange); color:#fff}
  .movecard.pickable{cursor:pointer}
  .movecard.pickable:hover{animation:wiggle .35s ease-in-out infinite}
  .movecard.sel{
    transform:translate(-2px,-2px) rotate(0deg) scale(1.03);
    box-shadow:7px 7px 0 var(--ink); outline:3px solid var(--ink); outline-offset:2px;
  }
  .movename{display:block; font-size:17px; font-weight:900; text-transform:uppercase; letter-spacing:.02em; margin-bottom:3px}
  .movehint{display:block; font-size:13.5px; font-weight:600; line-height:1.4}
  .dealt{
    font-size:17px; font-weight:800; margin:4px 0 14px; padding:14px 16px;
    background:var(--yellow); border:3px solid var(--ink); border-radius:12px;
    box-shadow:4px 4px 0 var(--ink);
  }
  .card{
    background:var(--white); border:3px solid var(--ink); border-radius:16px;
    padding:22px 22px; margin-bottom:16px; box-shadow:6px 6px 0 var(--ink);
    animation:slideup .3s ease both; position:relative;
  }
  .card.exp{
    background:var(--yellow); animation:popin .35s ease both;
  }
  .card.talk{background:var(--lime)}
  .sticker{
    position:absolute; top:-14px; right:16px; font-weight:900; font-size:13px;
    text-transform:uppercase; letter-spacing:.05em; padding:6px 12px;
    border:3px solid var(--ink); border-radius:999px; box-shadow:3px 3px 0 var(--ink);
    transform:rotate(2.5deg);
  }
  .sticker.problem{background:var(--pink); color:#fff}
  .sticker.expert{background:var(--purple); color:#fff; transform:rotate(-2deg)}
  .sticker.talk{background:var(--ink); color:var(--lime)}
  .eyebrow{
    font-size:12px; font-weight:900; letter-spacing:.09em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }
  .sit-text{font-size:20px; line-height:1.45; font-weight:700; margin:0}
  .reframe{font-size:17px; line-height:1.55; font-weight:600; margin:0 0 8px}
  .movetag{
    display:inline-block; font-size:13px; font-weight:900; letter-spacing:.05em;
    text-transform:uppercase; color:#fff; background:var(--ink);
    border-radius:999px; padding:8px 14px; margin-top:10px;
  }
  .cardfoot{font-size:13.5px; font-weight:600; color:var(--muted); margin-top:12px}
  .prompt{font-size:17px; font-weight:800; margin:4px 0 14px}
  .prompt .hi{background:var(--yellow); padding:1px 6px; border:2px solid var(--ink); border-radius:6px}
  .compare{font-size:16px; font-weight:700; margin:12px 0 0}
  .compare strong{background:var(--pink); color:#fff; padding:1px 7px; border:2px solid var(--ink); border-radius:6px}
  .beat{
    font-size:16px; font-weight:800; margin:14px 0 0; padding:12px 14px;
    background:var(--white); border:2.5px dashed var(--ink); border-radius:12px;
  }
  .bigbtn{
    font:900 17px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer;
    background:var(--pink); color:#fff; border:3px solid var(--ink); border-radius:12px;
    padding:17px 22px; margin:8px 10px 8px 0; min-height:54px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .bigbtn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
  .bigbtn:disabled{background:#b9b2a6; cursor:default; transform:none; box-shadow:4px 4px 0 var(--ink)}
  .ghostbtn{
    font:900 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer;
    background:var(--white); color:var(--ink); border:3px solid var(--ink); border-radius:12px;
    padding:16px 20px; margin:8px 10px 8px 0; min-height:52px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .ghostbtn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
  .trackpick{display:grid; grid-template-columns:1fr; gap:14px; margin:20px 0}
  @media (min-width:560px){ .trackpick{grid-template-columns:1fr 1fr} }
  .trackbtn{
    font:inherit; text-align:left; cursor:pointer; color:var(--ink);
    border:3px solid var(--ink); border-radius:16px; padding:20px;
    min-height:56px; box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .trackbtn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
  .trackbtn.younger{background:var(--lime); transform:rotate(-.8deg)}
  .trackbtn.older{background:var(--purple); color:#fff; transform:rotate(.8deg)}
  .trackbtn strong{display:block; font-size:21px; font-weight:900; text-transform:uppercase; margin-bottom:4px}
  .trackbtn span{font-size:14.5px; font-weight:600}
  .note{font-size:14px; font-weight:600; color:var(--muted); margin-top:16px}
  .talkq{font-size:19px; font-weight:800; margin:0 0 8px}
  .burst{
    position:absolute; inset:-18px; z-index:-1; border-radius:50%;
    background:repeating-conic-gradient(var(--yellow) 0 12deg, transparent 12deg 24deg);
    opacity:.55; animation:spin 14s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .expwrap{position:relative; z-index:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Six Moves</h1>
  <p class="tagline">The card game, on screen</p>
  <p class="sub">Six tricks. Six problems. Can you spot the trick?</p>
  <div id="app"></div>
  <noscript><p class="note">This game needs JavaScript. Open it in a browser with scripts on.</p></noscript>
</div>

<script>
/* ---------------------------------------------------------------
   SIX MOVES — card game, on screen (Mind Vault, #28, IT3)
   Same canonical data as reframe.html and cards.html, same laws:
     1. Generate-then-compare. Never grade a free-response reframe.
     2. Worked examples first, then fade the scaffolding.
     3. The player must be able to NAME the move. (C1 / portable-skill test)
   No score, no timer, no streaks, no points. No network, no storage.
   Data: MOVES and TRACKS below are stamped from data/moves.json.
   IT3: plain move names, lighter younger situations, "Guess the trick"
   in Watch, "Beat the expert" compare, punk UI.
   IT5r: two sets per track, each a six-round game. The other set is
   offered at the table-talk screen as an opt-in - a fresh game, not a
   longer one. A reload starts over at the first set; nothing is stored.
--------------------------------------------------------------- */
const MOVES = {"out":{"name":"Step Back","hint":"Look at the whole thing, not just the bit in front of you."},"in":{"name":"Look Closer","hint":"The big problem has a small problem hiding inside it."},"seat":{"name":"Swap Places","hint":"Stand where they are standing and look from there."},"clock":{"name":"Run the Clock","hint":"What does this look like next week? Next year? Last year?"},"flip":{"name":"Turn It Around","hint":"The thing in your way might be the thing that makes it work."},"loop":{"name":"Spot the Circle","hint":"It's not happening once. It goes round and round, each step causing the next."}};
const TRACKS = {"younger":{"label":"Younger (roughly 9–13)","sets":[{"label":"First set","watch":[{"s":"Your football team loses most weeks and everyone says you need better players. But here's the weird bit: you usually WIN the first half. Then the last ten minutes hit, the other team brings on fresh legs, your coach's subs stay glued to the bench, and your whole team turns to jelly at exactly the same time. Nobody got worse in ten minutes. They just all ran out of legs together.","r":"Step back and look at the whole game, not just the score. The problem was never 'better players' — it was tired legs in the last ten minutes. That's a subs problem, not a players problem. Same team, same skills, just empty tanks at the same time every week.","m":"out"},{"s":"Your little brother keeps wrecking your Lego builds, so you want a lock on your door. But look at what actually happens. He only wrecks things when you're building alone with your door shut. When your cousin builds with him, he sits and watches for a whole hour without touching a single brick. And every time he walks in, the first thing he says is 'can I help?' — and you always say no, because he'll break it.","r":"Swap places and stand where he's standing. He isn't attacking your Lego — he's trying to get IN, and 'can I help?' is the only door he knows how to knock on. A lock stops the wrecking. It doesn't touch the reason. And the reason is standing in your doorway asking to help.","m":"seat"}],"guided":[{"s":"You got 4 out of 10 on the spelling test and it feels like the whole year is ruined. Total disaster. Except — the facts. There are 30 marks in the term, so this is one of thirty. Last term you got 3 out of 10 on your FIRST test and finished the term on 8 out of 10. And you've got eleven weeks left.","m":"clock","r":"Run the clock forward: in June this is one mark out of thirty. Run it back: last term you got 3 out of 10 on your first test and you can't even remember it now. The feeling is real. The size of it is borrowed from today."},{"s":"You only get 20 minutes a day to practise piano, and that feels like not enough to get good. But here's what actually happens. When you had an hour, you played the songs you already know, because they're fun and you sound great at them. With 20 minutes you only have time for the one bar you keep fumbling — the same bar, every single day, for a week. Your teacher says that bar is now the only part you never get wrong. The bar you hate is now your best bar.","m":"flip","r":"Twenty minutes a day is WHY you'd get good. With an hour you'd play the bits you already like. With twenty minutes you have to pick the one bar you keep fumbling — and the limit picked the right practice for you. The wall was the teacher all along."}],"solo":[{"s":"Your friends always pick the one game you're worst at, and you're starting to think you should leave the group. Here's lunch break, exactly. Mia picks the game every single day. Mia always picks dodgeball. You're the worst at dodgeball. Nobody else has EVER picked — nobody's ever even asked. Mia is the self-appointed Minister of Games and nobody voted for her.","m":"in","r":"'Should I leave my friends' is an ENORMOUS question. Underneath it is a tiny one: one person picks the game, at one moment, once a day. Asking Mia for a turn, or suggesting you take turns, is a small cheap thing to try. Changing a friendship is not. Always check whether the huge problem has a small one hiding inside it."},{"s":"Homework takes you three hours. Everyone else says it takes them one. Your week, exactly. You start at 4 and finish at 7, too tired to do anything but sleep. The next day you start tired, so the same homework takes even longer. By Friday you finish at 8. On Monday you start the week already tired. It's like a snowball rolling downhill, except the snowball is you and the hill is homework.","m":"loop","r":"Three hours makes you tired. Tired makes tomorrow's homework slower, which makes you more tired. You never get an evening back to recover, so it never resets. That isn't a homework problem — it's a circle that feeds itself. And circles can be cut anywhere, not only at the place they started."}]},{"label":"Trickier set","watch":[{"s":"Your class keeps getting louder every afternoon and the teacher keeps moving the loudest kids. But here is the pattern. It starts quiet, then one person whispers, then their table laughs, then the next table starts talking to hear each other over the laughing, then the teacher raises her voice to be heard over the talking, and now everyone is shouting to be heard over the teacher. Moving the loud kids did not help - the noise just started somewhere else the next day.","r":"Spot the Circle: quiet, then a whisper, then a laugh, then talking to be heard, then the teacher louder, then shouting to be heard. Each step causes the next one. Moving kids treats one link and the circle just starts somewhere else. Break it anywhere - one quiet table resets the whole loop. Step Back only shows you a noisy room. The room is not the answer. The chain is.","m":"loop"},{"s":"Your best friend has stopped sitting with you at lunch and you are sure she is angry with you. The facts: she started sitting with the new girl on Monday. The new girl eats alone if nobody sits with her, and your friend told you last week she remembers what that felt like at her old school. She still saves you a seat at morning break and she still texts you every night.","r":"Swap Places and stand where she is standing. She is not leaving you - she is sitting with the girl who would eat alone, the way someone once sat with her. The seat at morning break and the texts every night are the facts that do not fit 'angry'. She has room for two tables. Step Back shows a fine friendship, which is true, but it does not explain lunch. Swap Places does.","m":"seat"}],"guided":[{"s":"You hate reading time because you are the slowest reader in the class and everyone finishes before you. But look at the actual numbers. You read 20 pages in reading time. The fastest kid reads 24. You both read the same book. And you are the only one who can tell the teacher what happened in chapter 4 without looking back.","r":"Look Closer: 'slowest reader' is a huge label for a 4-page gap, and the gap hides the real question - who actually remembers the chapter? You do. The problem was never speed. It was measuring the wrong thing. Spot the Circle would say slow reading feeds itself, but the numbers say there is no circle here - just a 4-page gap and a memory nobody else has.","m":"in"},{"s":"Your team lost the grand final by one point and it feels like the worst day of the year. Run the clock. Last year you lost in the semi-finals by twenty points. This year you lost the final by one. Their best player turns fourteen next season and moves up an age group. Yours does not.","r":"Run the Clock forward: last year a semi-final loss by twenty, this year a final lost by one - the line is pointing the right way, and next year the team that beat you loses its best player to the older group. Run it back: the worst day of the year is also the best your team has ever done. Turn It Around would say the loss itself helped - it did not. What helps is what next year looks like from here.","m":"clock"}],"solo":[{"s":"Everyone in your class is arguing about whether the school should ban phones at lunch. Half the class says phones ruin lunch. The other half says banning them ruins lunch. You keep going around in circles. But step back: nobody is arguing about lunch. The phone kids eat together at the phone table. The no-phone kids eat together at the other table. Lunch already split into two lunches months ago - the argument is about which lunch counts as the real one.","r":"Step Back: the argument is not about phones, it is about two lunches that already exist. The phone table and the other table stopped being one lunch months ago. You cannot settle 'should we ban phones' until you see that the question is really 'whose lunch is lunch?' Look Closer would hunt for one small thing hiding inside it - but there is no small thing here. The whole shape is the problem: two tables, two lunches.","m":"out"},{"s":"You have to do a talk in front of the whole class and you are terrified of looking stupid. Here is the thing nobody tells you: the kids who look stupid are the ones who memorised every word and freeze when they forget one. The kids who do best are the ones who mess up, laugh, and keep going - because the class likes them more after the mess-up, not less. The audience is on your side exactly when you stop pretending you do not need them.","r":"Turn It Around: the mess-up you are scared of is the thing that makes the talk work. A perfect talk keeps the class at arm's length; a stumble invites them in. The thing in your way - looking silly - is the thing that makes them like you. You do not need to be flawless. You need one honest stumble. Swap Places would say the audience is kind - true, and it does not fix the fear. The fear is about you looking stupid, and the fix is that looking stupid is the move, not the mistake.","m":"flip"}]}]},"older":{"label":"Older (14+ / adult)","sets":[{"label":"First set","watch":[{"s":"Your team's releases keep breaking. Everyone agrees the answer is more testing.","r":"Plot the bugs by day: they cluster on Fridays. This isn't a testing problem, it's a deadline-shape problem — you ship when people are tired. And more tests would have made it <em>harder</em> to see, because they'd quietly absorb the symptom while the cause kept running.","m":"out"},{"s":"A city has terrible traffic, so it widens the motorway.","r":"Wider road → faster commute → living further out becomes reasonable → more cars → traffic. It's called induced demand, and the fix fed the problem. Anything that makes a system's pain cheaper tends to buy you more of whatever was causing the pain.","m":"loop"}],"guided":[{"s":"Customers keep asking for a feature you're fairly sure is a bad idea.","m":"seat","r":"From their seat they are not requesting a feature. They're describing a workaround they already built for a problem you never saw. The feature is <em>their solution</em>, not their need — which is why it looks wrong from here. Ask what they did the last time it happened, not what they want."},{"s":"\"Our marketing isn't working.\"","m":"in","r":"\"Marketing\" isn't a thing that can fail; it's a word covering about nine things. Somewhere between a person first hearing the name and a person paying, there is exactly one step where most of them stop. That step is the actual problem, it is much smaller than \"marketing\", and you can usually find it in an afternoon."}],"solo":[{"s":"You never have time to learn the thing that would save you time.","m":"loop","r":"No time → don't learn the time-saver → still no time. It's self-sealing, and self-sealing loops never open by trying harder <em>inside</em> them — the loop is what's converting your effort into more loop. They open when someone spends, once, a resource they've decided they can't afford."},{"s":"A charity finds that donations drop every time it publishes how efficiently it spends money.","m":"seat","r":"From the donor's chair the message isn't \"we're careful with your money.\" It reads as \"we're fine.\" Efficiency sounds like <em>sufficiency</em>, and nobody rushes to rescue something that's coping. The numbers were true and the reader was wrong — which is a failure of seating, not of honesty."}]},{"label":"Trickier set","watch":[{"s":"Your startup's churn is up 20% and the board wants a retention programme. But look at the numbers underneath: churn is up only among customers who joined during the discount campaign. Full-price customers churn at the same rate as last year. The discount brought in people who were never going to stay - they came for the price, and the price went back up.","r":"Look Closer: 'churn is up 20%' is one big number hiding two different populations. Full-price churn has not moved. The campaign bought a crowd that was always going to leave, and now their leaving looks like a product problem. The retention programme would be treating customers who were never yours. Step Back shows a company-wide retention problem - but there is not one. There is a campaign-shaped hole, and it closes itself when the discount cohort finishes leaving.","m":"in"},{"s":"A museum's most popular exhibit is also its most complained-about: visitors say it is too crowded to enjoy. The director's instinct is to cap tickets. But the complaints started the year the museum added a cafe next door - and the cafe's queue runs through the exhibit hall. The crowd is not there for the exhibit. It is queuing for coffee, inside the thing they came to see.","r":"Turn It Around: the crowd is the problem and the crowd is also the clue - nobody is complaining about the exhibit, they are complaining about standing in a coffee queue that happens to be inside it. Move the queue and the 'too popular' exhibit is popular again. The thing ruining the exhibit is the thing feeding it. Spot the Circle would say crowds attract crowds - true of the cafe, not of the exhibit. The loop is coffee, queue, crowd. Break it at the queue, not at the door.","m":"flip"}],"guided":[{"s":"Two departments have been fighting over the same budget for a year and every meeting ends the same way. Finance says marketing spends too much. Marketing says finance does not understand growth. But step back and count: the budget they are fighting over is 4% of company spend. The real money - 60% - sits in a contract nobody has renegotiated in six years, and neither department owns it, so neither of them fights about it.","r":"Step Back: a year of fighting over 4% while 60% sits untouched in a contract nobody owns. The fight is not about the money - it is about the only money either side is allowed to touch. The boundary of the argument is the problem; the budget line they cannot see is where the money actually is. Swap Places would help each side understand the other - and they already do. Understanding is not the missing piece. The missing piece is the 60% neither of them is looking at.","m":"out"},{"s":"A hospital ward keeps missing its discharge targets, so management adds a daily targets meeting. The meeting takes the senior nurse off the ward for an hour. Discharges slip further. Management adds a second meeting to find out why. The senior nurse is now off the ward for two hours, and the targets slip further still.","r":"Spot the Circle: missed targets, meeting, nurse off the ward, more missed targets, another meeting. Every attempt to fix it feeds it. The meeting is not observing the problem, it IS the problem - it takes the one person who moves discharges off the floor to talk about discharges. Cut the circle anywhere: cancel one meeting and the nurse is back where the work happens. Run the Clock would ask what this looks like next month - worse, by the same mechanism. The clock does not break circles; it just shows you them getting bigger.","m":"loop"}],"solo":[{"s":"Your open-source project keeps getting angry issues from users, and the maintainers are burning out. The issues all read the same way: 'this does not work'. But check what actually happened in the last ten: seven of them never said what they tried, three of them were using a two-year-old version, and every single one of them got a fix within a day - then never came back to say thanks, or to say it worked. The maintainers see a wall of anger. The users see a wall of silence.","r":"Swap Places: from the user's seat, 'this does not work' is the whole report they know how to write, and silence after a fix reads as 'nobody cares'. From the maintainer's seat, silence after a fix reads as 'nobody appreciates it'. Both sides are reading the same silence and hearing opposite things. The fix is not a better issue template - it is a reply that says 'fixed, let us know', so the silence stops meaning two different things. Look Closer would hunt for the one broken thing in the ten issues - but there is not one. The versions differ, the reports differ. The common thread is what happens after the fix: nothing. And nothing is doing the damage.","m":"seat"},{"s":"You have been in the same job for six years and you tell yourself you are stuck. The facts: in year one you could not run a meeting. In year three you ran the biggest project in the team. This year you trained two people to do the job you had in year three. Your title has not changed once. Your work has changed completely - three times - and the title is the only thing standing still.","r":"Run the Clock back: year one you could not run a meeting; year three you ran the biggest project; this year you trained your own replacements. Run it forward: the person who trained two successors is not stuck, they are out of room in this shape. The title is a label from year one, and you are measuring a six-year career against a word that stopped moving in year two. Turn It Around would say being stuck is useful - it is not. What is useful is seeing that 'stuck' describes the title, not the work. The work moved three times. The word did not.","m":"clock"}]}]}};

const PHASES = [
  { key: 'watch', label: 'Guess the trick', note: 'Tap the move you think it is. A guess, not a grade.' },
  { key: 'guided', label: 'Your turn, with the name', note: 'Your move is dealt face up. Say your reframe out loud, then see the expert.' },
  { key: 'solo', label: 'On your own', note: 'Say your reframe out loud — and tap the move you used.' }
];

let state = { track: null, set: 0, round: 0, picked: null, revealed: false };

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function roundsFor(trackKey, setIdx) {
  const t = TRACKS[trackKey].sets[setIdx];
  const out = [];
  for (const p of PHASES) {
    t[p.key].forEach(function (d) {
      out.push({ phase: p.key, phaseLabel: p.label, s: d.s, r: d.r, m: d.m });
    });
  }
  return out;
}

function moveRow() {
  const keys = Object.keys(MOVES);
  const round = state.track ? roundsFor(state.track, state.set)[state.round] : null;
  const pickable = !!(round && (round.phase === 'watch' || round.phase === 'solo') && !state.revealed);
  return '<div class="moverow">' + keys.map(function (k, i) {
    const sel = state.picked === k ? ' sel' : '';
    const pick = pickable ? ' pickable' : '';
    const click = pickable ? ' onclick="pickMove(\'' + k + '\')"' : '';
    return '<button type="button" class="movecard c' + i + sel + pick + '"' + click + '>' +
      '<span class="movename">' + esc(MOVES[k].name) + '</span>' +
      '<span class="movehint">' + esc(MOVES[k].hint) + '</span></button>';
  }).join('') + '</div>';
}

function progressBar() {
  const rounds = roundsFor(state.track, state.set);
  let segs = '';
  for (let i = 0; i < rounds.length; i++) {
    const cls = i < state.round ? 'seg done' : (i === state.round ? 'seg now' : 'seg');
    segs += '<span class="' + cls + '"></span>';
  }
  const setLabel = state.set === 1 ? 'Trickier set · ' : '';
  const label = state.round >= rounds.length
    ? setLabel + 'Table talk'
    : setLabel + 'Round ' + (state.round + 1) + ' of ' + rounds.length + ' — ' + esc(rounds[state.round].phaseLabel);
  return '<div class="progress"><span class="roundlabel">' + label + '</span><span class="segs">' + segs + '</span></div>';
}

function expertCard(round) {
  let html = '<div class="expwrap"><div class="burst"></div><div class="card exp">' +
    '<span class="sticker expert">The expert says…</span>' +
    '<div class="eyebrow">Expert card</div>' +
    '<p class="reframe">' + round.r + '</p>' +
    '<div class="movetag">Move: ' + esc(MOVES[round.m].name) + '</div>' +
    '<p class="cardfoot">Not a right answer — just a different one.</p></div></div>';
  if ((round.phase === 'watch' || round.phase === 'solo') && state.picked) {
    const named = state.picked === round.m;
    html += '<p class="compare">You picked <strong>' + esc(MOVES[state.picked].name) + '</strong>. ' +
      (named ? 'Same move the expert used. Nice spot!' :
        'The expert used <strong>' + esc(MOVES[round.m].name) + '</strong> — re-read the reframe with that move in mind.') +
      '</p>';
  }
  html += '<p class="beat">Beat the expert: whose works better here — yours or the expert’s — and why?</p>';
  return html;
}

function render() {
  const app = document.getElementById('app');
  if (!state.track) {
    app.innerHTML =
      '<p class="prompt">Six tricks. Six problems. <span class="hi">Can you spot the trick?</span></p>' +
      '<div class="trackpick">' +
      '<button type="button" class="trackbtn younger" onclick="pickTrack(\'younger\')"><strong>Younger</strong><span>Roughly 9–13. Six rounds, about fifteen minutes.</span></button>' +
      '<button type="button" class="trackbtn older" onclick="pickTrack(\'older\')"><strong>Older</strong><span>14+ / adult. Six rounds, about fifteen minutes.</span></button>' +
      '</div>' +
      '<p class="note">The six move cards are the tools. The game is learning their names — say the move out loud and you own it. No score, no timer, no points. Just the tricks.</p>' +
      '<p class="note">Two sets per track, six rounds each. Finish one and you can play the other — same six moves, fresh problems.</p>';
    return;
  }
  const rounds = roundsFor(state.track, state.set);
  const round = rounds[state.round];
  if (state.round >= rounds.length) {
    const setButtons = state.set === 0
      ? '<button type="button" class="bigbtn" onclick="playSet(1)">Play another set?</button>' +
        '<button type="button" class="ghostbtn" onclick="restart()">Play this set again</button>'
      : '<button type="button" class="bigbtn" onclick="playSet(0)">Play the first set again</button>' +
        '<button type="button" class="ghostbtn" onclick="restart()">Play this set again</button>';
    const setNote = state.set === 0
      ? ''
      : '<p class="talkq">Both sets done — twelve problems across two games, same six moves.</p>';
    app.innerHTML =
      progressBar() +
      moveRow() +
      '<div class="card talk"><span class="sticker talk">Table talk</span>' +
      '<p class="talkq">1. What did you notice?</p>' +
      '<p class="talkq">2. Which bit was boring?</p>' +
      '<p class="talkq">3. Say each move back in your own words.</p>' +
      '<p class="talkq">4. Did the expert answer feel like the answer — or like another guess?</p>' +
      setNote +
      '<p class="cardfoot">A game nobody found boring usually means nobody finished it. Capture what people say, word for word.</p></div>' +
      setButtons +
      '<button type="button" class="ghostbtn" onclick="switchTrack()">Switch track</button>';
    return;
  }
  let html = progressBar();
  html += moveRow();
  html += '<div class="card"><span class="sticker problem">Problem!</span><div class="eyebrow">Situation</div><p class="sit-text">' + esc(round.s) + '</p></div>';
  if (!state.revealed) {
    if (round.phase === 'watch') {
      html += '<p class="prompt"><span class="hi">Guess the trick!</span> ' + esc(PHASES[0].note) + '</p>';
      html += '<button type="button" class="bigbtn" onclick="reveal()" ' +
        (state.picked ? '' : 'disabled') + '>Show the expert</button>';
    } else if (round.phase === 'guided') {
      html += '<p class="dealt">Your move this round: <strong>' + esc(MOVES[round.m].name) + '</strong> — ' + esc(MOVES[round.m].hint) + '</p>';
      html += '<p class="prompt">' + esc(PHASES[1].note) + '</p>';
      html += '<button type="button" class="bigbtn" onclick="reveal()">Show the expert</button>';
    } else {
      html += '<p class="prompt">' + esc(PHASES[2].note) + '</p>';
      html += '<button type="button" class="bigbtn" onclick="reveal()" ' +
        (state.picked ? '' : 'disabled') + '>Show the expert</button>';
    }
  } else {
    html += expertCard(round);
    const last = state.round === rounds.length - 1;
    html += '<button type="button" class="bigbtn" onclick="nextRound()">' +
      (last ? 'Table talk' : 'Next round') + '</button>';
  }
  app.innerHTML = html;
}

function pickTrack(key) {
  state = { track: key, set: 0, round: 0, picked: null, revealed: false };
  render();
}

/* The other set is offered only at a set's table-talk screen, as an
   opt-in to a fresh six-round game. A reload starts over at the first set. */
function playSet(set) {
  state = { track: state.track, set: set, round: 0, picked: null, revealed: false };
  render();
}

function pickMove(key) {
  if (!state.track || state.revealed) return;
  const phase = roundsFor(state.track, state.set)[state.round].phase;
  if (phase !== 'watch' && phase !== 'solo') return;
  state.picked = key;
  render();
}

function reveal() {
  state.revealed = true;
  render();
}

function nextRound() {
  state.round += 1;
  state.picked = null;
  state.revealed = false;
  render();
}

function restart() {
  state = { track: state.track, set: state.set, round: 0, picked: null, revealed: false };
  render();
}

function switchTrack() {
  state = { track: null, set: 0, round: 0, picked: null, revealed: false };
  render();
}

render();
</script>
</body>
</html>
