<title>Story Squeezer - practise spotting what matters</title>
<style>
  :root{
    --bg:#fdf6e3; --panel:#fffdf7; --ink:#2b2118; --muted:#6f6152;
    --line:#e5dcc4; --accent:#b4532a; --accent-soft:#f4e6df;
    --good:#2f6b4a; --good-soft:#e2f0e6; --gold:#8a6d1b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.5}
  #app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
  h1{font-size:34px;line-height:1.15;margin:8px 0 4px}
  h2{font-size:24px;margin:6px 0 10px}
  h3{font-size:19px;margin:18px 0 6px}
  p{margin:8px 0}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:4px 12px;
    font-size:14px;font-family:system-ui,sans-serif}
  .muted{color:var(--muted)}
  .small{font-size:15px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .chunk{background:#f7efdc;border-left:4px solid var(--accent);border-radius:8px;
    padding:12px 14px;margin:10px 0}
  .storytext{background:#f7efdc;border-radius:8px;padding:12px 14px;margin:10px 0}
  button{font-family:system-ui,sans-serif;font-size:17px;min-height:48px;
    border-radius:12px;border:2px solid var(--accent);background:var(--panel);
    color:var(--ink);padding:10px 16px;margin:6px 6px 6px 0;cursor:pointer;
    text-align:left;line-height:1.35}
  button:hover{background:var(--accent-soft)}
  button.primary{background:var(--accent);color:#fff;font-weight:700;text-align:center}
  button.primary:disabled{background:#cbb9a8;border-color:#cbb9a8;cursor:default}
  button:disabled{opacity:.55;cursor:default}
  button.picked{background:var(--accent-soft);border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent) inset}
  button.correct{background:var(--good-soft);border-color:var(--good)}
  button.wrongpick{background:#f7e8e2;border-color:#a4553a}
  .opt{display:block;width:100%}
  .tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .tile{min-height:48px;min-width:64px;padding:10px 14px;border-radius:999px;
    border:2px solid var(--accent);background:var(--panel);font-size:17px;
    font-family:system-ui,sans-serif;cursor:pointer}
  .tile.picked{background:var(--accent);color:#fff;font-weight:700}
  .tile.keep{background:var(--good-soft);border-color:var(--good);font-weight:700}
  .tile.miss{opacity:.55}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;
    padding:4px 12px;font-size:14px;font-family:system-ui,sans-serif;background:var(--panel)}
  .pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pill.locked{opacity:.55}
  .score{font-size:20px;font-weight:700}
  .why{background:var(--good-soft);border-radius:8px;padding:10px 14px;margin:10px 0}
  .gentle{background:#f7e8e2;border-radius:8px;padding:10px 14px;margin:10px 0}
  .banner{background:var(--accent-soft);border:1px dashed var(--accent);
    border-radius:var(--radius);padding:14px;margin:12px 0;text-align:center}
  .progress{font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
  details{margin:10px 0}
  summary{cursor:pointer;font-family:system-ui,sans-serif;font-size:16px;
    min-height:44px;line-height:44px}
  .hidden{display:none}
</style>
</head>

const LEVELS = {
  1: {name: "Sprout Squeezer", blurb: "60-word stories, one paragraph, clear traps."},
  2: {name: "Detective Squeezer", blurb: "100-word stories, two paragraphs, trickier traps."},
  3: {name: "Editor Squeezer", blurb: "140-word stories, with a twist. Subtle traps."}
};
const ROUNDS_PER_GAME = 5;
const UNLOCK_GAMES = 2;      // qualifying games needed to unlock the next level
const UNLOCK_HEADLINES = 3;  // headlines correct per qualifying game

/* ---- tiny storage, safe when localStorage is unavailable ---- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("squeezer:"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("squeezer:"+k, JSON.stringify(v)); }catch(e){} }
};
function unlockedLevels(){ const u = store.get("unlocked", [1]); return [1,2,3].filter(function(l){ return u.indexOf(l) >= 0; }); }
function isUnlocked(l){ return unlockedLevels().indexOf(l) >= 0; }
function bestFor(l){ return store.get("best:"+l, null); }
function qualifyingGames(l){ return store.get("qual:"+l, 0); }

/* ---- helpers ---- */
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function words(s){ return s.trim().split(/\s+/).filter(Boolean).length; }
function fullText(t){ return t.chunks.join(" "); }
function poolFor(level){ return TEXTS.filter(function(t){ return t.level === level; }); }
function drawTexts(level, n){
  const pool = shuffle(poolFor(level));
  return pool.slice(0, Math.min(n, pool.length));
}
function headlineByKind(t, kind){ return t.headlines.filter(function(h){ return h.kind === kind; })[0]; }
function correctHeadline(t){ return headlineByKind(t, "correct"); }
function trapLabel(kind){
  return {detail:"a juicy detail", narrow:"true of one part only", broad:"true of the topic, not this story"}[kind] || "not the main idea";
}

/* ---- session state ---- */
let S = null;   // the current game
function newGame(mode, level){
  S = {
    mode: mode, level: level,
    texts: drawTexts(level, ROUNDS_PER_GAME),
    round: 0,                       // 0-based
    screen: "predict",              // predict | chunks | squeeze | squeezeB | handoff | feedback | results
    revealed: 1,                    // chunks revealed in the read step
    predPick: null,                 // index into predictions
    predCorrect: null,
    headPick: null,                 // headline text picked (player A / squeezer)
    headPickB: null,                // headline text picked by player B (Both Squeeze)
    keepPick: [],                   // keeper words picked
    keepPickB: [],
    totals: {pred: 0, head: 0, keep: 0, keepMax: 0},
    perPlayer: {predA: 0, predB: 0},
    roundLog: []
  };
  dealRound();
  render();
}
function dealRound(){
  // Shuffle each round's options ONCE, so re-renders never move buttons.
  const t = currentText();
  S.predOrder = shuffle(t.predictions);
  S.headOrder = shuffle(t.headlines);
  S.trayOrder = shuffle(t.tray);
}
function currentText(){ return S.texts[S.round]; }
function predictor(){ return (S.round % 2 === 0) ? "Player 1" : "Player 2"; }  // Take Turns
function squeezer(){ return (S.round % 2 === 0) ? "Player 2" : "Player 1"; }
function roundTitle(){
  return "Story " + (S.round+1) + " of " + ROUNDS_PER_GAME + " - " + LEVELS[S.level].name;
}

/* ---- flow actions (called from buttons) ---- */
function pickPrediction(i){
  if(S.screen !== "predict" || S.predPick !== null) return;
  S.predPick = i;
  S.predCorrect = !!S.predOrder[i].correct;
  if(S.predCorrect){ S.totals.pred++; if(predictor()==="Player 1") S.perPlayer.predA++; else S.perPlayer.predB++; }
  render();
}
function goChunks(){ S.screen = "chunks"; S.revealed = 1; render(); }
function chunkStep(d){
  S.revealed = Math.max(1, Math.min(3, S.revealed + d));
  render();
}
function goSqueeze(){ S.screen = "squeeze"; render(); }
function pickHeadline(text){
  if(S.screen === "squeeze") S.headPick = text;
  else if(S.screen === "squeezeB") S.headPickB = text;
  render();
}
function toggleKeeper(w){
  const list = (S.screen === "squeeze") ? S.keepPick : S.keepPickB;
  const i = list.indexOf(w);
  if(i >= 0) list.splice(i, 1);
  else if(list.length < 5) list.push(w);
  render();
}
function squeezeReady(){
  if(S.screen === "squeeze") return S.headPick !== null && S.keepPick.length === 5;
  if(S.screen === "squeezeB") return S.headPickB !== null && S.keepPickB.length === 5;
  return false;
}
function checkSqueeze(){
  if(!squeezeReady()) return;
  if(S.mode === "both" && S.screen === "squeeze"){ S.screen = "handoff"; render(); return; }
  finishRound();
}
function goSqueezeB(){ S.screen = "squeezeB"; render(); }
function keepScore(picks, t){
  let n = 0;
  picks.forEach(function(w){ if(t.keepers.indexOf(w) >= 0) n++; });
  return n;
}
function finishRound(){
  const t = currentText();
  const headOk = (S.mode === "both")
    ? (S.headPick === correctHeadline(t).text || S.headPickB === correctHeadline(t).text)
    : (S.headPick === correctHeadline(t).text);
  let keepOk;
  if(S.mode === "both"){
    keepOk = Math.max(keepScore(S.keepPick, t), keepScore(S.keepPickB, t));
  } else {
    keepOk = keepScore(S.keepPick, t);
  }
  if(headOk) S.totals.head++;
  S.totals.keep += keepOk;
  S.totals.keepMax += 5;
  S.roundLog.push({headOk: headOk, keepOk: keepOk, predOk: S.predCorrect});
  S.screen = "feedback";
  render();
}
function nextRound(){
  S.round++;
  if(S.round >= ROUNDS_PER_GAME){ finishGame(); return; }
  S.screen = "predict"; S.revealed = 1; S.predPick = null; S.predCorrect = null;
  S.headPick = null; S.headPickB = null; S.keepPick = []; S.keepPickB = [];
  dealRound();
  render();
}
function finishGame(){
  const l = S.level;
  // best accuracy per level
  const prev = bestFor(l);
  if(!prev || S.totals.head > prev.head || (S.totals.head === prev.head && S.totals.keep > prev.keep)){
    store.set("best:"+l, {head: S.totals.head, keep: S.totals.keep});
  }
  // unlock rule: 2 games at a level with at least 3 of 5 headlines correct
  S.unlocked = false;
  if(S.totals.head >= UNLOCK_HEADLINES){
    const q = qualifyingGames(l) + 1;
    store.set("qual:"+l, q);
    if(q >= UNLOCK_GAMES && l < 3 && !isUnlocked(l+1)){
      const u = unlockedLevels(); u.push(l+1);
      store.set("unlocked", u);
      S.unlocked = l+1;
    }
  }
  S.screen = "results";
  render();
}
function goHome(){ S = null; render(); }
function playAgain(){ newGame(S.mode, S.level); }

/* ---- rendering ---- */
const app = (typeof document !== "undefined") ? document.getElementById("app") : null;
function render(){
  if(!app) return;
  if(!S){ app.innerHTML = homeHtml(); return; }
  if(S.screen === "predict") app.innerHTML = predictHtml();
  else if(S.screen === "chunks") app.innerHTML = chunksHtml();
  else if(S.screen === "squeeze") app.innerHTML = squeezeHtml("A");
  else if(S.screen === "handoff") app.innerHTML = handoffHtml();
  else if(S.screen === "squeezeB") app.innerHTML = squeezeHtml("B");
  else if(S.screen === "feedback") app.innerHTML = feedbackHtml();
  else if(S.screen === "results") app.innerHTML = resultsHtml();
  window.scrollTo(0, 0);
}
function homeHtml(){
  let levels = "";
  [1,2,3].forEach(function(l){
    const locked = !isUnlocked(l);
    const best = bestFor(l);
    const q = qualifyingGames(l);
    levels += '<div class="card"><strong>' + LEVELS[l].name + '</strong> '
      + (locked ? '<span class="pill locked">Locked</span>' : '<span class="pill on">Open</span>') + '<br>'
      + '<span class="muted small">' + LEVELS[l].blurb + '</span><br>'
      + (best ? '<span class="small">Best so far: ' + best.head + ' of 5 headlines, ' + best.keep + ' of 25 keeper words.</span><br>' : '')
      + (l < 3 && !locked ? '<span class="small muted">Qualifying games towards ' + LEVELS[l+1].name + ': ' + Math.min(q, UNLOCK_GAMES) + ' of ' + UNLOCK_GAMES + ' (need ' + UNLOCK_HEADLINES + ' of 5 headlines).</span>' : '')
      + (locked ? '<br><span class="small muted">Unlocks after ' + UNLOCK_GAMES + ' games at ' + LEVELS[l-1].name + ' with at least ' + UNLOCK_HEADLINES + ' of 5 headlines.</span>' : '')
      + '<br><button class="primary" ' + (locked ? 'disabled' : '') + ' onclick="startLevel(' + l + ')">Play ' + LEVELS[l].name + '</button></div>';
  });
  return '<h1>Story Squeezer</h1>'
    + '<p><strong>Practise spotting what matters in a story.</strong></p>'
    + '<p class="muted">Read a short true story, then squeeze it: pick the headline that says what it is mostly about, and keep the five words that matter most. No timers, no streaks - just reading with a question in mind.</p>'
    + '<h3>How to play</h3>'
    + '<p class="small">1. <strong>Question first</strong> - guess what the story will mostly be about.<br>'
    + '2. <strong>Read in chunks</strong> - three short cards, in your own time. Re-read as much as you like.<br>'
    + '3. <strong>The squeeze</strong> - pick 1 headline from 4, and keep 5 words from a tray of 10.<br>'
    + '5 stories per game, about 10 minutes.</p>'
    + '<h3>Play together</h3>'
    + '<p><button class="primary" onclick="pickMode(\'turns\')">Take Turns</button>'
    + '<button onclick="pickMode(\'both\')">Both Squeeze</button></p>'
    + '<p class="small muted">Take Turns: alternate who predicts and who squeezes each story. '
    + 'Both Squeeze: you both squeeze the same story in secret, then compare - if either of you gets the headline, you both get the point.</p>'
    + '<div id="modeNote"></div>'
    + '<h3>Levels</h3>' + levels
    + '<p class="small muted">Levels never drop and never lock backwards. Replay any open level whenever you like.</p>';
}
let HOME_MODE = "turns";
function pickMode(m){
  HOME_MODE = m;
  render();
  const n = document.getElementById("modeNote");
  if(n) n.innerHTML = '<p class="card"><strong>' + (m === "turns" ? "Take Turns" : "Both Squeeze") + '</strong> chosen. Pick a level below to play.</p>';
}
function startLevel(l){ if(isUnlocked(l)) newGame(HOME_MODE, l); }

function predictHtml(){
  const t = currentText();
  const who = (S.mode === "turns") ? predictor() + " predicts" : "Predict together";
  let h = '<p class="progress">' + roundTitle() + ' &middot; ' + esc(t.topic) + '</p>'
    + '<h2>' + esc(t.title) + '</h2>'
    + '<p><span class="tag">' + esc(t.topic) + '</span></p>'
    + '<div class="card"><h3>Question first</h3><p>' + esc(who) + ' - hold this question in mind:</p>'
    + '<p><strong>' + esc(t.question) + '</strong></p>'
    + '<p class="small muted">What will this story mostly be about? A warm-up guess - 1 point if you are right, "Good guess" either way.</p>';
  S.predOrder.forEach(function(p, i){
    let cls = "";
    if(S.predPick !== null){
      if(p.correct) cls = "correct";
      else if(i === S.predPick) cls = "wrongpick";
    }
    h += '<button class="opt ' + cls + '" ' + (S.predPick !== null ? 'disabled' : '') + ' onclick="pickPrediction(' + i + ')">' + esc(p.text) + '</button>';
  });
  if(S.predPick !== null){
    h += '<p>' + (S.predCorrect ? '<strong>Good guess - that is what it is mostly about.</strong>' : '<strong>Good guess.</strong> The story is mostly about: <strong>' + esc(t.predictions.filter(function(p){ return p.correct; })[0].text) + '</strong>') + '</p>'
      + '<button class="primary" onclick="goChunks()">Read the story</button>';
  }
  h += '</div>';
  return h;
}
function chunksHtml(){
  const t = currentText();
  let h = '<p class="progress">' + roundTitle() + ' &middot; ' + esc(t.topic) + '</p>'
    + '<h2>' + esc(t.title) + '</h2>'
    + '<div class="card"><h3>Read in chunks</h3>'
    + '<p class="small muted">Take your time. Nothing disappears, and you can re-read as much as you like.</p>';
  for(let i = 0; i < 3; i++){
    if(i < S.revealed) h += '<div class="chunk">' + esc(t.chunks[i]) + '</div>';
    else h += '<div class="chunk" style="opacity:.45">Chunk ' + (i+1) + ' - tap "Next chunk" to reveal it.</div>';
  }
  h += '<div class="row">'
    + '<button onclick="chunkStep(-1)" ' + (S.revealed <= 1 ? 'disabled' : '') + '>Back to chunk</button>'
    + (S.revealed < 3
        ? '<button class="primary" onclick="chunkStep(1)">Next chunk</button>'
        : '<button class="primary" onclick="goSqueeze()">Squeeze it</button>')
    + '</div></div>';
  return h;
}
function squeezeHtml(who){
  const t = currentText();
  const headPick = (who === "A") ? S.headPick : S.headPickB;
  const keepPick = (who === "A") ? S.keepPick : S.keepPickB;
  const heads = S.headOrder;
  const tray = S.trayOrder;
  const label = (S.mode === "both")
    ? (who === "A" ? "Player A is squeezing - Player B, look away!" : "Player B is squeezing - Player A, look away!")
    : squeezer() + " squeezes";
  let h = '<p class="progress">' + roundTitle() + ' &middot; ' + esc(t.topic) + '</p>'
    + '<h2>' + esc(t.title) + '</h2>'
    + '<div class="banner"><strong>' + esc(label) + '</strong></div>'
    + '<details><summary>Show the story again</summary><div class="storytext">' + t.chunks.map(esc).join("</div><div class=\"storytext\">") + '</div></details>'
    + '<div class="card"><h3>Pick the headline</h3>'
    + '<p class="small muted">Which one says what the whole story is mostly about?</p>';
  heads.forEach(function(hd){
    h += '<button class="opt ' + (headPick === hd.text ? 'picked' : '') + '" onclick="pickHeadline(' + JSON.stringify(hd.text) + ')">' + esc(hd.text) + '</button>';
  });
  h += '</div><div class="card"><h3>Keep 5 words</h3>'
    + '<p class="small muted">Tap 5 words from the tray - the ones the story could not do without. ' + keepPick.length + ' of 5 kept.</p><div class="tray">';
  tray.forEach(function(w){
    h += '<button class="tile ' + (keepPick.indexOf(w) >= 0 ? 'picked' : '') + '" onclick="toggleKeeper(' + JSON.stringify(w) + ')">' + esc(w) + '</button>';
  });
  h += '</div><button class="primary" ' + (squeezeReady() ? '' : 'disabled') + ' onclick="checkSqueeze()">Check my squeeze</button></div>';
  return h;
}
function handoffHtml(){
  return '<p class="progress">' + roundTitle() + '</p>'
    + '<div class="banner"><h2>Player A is done</h2>'
    + '<p>Player A, look away now. Player B - your turn to squeeze the same story.</p>'
    + '<button class="primary" onclick="goSqueezeB()">Player B, start squeezing</button></div>';
}
function feedbackHtml(){
  const t = currentText();
  const log = S.roundLog[S.roundLog.length-1];
  const correct = correctHeadline(t);
  let h = '<p class="progress">' + roundTitle() + ' &middot; ' + esc(t.topic) + '</p>'
    + '<h2>' + esc(t.title) + '</h2>';
  if(S.mode === "both"){
    h += '<div class="card"><h3>Side by side</h3>'
      + '<p>Player A picked: <strong>' + esc(S.headPick) + '</strong> ' + (S.headPick === correct.text ? '(that is the main idea)' : '') + '</p>'
      + '<p>Player B picked: <strong>' + esc(S.headPickB) + '</strong> ' + (S.headPickB === correct.text ? '(that is the main idea)' : '') + '</p>';
    if(S.headPick !== S.headPickB){
      h += '<p><strong>Talk it out - what did each of you notice?</strong></p>';
    }
    h += '</div>';
  } else {
    const picked = t.headlines.filter(function(x){ return x.text === S.headPick; })[0];
    if(log.headOk){
      h += '<div class="why"><strong>That is the main idea.</strong> ' + esc(t.why) + '</div>';
    } else {
      h += '<div class="gentle"><strong>Not quite - that one was ' + trapLabel(picked.kind) + ', not the main idea.</strong><br>' + esc(t.why) + '</div>';
    }
  }
  if(S.mode === "both" && !log.headOk){
    h += '<div class="gentle"><strong>Not quite this time.</strong> ' + esc(t.why) + '</div>';
  }
  h += '<div class="card"><h3>The main idea</h3><p><strong>' + esc(correct.text) + '</strong></p>'
    + '<p class="small muted">' + esc(t.why) + '</p>'
    + '<h3>The 5 keeper words</h3><p class="small muted">The words the story could not do without:</p><div class="tray">';
  t.tray.forEach(function(w){
    const isKeep = t.keepers.indexOf(w) >= 0;
    const mine = (S.mode === "both")
      ? (S.keepPick.indexOf(w) >= 0 || S.keepPickB.indexOf(w) >= 0)
      : (S.keepPick.indexOf(w) >= 0);
    let cls = "";
    if(isKeep) cls = "keep";
    else if(mine) cls = "miss";
    h += '<span class="tile ' + cls + '">' + esc(w) + (isKeep && mine ? ' &#10003;' : '') + '</span>';
  });
  h += '</div><p>You kept <strong>' + log.keepOk + ' of 5</strong> keeper words.</p></div>';
  h += '<div class="card"><p class="score">So far: ' + S.totals.head + ' of ' + (S.round+1) + ' headlines &middot; ' + S.totals.keep + ' of ' + S.totals.keepMax + ' keeper words &middot; ' + S.totals.pred + ' good guesses</p>';
  if(S.round+1 < ROUNDS_PER_GAME) h += '<button class="primary" onclick="nextRound()">Next story</button>';
  else h += '<button class="primary" onclick="nextRound()">See results</button>';
  h += '</div>';
  return h;
}
function resultsHtml(){
  const l = S.level;
  let h = '<h2>Game over - nicely squeezed</h2>'
    + '<p class="muted">' + LEVELS[l].name + ' &middot; ' + (S.mode === "turns" ? "Take Turns" : "Both Squeeze") + '</p>'
    + '<div class="card"><p class="score">Headlines: ' + S.totals.head + ' of ' + ROUNDS_PER_GAME + '</p>'
    + '<p class="score">Keeper words: ' + S.totals.keep + ' of ' + S.totals.keepMax + '</p>'
    + '<p class="score">Good guesses: ' + S.totals.pred + ' of ' + ROUNDS_PER_GAME + '</p>';
  if(S.mode === "turns"){
    h += '<p class="small">Predictions: Player 1 got ' + S.perPlayer.predA + ', Player 2 got ' + S.perPlayer.predB + '.</p>';
  }
  h += '</div>';
  if(S.unlocked){
    h += '<div class="why"><strong>New level unlocked: ' + LEVELS[S.unlocked].name + '!</strong><br>'
      + 'Two games at ' + LEVELS[l].name + ' with at least ' + UNLOCK_HEADLINES + ' of 5 headlines. The next stories are longer and trickier - play it when you are ready.</div>';
  } else if(l < 3){
    h += '<div class="card"><p class="small">Towards ' + LEVELS[l+1].name + ': ' + Math.min(qualifyingGames(l), UNLOCK_GAMES) + ' of ' + UNLOCK_GAMES
      + ' qualifying games (need ' + UNLOCK_HEADLINES + ' of 5 headlines). Levels never drop - keep playing.</p></div>';
  }
  h += '<p><button class="primary" onclick="playAgain()">Play again</button>'
    + '<button onclick="goHome()">Home</button></p>'
    + '<p class="small muted">A new game deals a fresh set of stories. Replay a level any time.</p>';
  return h;
}
render();

/* ---- node harness hook: core logic without a DOM ---- */
if(typeof module !== "undefined" && module.exports){
  module.exports = {TEXTS: TEXTS, LEVELS: LEVELS, drawTexts: drawTexts, correctHeadline: correctHeadline,
    keepScore: keepScore, words: words, fullText: fullText, poolFor: poolFor, shuffle: shuffle,
    newGame: newGame, pickPrediction: pickPrediction, goChunks: goChunks, chunkStep: chunkStep,
    goSqueeze: goSqueeze, pickHeadline: pickHeadline, toggleKeeper: toggleKeeper,
    squeezeReady: squeezeReady, checkSqueeze: checkSqueeze, goSqueezeB: goSqueezeB,
    nextRound: nextRound, playAgain: playAgain, goHome: goHome, startLevel: startLevel,
    pickMode: pickMode, qualifyingGames: qualifyingGames, isUnlocked: isUnlocked, bestFor: bestFor,
    getS: function(){ return S; }};
}
</script>
