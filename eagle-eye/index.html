<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle Eye - spot the target</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#fff8e7;background-image:radial-gradient(#111 1.2px,transparent 1.2px);background-size:22px 22px;color:#111}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 40px;text-align:center}
h1{font-size:46px;margin:10px 0 4px;letter-spacing:-1px}
h1 .e{color:#00b3ff}
.sub{font-size:17px;margin:0 0 10px}
.sticker{display:inline-block;background:#7dff2e;border:3px solid #111;border-radius:999px;padding:4px 14px;font-weight:800;transform:rotate(2deg);box-shadow:3px 3px 0 #111}
.round{font-weight:800;font-size:20px;margin:14px 0}
.field{border:3px solid #111;border-radius:18px;background:#fff;box-shadow:5px 5px 0 #111;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spot{font-size:44px;min-height:72px;border:3px solid #111;border-radius:14px;background:#ffd400;cursor:pointer;box-shadow:3px 3px 0 #111;animation:bob 2.4s ease-in-out infinite}
.spot:active{transform:scale(.94)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.spot.wrong{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spot.right{background:#7dff2e;animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1)}}
.btn{display:inline-block;margin-top:20px;padding:14px 26px;font-size:18px;font-weight:800;border:3px solid #111;border-radius:999px;background:#00b3ff;color:#fff;box-shadow:4px 4px 0 #111;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #111}
.muted{color:#555;font-size:15px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <span class="sticker">a spotting game</span>
  <h1><span class="e">Eagle</span> Eye</h1>
  <p class="sub">Spot the target hiding among the floaters. Tap it!</p>
  <p class="round" id="round"></p>
  <div id="app"></div>
  <div id="end"></div>
</div>
<script>
var POOL=['\u2B50','\u{1F34E}','\u{1F34C}','\u{1F347}','\u{1F436}','\u{1F431}','\u{1F98A}','\u{1F981}','\u{1F438}','\u{1F697}','\u{1F680}','\u{1F388}','\u26BD','\u{1F308}','\u{1F355}','\u{1F369}','\u{1F98B}','\u{1F3B8}'];
var ROUNDS=10;
var round=0, target='', taps=0, lock=false;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function newGame(){
  round=0; taps=0;
  document.getElementById('end').innerHTML='';
  nextRound();
}
function nextRound(){
  round++;
  if(round>ROUNDS){win();return;}
  var pool=shuffle(POOL.slice());
  target=pool[0];
  var items=shuffle(pool.slice(0,12));
  document.getElementById('round').textContent='Round '+round+' of '+ROUNDS+' - find the '+target;
  var app=document.getElementById('app');
  app.innerHTML='<div class="field" id="field"></div>';
  var field=document.getElementById('field');
  items.forEach(function(e){
    var b=document.createElement('button');
    b.className='spot'; b.textContent=e;
    b.style.animationDuration=(1.8+Math.random()*1.6).toFixed(2)+'s';
    b.style.animationDelay=(-Math.random()*2).toFixed(2)+'s';
    b.setAttribute('aria-label','spot the '+target);
    b.addEventListener('click',function(){tap(b,e);});
    field.appendChild(b);
  });
  lock=false;
}
function tap(b,e){
  if(lock) return;
  taps++;
  if(e===target){
    lock=true; b.classList.add('right');
    setTimeout(nextRound,550);
  } else {
    b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
  }
}
function win(){
  document.getElementById('round').textContent='';
  document.getElementById('app').innerHTML='';
  document.getElementById('end').innerHTML='<p style="font-size:22px;font-weight:800;margin:18px 0 4px">All 10 spotted!</p><p class="muted" style="margin-top:0">You found every target in '+taps+' taps. Play again for a fresh set.</p><button class="btn" onclick="newGame()">Play again?</button>';
}
newGame();
</script>
</body>
</html>
